<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>修的媒体工作台 V38</title>
<style>
/* ============================================================
   主题变量与安全区域
   ============================================================ */
:root {
  color-scheme: dark;
  --brand: #5b7ff5;
  --brand-soft: rgba(91,127,245,.12);
  --brand-press: rgba(91,127,245,.20);
  --danger: #f06565;
  --danger-soft: rgba(240,101,101,.10);
  --success: #36c58a;
  --success-soft: rgba(54,197,138,.10);
  --warning: #f5a623;
  --warning-soft: rgba(245,166,35,.10);
  --transition: 220ms cubic-bezier(.32,.72,0,1);
  --card-radius: 14px;
  --touch-scale: .985;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tabbar-h: 56px;
  --header-h: 44px;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #080b14;
  --bg-elev: #0f1320;
  --surface: #141928;
  --surface-2: #1c2238;
  --border: rgba(120,140,200,.10);
  --border-soft: rgba(120,140,200,.06);
  --text: #eef1fa;
  --text-muted: #8a94b0;
  --text-dim: #555f7a;
  --overlay: rgba(0,0,0,.35);
  --bg-grad: radial-gradient(700px 400px at 80% -10%, rgba(91,127,245,.07), transparent 55%), radial-gradient(500px 300px at 20% 100%, rgba(54,197,138,.04), transparent 50%);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f8fc;
  --bg-elev: #ffffff;
  --surface: #ffffff;
  --surface-2: #f3f4f9;
  --border: #e2e5f0;
  --border-soft: #eef0f6;
  --text: #181c28;
  --text-muted: #545c75;
  --text-dim: #9099b0;
  --overlay: rgba(0,0,0,.20);
  --bg-grad: radial-gradient(700px 400px at 80% -10%, rgba(91,127,245,.05), transparent 55%), radial-gradient(500px 300px at 20% 100%, rgba(54,197,138,.03), transparent 50%);
}

/* ============================================================
   基础重置
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
html[data-theme] .header, html[data-theme] .content, html[data-theme] .tabbar, html[data-theme] .card,
html[data-theme] input, html[data-theme] textarea, html[data-theme] select, html[data-theme] .sheet,
html[data-theme] .modal-content, html[data-theme] .editor, html[data-theme] .model-item,
html[data-theme] .preset-item, html[data-theme] .source-item {
  transition: background-color var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
}
body {
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-grad), var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: .01em;
  transition: background-color 280ms ease, color 280ms ease;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
input, textarea, select {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px; outline: none; width: 100%; -webkit-appearance: none; font-size: 15px;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}
input:focus, textarea:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: var(--bg-elev); }
button, .act, .tab, .model-item, .preset-item, .source-item, .ref-add {
  transition: transform var(--transition), background-color var(--transition), border-color var(--transition), color var(--transition), opacity var(--transition);
}
button:active, .act:active, .tab:active, .model-item:active, .preset-item:active, .source-item:active, .ref-add:active { transform: scale(var(--touch-scale)); }
textarea { resize: none; min-height: 80px; }
select { background-image: none; padding-right: 32px; }
::-webkit-scrollbar { width: 0; height: 0; }
::selection { background: var(--brand-soft); }
::selection { background: var(--brand-soft); }

/* ============================================================
   Header
   ============================================================ */
.header {
  height: calc(var(--header-h) + var(--safe-top));
  padding-top: var(--safe-top);
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--safe-top) 12px 0;
  background: rgba(8,11,20,.60); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-soft); z-index: 30; position: relative; flex-shrink: 0;
}
[data-theme="light"] .header { background: rgba(255,255,255,.70); }
.header-title { font-size: 16px; font-weight: 600; letter-spacing: .02em; }
.header-actions { display: flex; align-items: center; gap: 2px; }
.header-btn {
  width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); position: relative;
}
.header-btn:active { background: var(--surface-2); }
.header-btn svg { width: 20px; height: 20px; }
.header-btn .badge {
  position: absolute; top: -2px; right: -2px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; line-height: 1;
  border: 2px solid var(--bg-elev);
}
.view-switch {
  width: 36px; height: 36px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); position: relative;
}
.view-switch.result-mode { color: var(--brand); border-color: var(--brand-soft); background: var(--brand-soft); }
.view-switch svg { width: 18px; height: 18px; }
.view-switch .badge {
  position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 3px;
  border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 9px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; line-height: 1;
  border: 2px solid var(--bg-elev);
}

/* ============================================================
   内容区 (paramView + resultView)
   ============================================================ */
.content {
  height: calc(100% - var(--header-h) - var(--safe-top) - var(--tabbar-h) - var(--safe-bottom));
  overflow: hidden; position: relative;
}
.view {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: none; padding: 12px 12px calc(20px + env(safe-area-inset-bottom));
  opacity: 0; transform: translateY(6px); pointer-events: none;
}
.view.active { display: block; animation: viewIn 220ms ease both; pointer-events: auto; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ============================================================
   模型 bar + meta
   ============================================================ */
.section { margin-bottom: 14px; }
.section-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.model-btn {
  width: 100%; padding: 11px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 14px;
}
.model-btn:active { background: var(--surface-2); }
.model-btn .model-name { font-weight: 600; }
.model-btn svg { width: 16px; height: 16px; color: var(--text-dim); }
.model-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 500; }
.tag.price { background: var(--success-soft); color: var(--success); }
.tag.async { background: var(--brand-soft); color: var(--brand); }
.tag.sync { background: var(--warning-soft); color: var(--warning); }

/* ============================================================
   提示词模块 (unified)
   ============================================================ */
.prompt-module {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--card-radius); padding: 14px; margin-bottom: 14px;
}
.prompt-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.prompt-title { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
.prompt-head-actions { display: flex; align-items: center; gap: 6px; }
.preset-btn {
  min-height: 32px; padding: 0 12px; border-radius: 8px;
  background: var(--brand-soft); color: var(--brand);
  font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;
}
.preset-btn svg { width: 14px; height: 14px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); color: var(--brand);
  display: flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 16px; height: 16px; }
#promptInput {
  min-height: 96px; font-size: 14px; line-height: 1.55;
}
.prompt-tools {
  display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap;
}
.prompt-tools button {
  min-height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--text-muted); font-size: 11px;
}
.prompt-tools button:active { background: var(--brand-soft); color: var(--brand); }
.prompt-count { margin-left: auto; font-size: 10px; color: var(--text-dim); font-family: monospace; }

/* ============================================================
   参考素材 (refs)
   ============================================================ */
.ref-wrap { margin-top: 8px; }
.ref-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.ref-item { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); border: 1px solid var(--border); }
.ref-item img { width: 100%; height: 100%; object-fit: cover; }
.ref-badge { position: absolute; top: 4px; left: 4px; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 999px; backdrop-filter: blur(6px); }
.ref-badge.local { color: #fcd34d; background: rgba(0,0,0,.55); }
.ref-badge.uploaded { color: #6ee7b7; background: rgba(0,0,0,.55); }
.ref-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fca5a5; font-size: 13px; display: grid; place-items: center; line-height: 1; }
.ref-add { aspect-ratio: 1; width: 100%; border: 2px dashed var(--border); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--brand); background: var(--brand-soft); font-size: 10px; }
.ref-add svg { width: 22px; height: 22px; }
.ref-grid-video { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
.ref-item-video { aspect-ratio: 1; }
.ref-item-video video { width: 100%; height: 100%; object-fit: cover; background: #000; }
.ref-grid-audio { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
.ref-item-audio { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 4px; }
.ref-audio-thumb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; height: 100%; }
.ref-audio-thumb svg { width: 20px; height: 20px; color: var(--brand); flex-shrink: 0; }
.ref-audio-name { font-size: 9px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; text-align: center; line-height: 1.2; }
.ref-meta-overlay { position: absolute; bottom: 4px; left: 4px; font-size: 9px; font-family: monospace; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.7); color: #fff; }
.ref-play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; font-size: 11px; pointer-events: none; }
.ref-status-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 10px; color: var(--text-muted); }
.ref-status-bar .ready { color: var(--success); }
.ref-status-bar .pending { color: var(--warning); }
.ref-status-bar button { padding: 4px 10px; border-radius: 6px; background: var(--brand-soft); color: var(--brand); font-size: 10px; font-weight: 600; }
.ref-progress { display: none; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 10px; background: var(--brand-soft); border-radius: 8px; font-size: 11px; color: var(--brand); }
.ref-progress.show { display: flex; }
.ref-progress .ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--brand); border-top-color: transparent; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   生成参数 (form-group)
   ============================================================ */
.form-group { margin-bottom: 12px; }
.form-group label { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--text); }
.form-group .req { color: var(--danger); font-size: 11px; }
.form-group .opt { color: var(--text-dim); font-size: 11px; font-weight: 400; }
.form-group .hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.form-group.error input, .form-group.error textarea, .form-group.error select { border-color: var(--danger); }
.api-section { margin: 0 0 14px; }
.api-section-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.api-mode-row { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; margin-bottom: 8px; }
.api-mode-btn { padding: 9px 6px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text-muted); font-size: 11px; min-height: 36px; }
.api-mode-btn.active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.api-mode-panel { display: none; }
.api-mode-panel.active { display: block; }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type=range] { flex: 1; appearance: none; -webkit-appearance: none; height: 6px; background: var(--surface-2); border-radius: 3px; padding: 0; border: none; }
.range-row input[type=range]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); }
.range-value { font-family: monospace; font-size: 13px; font-weight: 600; color: var(--brand); min-width: 50px; text-align: right; }
.char-counter { font-size: 11px; color: var(--text-dim); margin-top: 4px; text-align: right; }

/* ============================================================
   生成按钮 + 工作流按钮
   ============================================================ */
.workflow-row { display: flex; gap: 8px; margin-bottom: 10px; }
.workflow-row button {
  flex: 1; min-height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.workflow-row button:active { background: var(--surface-2); }
.workflow-row button svg { width: 15px; height: 15px; }
.estimate { text-align: center; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.estimate .val { color: var(--success); font-weight: 600; font-family: monospace; }
.gen-btn {
  width: 100%; padding: 15px; background: var(--brand); color: white; border-radius: 14px;
  font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;
  position: sticky; bottom: 0; z-index: 10; min-height: 52px; letter-spacing: .03em;
  box-shadow: 0 6px 20px rgba(91,127,245,.30);
  transition: all var(--transition);
}
.gen-btn:active { transform: scale(.97); }
.gen-btn:disabled { opacity: .5; box-shadow: none; }
.gen-btn svg { width: 18px; height: 18px; }

/* ============================================================
   结果视图 (任务卡)
   ============================================================ */
.task-dock {
  position: sticky; top: 0; z-index: 8; display: flex; align-items: center; justify-content: space-between;
  margin: -2px 0 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); backdrop-filter: blur(10px);
}
.task-dock b { color: var(--brand); }
.task-dock button { padding: 6px 12px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); font-size: 11px; font-weight: 600; }
.result-list { display: flex; flex-direction: column; gap: 12px; }
.empty { display: flex; flex-direction: column; align-items: center; padding: 80px 20px; text-align: center; color: var(--text-dim); }
.empty svg { width: 56px; height: 56px; opacity: .25; margin-bottom: 16px; }
.empty h3 { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; letter-spacing: .02em; }
.empty p { font-size: 12px; letter-spacing: .01em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); animation: fade-in-up 300ms cubic-bezier(.32,.72,0,1) both; }
@keyframes fade-in-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.card-model { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 10px; padding: 2px 9px; border-radius: 999px; font-weight: 500; flex-shrink: 0; }
.pill.running { background: var(--brand-soft); color: var(--brand); }
.pill.success { background: var(--success-soft); color: var(--success); }
.pill.failed { background: var(--danger-soft); color: var(--danger); }
.pill.timeout { background: var(--warning-soft); color: var(--warning); }
.pill.stopped { background: var(--surface-2); color: var(--text-dim); }
.card-prompt { padding: 8px 12px; font-size: 11px; color: var(--text-muted); background: var(--surface-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-body { padding: 10px 12px; }
.task-id { font-family: monospace; font-size: 10px; color: var(--text-dim); background: var(--surface-2); padding: 5px 8px; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; word-break: break-all; }
.task-id .copy-mini { flex-shrink: 0; padding: 3px 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; font-size: 9px; color: var(--brand); }
.bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; position: relative; }
.bar::after { content: ""; position: absolute; left: -40%; top: 0; height: 100%; width: 40%; background: var(--brand); animation: ind 1.4s infinite ease-in-out; }
@keyframes ind { 0% { left: -40%; } 100% { left: 100%; } }
.skeleton { position: relative; overflow: hidden; border-radius: 10px; background: var(--surface-2); }
.skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); animation: shimmer 1.3s infinite; }
.skeleton-media { height: 180px; margin-bottom: 8px; }
@keyframes shimmer { to { transform: translateX(100%); } }
.timer { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
.timer .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.poll-actions { display: flex; gap: 6px; margin-top: 8px; }
.poll-actions .act { flex: 1; }
.media { width: 100%; border-radius: 10px; background: var(--surface-2); overflow: hidden; margin-bottom: 8px; display: flex; justify-content: center; }
.media img, .media video { max-width: 100%; max-height: 320px; display: block; }
.media img { cursor: zoom-in; }
.media audio { width: 100%; padding: 12px; }
.url-row { display: flex; gap: 4px; align-items: center; background: var(--surface-2); padding: 6px 8px; border-radius: 8px; font-size: 10px; font-family: monospace; color: var(--text-muted); word-break: break-all; }
.url-row .copy-mini { flex-shrink: 0; padding: 4px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; font-size: 10px; color: var(--brand); }
.actions { display: flex; gap: 5px; margin-top: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.act {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; padding: 8px 11px; font-size: 11px;
  background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); border-radius: 9px;
  min-height: 34px;
}
.act:active { background: var(--brand-soft); color: var(--brand); }
.act svg { width: 14px; height: 14px; }
.act.danger { color: var(--danger); }
.act.primary { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.err-banner { background: var(--danger-soft); color: var(--danger); padding: 9px 11px; border-radius: 9px; font-size: 11px; margin-bottom: 8px; line-height: 1.5; }

/* ============================================================
   底部 Tab (图片/视频/音频)
   ============================================================ */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(8,11,20,.60); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-soft); display: flex; z-index: 20;
}
[data-theme="light"] .tabbar { background: rgba(255,255,255,.70); }
.tab {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-muted); font-size: 11px; line-height: 1; position: relative; min-height: var(--tabbar-h);
  letter-spacing: .02em;
}
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--brand); font-weight: 600; }
.tab.active::before { content: ""; position: absolute; top: 0; width: 24px; height: 2px; background: var(--brand); border-radius: 0 0 3px 3px; }

/* ============================================================
   Sheets (bottom drawers)
   ============================================================ */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 90; opacity: 0; pointer-events: none; transition: opacity var(--transition); }
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,19,32,.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 100;
  transform: translateY(100%); transition: transform 320ms cubic-bezier(.32,.72,0,1);

  box-shadow: 0 -8px 40px rgba(0,0,0,.20);
}
[data-theme="light"] .sheet { background: rgba(255,255,255,.95); }
.sheet.show { transform: translateY(0); }
.sheet.dragging { transition: none; }
.handle { width: 36px; height: 4px; background: var(--text-dim); border-radius: 2px; margin: 0 auto 14px; opacity: .4; touch-action: none; }
.sheet-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sheet-title-row h3 { font-size: 16px; font-weight: 600; }
.sheet-close { width: 32px; height: 32px; border-radius: 8px; color: var(--text-muted); font-size: 22px; line-height: 1; display: grid; place-items: center; }
.sheet-close:active { background: var(--surface-2); }

/* Settings sheet */
.settings-section { margin-bottom: 16px; }
.settings-section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.settings-row-list { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; }
.settings-row-list .act { justify-content: center; padding: 11px; font-size: 13px; }
.settings-about { font-size: 11px; color: var(--text-dim); text-align: center; padding: 8px 0; }
.input-row { display: flex; gap: 6px; }
.input-row input { flex: 1; }
.input-row .act { padding: 0 14px; font-size: 12px; }
.sheet-group { margin-bottom: 12px; }
.sheet-group > label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }

/* Model sheet */
.model-list { display: flex; flex-direction: column; gap: 8px; }
.model-item { padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; }
.model-item:active { background: var(--surface-2); }
.model-item.selected { border-color: var(--brand); background: var(--brand-soft); }
.model-item-name { font-size: 14px; font-weight: 600; }
.model-item-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.model-item-price { font-size: 12px; color: var(--success); font-weight: 600; margin-top: 4px; }

/* Preset sheet */
.preset-search { margin-bottom: 12px; }
.preset-section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 8px; }
.preset-list { display: flex; flex-direction: column; gap: 6px; }
.preset-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
}
.preset-item:active { background: var(--surface-2); }
.preset-item .pi-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
.preset-item .pi-text { flex: 1; min-width: 0; }
.preset-item .pi-name { font-size: 13px; font-weight: 600; }
.preset-item .pi-preview { font-size: 10px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset-item .pi-del { width: 32px; height: 32px; border-radius: 8px; color: var(--danger); background: var(--danger-soft); display: grid; place-items: center; flex-shrink: 0; }
.preset-item .pi-del svg { width: 14px; height: 14px; }
.preset-empty { text-align: center; padding: 24px 12px; color: var(--text-dim); font-size: 12px; }

/* Source picker sheet */
.source-list { display: flex; flex-direction: column; gap: 8px; }
.source-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
}
.source-item:active { background: var(--surface-2); }
.source-item .si-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.source-item .si-text { flex: 1; }
.source-item .si-name { font-size: 14px; font-weight: 600; }
.source-item .si-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* Action sheet (long-press menu) */
.action-sheet .sheet-actions { display: flex; flex-direction: column; gap: 6px; }
.action-sheet .sheet-actions .act { justify-content: flex-start; padding: 13px 14px; font-size: 13px; }

/* ============================================================
   Modals
   ============================================================ */
.modal { position: fixed; inset: 0; background: var(--overlay); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal.show { display: flex; }
.modal.content { flex: 1 1 0; min-height: 0; overflow: hidden; position: relative; min-height: 0;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
  max-width: 100%; width: 100%; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-header h3 { font-size: 16px; }
.modal-body { font-size: 13px; }
.modal-body pre { background: var(--surface-2); padding: 8px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 11px; margin: 6px 0; }
.modal-body .kv { display: flex; padding: 6px 0; border-bottom: 1px solid var(--border); gap: 10px; }
.modal-body .kv-k { width: 90px; color: var(--text-muted); flex-shrink: 0; font-size: 11px; }
.modal-body .kv-v { flex: 1; word-break: break-all; font-family: monospace; font-size: 11px; }
.modal-footer { display: flex; gap: 8px; margin-top: 16px; }
.modal-footer .act { flex: 1; justify-content: center; padding: 11px; font-size: 13px; }
.preset-input { width: 100%; padding: 11px; font-size: 14px; margin: 8px 0; }
.workflow-textarea { width: 100%; min-height: 240px; font-family: monospace; font-size: 12px; line-height: 1.6; }

/* ============================================================
   编辑器 (inpaint + outpaint)
   ============================================================ */
.editor { position: fixed; inset: 0; background: var(--bg-elev); z-index: 150; display: none; flex-direction: column; padding-top: var(--safe-top); }
.editor.show { display: flex; }
.editor-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--border); height: 48px; flex-shrink: 0; }
.editor-header h3 { font-size: 15px; }
.editor-body { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
.editor-tools { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px; background: var(--surface-2); border-radius: 10px; margin-bottom: 8px; align-items: center; }
.tg { display: flex; align-items: center; gap: 3px; padding-right: 6px; border-right: 1px solid var(--border); }
.tg:last-child { border-right: none; }
.tb { padding: 7px 9px; font-size: 12px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); min-height: 34px; }
.tb.active { background: var(--brand); color: white; border-color: var(--brand); }
.sb { padding: 5px 8px; font-size: 11px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); min-height: 30px; }
.sb.active { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.cb { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; }
.cb.active { border-color: var(--text); transform: scale(1.1); }
.or { width: 70px; appearance: none; -webkit-appearance: none; height: 4px; background: var(--surface); border-radius: 2px; padding: 0; border: none; }
.or::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--brand); }
.op-ctrl { display: none; padding: 12px; background: var(--brand-soft); border-radius: 10px; margin-bottom: 8px; gap: 12px; flex-direction: column; }
.op-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.op-label { font-size: 11px; color: var(--text-muted); min-width: 60px; }
.op-label span { color: var(--brand); font-family: monospace; margin-left: 4px; }
.dir-grid { display: grid; grid-template-columns: repeat(2,44px); gap: 6px; }
.dir-btn { width: 44px; height: 40px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text-muted); font-size: 20px; line-height: 1; touch-action: manipulation; }
.dir-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }
.op-segment { display: flex; gap: 6px; flex: 1; }
.op-segment .sb { flex: 1; min-height: 36px; padding: 7px 8px; font-size: 12px; justify-content: center; }
.op-apply { min-height: 44px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 700; font-size: 13px; touch-action: manipulation; }
.canvas-wrap { position: relative; background: var(--surface-2); border-radius: 10px; overflow: auto; max-height: 50vh; display: flex; justify-content: center; align-items: center; min-height: 220px; padding: 8px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.canvas-stack { position: relative; display: inline-block; }
#bgCanvas, #maskCanvas { display: block; max-width: 100%; max-height: 50vh; }
#bgCanvas { position: relative; z-index: 1; }
#maskCanvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; touch-action: none; -webkit-user-select: none; user-select: none; }
.canvas-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 12px; pointer-events: none; }
.canvas-hint.hide { display: none; }
.editor-prompt { min-height: 60px; font-size: 13px; }
.mask-preview-row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 11px; color: var(--text-muted); }
.mask-preview-row label { display: flex; align-items: center; gap: 6px; }
.mask-preview-row input[type=checkbox] { width: 18px; height: 18px; padding: 0; }

/* ============================================================
   统计
   ============================================================ */
.stabs { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
.srb { padding: 6px 12px; font-size: 11px; border-radius: 999px; color: var(--text-muted); background: var(--surface-2); }
.srb.active { background: var(--brand); color: white; }
.ssum { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 14px; }
.sc { background: var(--surface-2); border-radius: 9px; padding: 10px; text-align: center; }
.sc-main { background: var(--brand-soft); grid-column: 1/-1; text-align: left; }
.sl { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
.sv { font-size: 20px; font-weight: 700; color: var(--brand); font-family: monospace; }
.svs { font-size: 15px; font-weight: 600; font-family: monospace; }
.ssec { margin-bottom: 14px; }
.sst { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.sbr { display: grid; grid-template-columns: 90px 1fr 60px; gap: 8px; align-items: center; margin-bottom: 6px; }
.sbl { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbb { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.sbf { height: 100%; background: var(--brand); border-radius: 3px; }
.sbc { font-size: 11px; font-family: monospace; color: var(--success); text-align: right; }
.energy-card { display: flex; align-items: center; gap: 12px; padding: 14px; margin-top: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.energy-card .ei { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: var(--brand-soft); font-size: 18px; }
.energy-card .ec { flex: 1; min-width: 0; }
.energy-card .et { font-weight: 700; font-size: 14px; }
.energy-card .es { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.energy-card .ep { padding: 9px 12px; border-radius: 9px; background: var(--brand); color: #fff; font-size: 12px; font-weight: 600; min-height: 36px; }
.pay-qr { text-align: center; padding: 12px 4px 4px; }
.pay-qr img { display: block; width: min(72vw,260px); height: auto; max-height: 56vh; object-fit: contain; margin: 0 auto 10px; background: #fff; border-radius: 12px; padding: 8px; box-sizing: border-box; }
.pay-qr .pay-title { font-size: 13px; font-weight: 600; color: var(--text); }
.pay-qr .pay-note { font-size: 10px; line-height: 1.6; color: var(--text-dim); margin-top: 6px; }

/* ============================================================
   历史记录
   ============================================================ */
.history-search-row { margin-bottom: 10px; }
.history-filter-tabs { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
.history-filter-tabs .srb { padding: 5px 11px; }
.history-day-group { font-size: 11px; font-weight: 700; color: var(--text-muted); margin: 12px 0 6px; padding-left: 2px; }
.history-item { display: flex; gap: 10px; padding: 10px; border-radius: 10px; margin-bottom: 6px; background: var(--surface); border: 1px solid var(--border); }
.history-item:active { background: var(--surface-2); }
.history-thumb { width: 44px; height: 44px; border-radius: 7px; background: var(--surface-2); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.history-thumb img { width: 100%; height: 100%; object-fit: cover; }
.history-info { flex: 1; min-width: 0; }
.history-info .hi-top { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.history-info .hi-prompt { font-size: 10px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.history-info .hi-time { font-size: 10px; color: var(--text-dim); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.history-info .hi-time .act { font-size: 9px; padding: 2px 7px; min-height: 22px; }

/* ============================================================
   Lightbox
   ============================================================ */
.media-lightbox { position: fixed; inset: 0; z-index: 260; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.92); }
.media-lightbox.show { display: flex; animation: fadeIn 160ms ease-out; }
.media-lightbox img { max-width: 100%; max-height: 88vh; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 50px rgba(0,0,0,.4); }
.media-lightbox video { max-width: 100%; max-height: 88vh; object-fit: contain; border-radius: 10px; background: #000; }
.lightbox-close { position: absolute; top: calc(12px + var(--safe-top)); right: 12px; width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.12); color: #fff; font-size: 24px; line-height: 1; display: grid; place-items: center; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ============================================================
   Toast
   ============================================================ */
.toasts { position: fixed; top: calc(48px + var(--safe-top)); right: 8px; left: 8px; z-index: 300; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--text-dim);
  border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  font-size: 12px; display: flex; gap: 8px; animation: tin 280ms ease-out; pointer-events: auto;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
.toast.info { border-left-color: var(--brand); }
.toast .msg { flex: 1; word-break: break-word; }
.toast .ta { display: flex; gap: 4px; }
.toast .tbtn { padding: 3px 9px; font-size: 11px; border-radius: 5px; background: var(--surface-2); color: var(--brand); border: 1px solid var(--border); min-height: 28px; }
.toast .toast-close { padding: 3px 8px; font-size: 14px; line-height: 1; }
@keyframes tin { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* P0+P1 艺术化升级 */
.ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.20); pointer-events: none; transform: scale(0); animation: ripple-anim 350ms ease-out; }
@keyframes ripple-anim { to { transform: scale(1.5); opacity: 0; } }
.gen-btn, .tab, .act, .preset-btn, .source-item, .model-item, .ref-add, .header-btn { position: relative; overflow: hidden; }
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  opacity: .015; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
}
.header, .content, .tabbar, .sheet, .modal.content { flex: 1 1 0; min-height: 0; overflow: hidden; position: relative; min-height: 0; position: relative; z-index: 1; }
.tag.type-image { color: var(--brand); background: var(--brand-soft); }

.estimate .val, .pill { font-variant-numeric: tabular-nums; }

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}));
const fmtTime = ts => { if (!ts) return ''; const d = new Date(ts); const p = n => String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const fmtDur = ms => { const s = Math.floor(ms/1000); const m = Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; };
const trunc = (s, n=60) => s && s.length > n ? s.slice(0,n)+'…' : (s||'');
const genId = () => 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);

const isFrameKey = k => ['first_frame','last_frame','firstFrameUrl','lastFrameUrl'].includes(String(k));

function storageGet(key, fallback = '') { try { const v = window.localStorage.getItem(key); return v == null ? fallback : v; } catch { return fallback; } }
function storageSet(key, value) { try { window.localStorage.setItem(key, value); return true; } catch (e) { Toast.error('存储已满，请清理历史'); return false; } }

async function copy(text) {
  if (!text) return false;
  try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(String(text)); return true; } } catch {}
  try {
    const ta = document.createElement('textarea'); ta.value = String(text); ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}

function calcEstimate(model, body) {
  if (!model.billing) return null;
  const b = model.billing;
  if (b.type === 'perImage') return { amount: b.unit, label: `${b.unit} 元/张` };
  if (b.type === 'perSecond') {
    if (b.durationKey && body[b.durationKey]) { const d = Number(body[b.durationKey]); return { amount: d*b.unit, label: `${d}s × ${b.unit}` }; }
    return { amount: null, label: b.note || '按时长' };
  }
  if (b.type === 'perChar') { const len = (body[b.charKey]||'').length; return { amount: len*b.unit, label: `${len}字 × ${b.unit}` }; }
  if (b.type === 'perCall') return { amount: b.unit, label: `${b.unit} 元/次` };
  return null;
}

function classifyErr(msg) {
  const raw = String(msg || '');
  const m = raw.toLowerCase();
  if (/no_api_key|密钥|key|auth|401|403/.test(m)) return { category:'认证', hint: 'API 密钥无效或未填写', action: '检查设置' };
  if (/429|rate_limited|too many|频繁|限流/.test(m)) return { category:'限流', hint: '请求过于频繁，系统会自动退避，请稍后重试', action: '稍后重试' };
  if (/balance|余额|quota|额度/.test(m)) return { category:'额度', hint: '账户余额、点数或调用额度可能不足', action: '检查速创账户' };
  if (/invalid_json|不是有效 json/.test(m)) return { category:'服务', hint: '服务返回格式异常，请稍后重试', action: '重试' };
  if (/param|参数|422|400/.test(m)) return { category:'参数', hint: '请检查必填项、URL 格式和模型参数范围', action: '回到参数页' };
  if (/timeout|超时|abort/.test(m)) return { category:'超时', hint: '网络响应时间过长，可稍后重试', action: '重试' };
  if (/网络|fetch|cors|network/.test(m)) return { category:'网络', hint: '网络异常或浏览器跨域限制', action: '检查网络' };
  if (/content|内容|审核|违规/.test(m)) return { category:'内容', hint: '内容可能触发审核策略，请调整提示词', action: '修改提示词' };
  return { category:'服务', hint: raw || '未知错误', action: '重试' };
}

/* ============================================================
   Toast
   ============================================================ */
const Toast = {
  show(msg, type = 'info', opts = {}) {
    const { duration = 3500, actions = [] } = opts;
    const root = $('#toasts'); if (!root) return;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const actionsHtml = actions.length ? `<div class="ta">${actions.map((a,i) => `<button class="tbtn" data-action-index="${i}">${esc(a.label || '操作')}</button>`).join('')}</div>` : '';
    el.innerHTML = `<div class="msg">${esc(msg)}</div>${actionsHtml}<button class="tbtn toast-close" aria-label="关闭">×</button>`;
    root.appendChild(el);
    let closed = false;
    const close = () => { if (closed) return; closed = true; el.style.animation = 'tin 160ms reverse'; setTimeout(() => el.remove(), 170); };
    el.querySelector('.toast-close')?.addEventListener('click', close);
    el.querySelectorAll('[data-action-index]').forEach(b => b.addEventListener('click', async () => {
      const a = actions[Number(b.dataset.actionIndex)];
      try { const r = a?.onClick?.(); if (r?.then) await r; } catch (e) { console.error(e); }
      close();
    }));
    if (duration > 0) setTimeout(close, duration);
  },
  success(m, o) { this.show(m, 'success', o); },
  error(m, o) { this.show(m, 'error', { duration: 5000, ...o }); },
  warning(m, o) { this.show(m, 'warning', o); },
  info(m, o) { this.show(m, 'info', o); }
};

/* ============================================================
   Api
   ============================================================ */
const Api = {
  async request(url, options = {}, timeout = CONFIG.REQUEST_TIMEOUT) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try { return await fetch(url, { ...options, signal: controller.signal }); }
    catch (e) {
      if (e?.name === 'AbortError') throw new Error('REQUEST_TIMEOUT');
      throw new Error('NETWORK_OR_CORS');
    }
    finally { clearTimeout(timer); }
  },
  async parseJson(r) { try { return await r.json(); } catch { throw new Error('INVALID_JSON'); } },
  _normalize(payload) {
    if (!payload || typeof payload !== 'object') return payload;
    if (typeof payload.data === 'string') {
      const raw = payload.data.trim();
      if (raw && (raw.startsWith('{') || raw.startsWith('['))) {
        try { return { ...payload, data: JSON.parse(raw) }; } catch {}
      }
    }
    return payload;
  },
  _readApiError(payload, prefix = 'API') {
    const p = this._normalize(payload);
    if (p?.code != null && Number(p.code) !== 200) {
      const e = new Error(`${prefix}_${p.code}:${p.msg || ''}`);
      e.apiCode = Number(p.code); e.apiMsg = p.msg || '';
      return e;
    }
    return null;
  },
  async submit(endpoint, body) {
    const key = Store.getApiKey(); if (!key) throw new Error('NO_API_KEY');
    let r;
    try {
      r = await this.request(CONFIG.API_BASE + endpoint, {
        method: 'POST',
        headers: { Authorization: key, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } catch (e) {
      if (e?.message === 'REQUEST_TIMEOUT') throw e;
      throw new Error('NETWORK_OR_CORS');
    }
    if (r.status === 429) { const e = new Error('RATE_LIMITED'); e.retryAfter = parseInt(r.headers.get('Retry-After') || '0', 10) || 0; throw e; }
    if (!r.ok) throw new Error(`HTTP_${r.status}`);
    const payload = this._normalize(await this.parseJson(r));
    const apiErr = this._readApiError(payload, 'API');
    if (apiErr) throw apiErr;
    return payload;
  },
  async syncCall(endpoint, body) {
    const key = Store.getApiKey(); if (!key) throw new Error('NO_API_KEY');
    let r;
    try {
      r = await this.request(CONFIG.API_BASE + endpoint, {
        method: 'POST',
        headers: { Authorization: key, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } catch (e) {
      if (e?.message === 'REQUEST_TIMEOUT') throw e;
      throw new Error('NETWORK_OR_CORS');
    }
    if (r.status === 429) { const e = new Error('RATE_LIMITED'); e.retryAfter = parseInt(r.headers.get('Retry-After') || '0', 10) || 0; throw e; }
    if (!r.ok) throw new Error(`HTTP_${r.status}`);
    const payload = this._normalize(await this.parseJson(r));
    const apiErr = this._readApiError(payload, 'API');
    if (apiErr) throw apiErr;
    return payload;
  },
  async queryDetail(id) {
    const key = Store.getApiKey(); if (!key) throw new Error('NO_API_KEY');
    let r;
    try {
      r = await this.request(`${CONFIG.API_BASE}${CONFIG.DETAIL_PATH}?id=${encodeURIComponent(id)}`, {
        method: 'GET', headers: { Authorization: key, 'Content-Type': 'application/json' }, cache: 'no-store'
      });
    } catch (e) {
      if (e?.message === 'REQUEST_TIMEOUT') throw e;
      throw new Error('NETWORK_OR_CORS');
    }
    if (r.status === 429) { const e = new Error('RATE_LIMITED'); e.retryAfter = parseInt(r.headers.get('Retry-After') || '0', 10) || 0; throw e; }
    if (!r.ok) throw new Error(`QUERY_HTTP_${r.status}`);
    const payload = this._normalize(await this.parseJson(r));
    const apiErr = this._readApiError(payload, 'QUERY_API');
    if (apiErr) throw apiErr;
    return payload;
  },
  extractUrl(d) {
    if (!d) return null;
    const data = (typeof d.data === 'string') ? (() => { try { return JSON.parse(d.data); } catch { return d.data; } })() : d.data;
    const isUrl = s => typeof s === 'string' && /^https?:\/\/\S+/i.test(s) && s.length < 4000;
    const keys = ['url','video_url','image_url','audio_url','result','result_url','demo_audio','file_url','download_url','output_url','video','image','audio','media_url'];
    for (const k of keys) { if (isUrl(data?.[k])) return data[k]; if (Array.isArray(data?.[k])) { const u = data[k].find(isUrl); if (u) return u; } }
    if (isUrl(data)) return data;
    return this._deepFind(data);
  },
  _deepFind(obj, d = 0) {
    if (!obj || d > 8) return null;
    const isUrl = s => typeof s === 'string' && /^https?:\/\/\S+/i.test(s) && s.length < 4000;
    if (typeof obj === 'string') return isUrl(obj) ? obj : null;
    if (Array.isArray(obj)) { for (const it of obj) { const u = this._deepFind(it, d+1); if (u) return u; } return null; }
    if (typeof obj === 'object') { for (const [k, v] of Object.entries(obj)) { if (/url|file|output|result|media|video|image|audio/i.test(k) && isUrl(v)) return v; const u = this._deepFind(v, d+1); if (u) return u; } }
    return null;
  },
  async uploadToR2(file, onProgress, retry = 0) {
    if (!CONFIG.R2.WORKER_URL) throw new Error('R2 未配置：请打开设置 → 填写 R2 网址');
    let workerUrl = CONFIG.R2.WORKER_URL.trim().replace(/\/+$/, '');
    if (!/^https:\/\//i.test(workerUrl)) throw new Error('R2 网址必须以 https:// 开头');
    if (CONFIG.R2.AUTH_TOKEN) {
      const sep = workerUrl.includes('?') ? '&' : '?';
      workerUrl = workerUrl + sep + 'token=' + encodeURIComponent(CONFIG.R2.AUTH_TOKEN);
    }
    const fileName = file.name || `file-${Date.now()}`;
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', workerUrl);
      const formData = new FormData();
      formData.append('file', file, fileName);
      formData.append('name', fileName);
      xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
      xhr.onload = () => {
        let data = null; try { data = JSON.parse(xhr.responseText); } catch {}
        if (xhr.status === 200 && data && data.url) resolve(data.url);
        else if (xhr.status === 403) reject(new Error('R2 鉴权失败：请检查 R2 密钥'));
        else if (xhr.status === 413) reject(new Error('文件太大：超过 Worker 大小上限'));
        else if (xhr.status === 404) reject(new Error('Worker URL 不存在（404）'));
        else if (xhr.status === 0 || xhr.status >= 500) {
          if (retry < 1) setTimeout(() => this.uploadToR2(file, onProgress, retry + 1).then(resolve, reject), 1000);
          else reject(new Error('Worker 异常（HTTP ' + xhr.status + '）：' + (xhr.responseText || '').substring(0, 200)));
        } else reject(new Error((data && data.error) || `R2 HTTP ${xhr.status}`));
      };
      xhr.onerror = () => {
        let hint = 'R2 网络错误';
        if (/\.r2\.dev/.test(workerUrl)) hint = '网址错误：应填 Worker URL（形如 https://ai-media-proxy.xxx.workers.dev），不是 R2 公网域名';
        else if (!/\.workers\.dev/.test(workerUrl) && !/cloudflare/.test(workerUrl)) hint = '网址看起来不是 Cloudflare Worker';
        else if (retry < 1) { setTimeout(() => this.uploadToR2(file, onProgress, retry + 1).then(resolve, reject), 1000); return; }
        else hint = '网络连接失败（已重试 1 次仍失败）';
        reject(new Error(hint));
      };
      xhr.ontimeout = () => reject(new Error('R2 上传超时'));
      xhr.timeout = 120000;
      xhr.send(formData);
    });
  },
  async testR2Connection() {
    if (!CONFIG.R2.WORKER_URL) { Toast.error('请先填写 R2 网址'); return false; }
    const btn = $('#testR2Btn'); const orig = btn?.textContent;
    if (btn) { btn.disabled = true; btn.textContent = '测试中…'; }
    try {
      const blob = new Blob(['t'], { type: 'text/plain' });
      const file = new File([blob], 'r2-test.txt', { type: 'text/plain' });
      await this.uploadToR2(file);
      Toast.success('R2 连接成功！');
      if (btn) { btn.disabled = false; btn.textContent = '已连接 ✓'; setTimeout(() => { btn.textContent = orig; }, 3000); }
      return true;
    } catch (err) {
      Toast.error('R2 测试失败：' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = orig; }
      return false;
    }
  },
  async dataUrlToBlob(dataUrl) {
    const m = /^data:([^;,]+)(;base64)?,([\s\S]*)$/.exec(dataUrl);
    if (!m) throw new Error('无法解析的 data URL');
    const mime = (m[1] || 'image/png').toLowerCase();
    const isB64 = !!m[2];
    const bytes = isB64 ? atob(m[3]) : decodeURIComponent(m[3]);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    return new Blob([arr], { type: mime });
  },
  async uploadDataUrl(dataUrl, onProgress) {
    if (!CONFIG.R2.WORKER_URL) throw new Error('请先在设置里配置 R2 网址');
    const blob = await this.dataUrlToBlob(dataUrl);
    const extMap = { 'image/png':'png','image/jpeg':'jpg','image/jpg':'jpg','image/webp':'webp','image/gif':'gif' };
    const ext = extMap[blob.type.toLowerCase()] || 'png';
    const file = new File([blob], `upload-${Date.now()}.${ext}`, { type: blob.type });
    return await this.uploadToR2(file, onProgress);
  },
  _cache: Object.create(null),
  getCached(d) { return this._cache[d]; },
  setCached(d, u) { if (d && u) this._cache[d] = u; }
};

/* ============================================================
   PollManager
   ============================================================ */
class PollManager {
  constructor() { this.timers = {}; this.polls = {}; }
  getPhase(elapsed) {
    for (const p of CONFIG.POLL_PHASES) { if (elapsed < p.until) return p; }
    return CONFIG.POLL_PHASES[CONFIG.POLL_PHASES.length - 1];
  }
  start(task) {
    if (this.timers[task.id]) return;
    const st = { count: 0, netFails: 0, rateFails: 0, startAt: task.startTime || Date.now(), stopped: false, _timer: null };
    this.polls[task.id] = st;
    Store.updateTask(task.id, { status: 'running', startTime: st.startAt });
    UI.renderResults();
    this.timers[task.id] = setInterval(() => {
      const t = Store.getTasks().find(x => x.id === task.id);
      if (!t || t.status !== 'running') { this.stop(task.id); return; }
      const elapsed = Date.now() - st.startAt;
      Store.updateTask(task.id, { elapsed });
      UI.updateTimer(task.id, elapsed, st);
    }, 500);
    const tick = async () => {
      st._timer = null;
      if (st.stopped) return;
      if (Date.now() - st.startAt >= CONFIG.POLL_TIMEOUT) { this.onTimeout(task.id); return; }
      st.count++;
      try {
        const detail = await Api.queryDetail(task.apiId);
        if (st.stopped) return;
        if (Date.now() - st.startAt >= CONFIG.POLL_TIMEOUT) { this.onTimeout(task.id); return; }
        st.netFails = 0; st.rateFails = 0;
        const status = detail?.data?.status;
        Store.updateTask(task.id, { lastStatus: status, lastQueryAt: Date.now(), phase: this.getPhase(Date.now() - st.startAt).name });
        if (status === 2 || status === 'succeeded' || status === 'success') {
          const url = Api.extractUrl(detail);
          const elapsed = Date.now() - st.startAt;
          this.stop(task.id);
          Store.updateTask(task.id, { status: 'success', resultUrl: url, rawDetail: detail, endTime: Date.now(), elapsed });
          Store.updateHistory(task.historyId, { status: 'success', resultUrl: url, endTime: Date.now(), elapsed });
          UI.renderResults();
          if (url) { Toast.success(`${task.modelName} 成功`, { actions: [{ label: '查看', onClick: () => UI.switchView('result') }] }); UI.playSound(); UI.notify(task.modelName, false); }
          else Toast.warning('任务成功但未提取到 URL');
          return;
        } else if (status === 3 || status === 'failed' || status === 'fail') {
          const err = detail?.data?.message || detail?.data?.error || '生成失败';
          this.stop(task.id);
          Store.updateTask(task.id, { status: 'failed', error: err, endTime: Date.now() });
          Store.updateHistory(task.historyId, { status: 'failed', error: err, endTime: Date.now() });
          UI.renderResults();
          Toast.error(`${task.modelName} 失败: ${err}`);
          UI.notify(task.modelName, true, err);
          return;
        }
        st._timer = setTimeout(tick, this.getPhase(Date.now() - st.startAt).interval);
      } catch (e) {
        if (e.message === 'RATE_LIMITED') {
          st.rateFails = (st.rateFails || 0) + 1;
          const backoff = e.retryAfter > 0 ? e.retryAfter * 1000 : Math.min(10000 * Math.pow(2, st.rateFails - 1), 60000);
          st._timer = setTimeout(tick, backoff);
          return;
        }
        if (e.message === 'NO_API_KEY') {
          this.stop(task.id);
          Store.updateTask(task.id, { status: 'failed', error: 'API密钥缺失', endTime: Date.now() });
          Store.updateHistory(task.historyId, { status: 'failed', error: 'API密钥缺失', endTime: Date.now() });
          UI.renderResults(); Toast.error('请先填写 API 密钥');
          return;
        }
        st.netFails++;
        if (e.message === 'NETWORK_OR_CORS' || e.message === 'REQUEST_TIMEOUT') {
          if (st.netFails >= CONFIG.POLL_FAIL_LIMIT) {
            this.stop(task.id);
            const msg = e.message === 'REQUEST_TIMEOUT' ? '查询请求连续超时' : `连续${st.netFails}次网络失败`;
            Store.updateTask(task.id, { status: 'failed', error: msg, endTime: Date.now() });
            Store.updateHistory(task.historyId, { status: 'failed', error: msg, endTime: Date.now() });
            UI.renderResults(); Toast.error(`${msg}，请检查网络后重试`);
            return;
          }
          UI.updateTimer(task.id, Date.now() - st.startAt, { ...st, requestError: e.message });
          st._timer = setTimeout(tick, Math.min(this.getPhase(Date.now() - st.startAt).interval * 2, 8000));
          return;
        }
        if (st.netFails >= CONFIG.POLL_FAIL_LIMIT) {
          this.stop(task.id);
          const msg = `连续${st.netFails}次查询失败`;
          Store.updateTask(task.id, { status: 'failed', error: msg, endTime: Date.now() });
          Store.updateHistory(task.historyId, { status: 'failed', error: msg, endTime: Date.now() });
          UI.renderResults(); Toast.error('查询失败，可稍后重试');
          return;
        }
        st._timer = setTimeout(tick, this.getPhase(Date.now() - st.startAt).interval);
      }
    };
    tick();
  }
  onTimeout(id) {
    this.stop(id);
    const t = Store.getTasks().find(x => x.id === id);
    if (!t) return;
    Store.updateTask(id, { status: 'timeout', error: '超时(10分钟)，可手动刷新', endTime: Date.now() });
    Store.updateHistory(t.historyId, { status: 'timeout', endTime: Date.now() });
    UI.renderResults();
    Toast.warning('轮询超时');
  }
  stop(id) {
    if (this.timers[id]) { clearInterval(this.timers[id]); delete this.timers[id]; }
    const st = this.polls[id];
    if (st) { if (st._timer) clearTimeout(st._timer); st.stopped = true; delete this.polls[id]; }
  }
  async refresh(id) {
    const t = Store.getTasks().find(x => x.id === id);
    if (!t || !t.apiId) return;
    Toast.info('查询中…');
    try {
      const d = await Api.queryDetail(t.apiId);
      const s = d?.data?.status;
      if (s === 2 || s === 'succeeded' || s === 'success') {
        const url = Api.extractUrl(d); const now = Date.now();
        this.stop(id);
        Store.updateTask(id, { status: 'success', resultUrl: url, rawDetail: d, endTime: now, elapsed: now - (t.startTime || now) });
        Store.updateHistory(t.historyId, { status: 'success', resultUrl: url, endTime: now, elapsed: now - (t.startTime || now) });
        UI.renderResults(); Toast.success(url ? '成功' : '成功，但未提取到结果 URL');
        if (url) UI.playSound();
      } else if (s === 3 || s === 'failed' || s === 'fail') {
        const msg = d?.data?.message || d?.data?.error || '生成失败'; const now = Date.now();
        this.stop(id);
        Store.updateTask(id, { status: 'failed', error: msg, endTime: now });
        Store.updateHistory(t.historyId, { status: 'failed', error: msg, endTime: now });
        UI.renderResults(); Toast.error('生成失败：' + msg);
      } else {
        Toast.info('仍在生成中');
        if (!this.timers[id]) this.start({ id: t.id, apiId: t.apiId, modelName: t.modelName, startTime: t.startTime, historyId: t.historyId });
      }
    } catch (e) {
      if (e.message === 'RATE_LIMITED') Toast.warning('查询受限，稍后自动退避重试');
      else if (e.message === 'REQUEST_TIMEOUT') Toast.warning('查询超时，请稍后再次刷新');
      else if (e.message === 'NETWORK_OR_CORS') Toast.error('网络或跨域异常，请检查网络后重试');
      else if (e.message === 'NO_API_KEY') Toast.error('请先填写 API 密钥');
      else if (String(e.message || '').startsWith('QUERY_API_')) Toast.error('API 查询失败：' + String(e.message).replace(/^QUERY_API_\d+:/, ''));
      else Toast.error('查询失败：' + e.message);
    }
  }
  resumeAll() {
    const now = Date.now();
    Store.getTasks().filter(t => t.status === 'running').forEach(t => {
      if (!t.startTime || now - t.startTime >= CONFIG.POLL_TIMEOUT) { this.onTimeout(t.id); return; }
      this.start({ id: t.id, apiId: t.apiId, modelName: t.modelName, startTime: t.startTime, historyId: t.historyId });
    });
  }
}

function normalizeAndValidateApiBody(model, input) {
  const body = { ...(input || {}) };
  const errors = [];
  const has = k => body[k] !== undefined && body[k] !== null && String(body[k]).trim() !== '';
  const add = msg => { if (msg && !errors.includes(msg)) errors.push(msg); };
  const validUrl = v => /^https?:\/\/\S+$/i.test(String(v || '').trim()) && String(v || '').trim().length < 4000;
  const rejectBadScheme = v => /^(blob:|data:|file:)/i.test(String(v || '').trim());
  const checkUrlArray = (key, label, max) => {
    if (!Array.isArray(body[key])) return;
    const arr = body[key].map(v => String(v || '').trim()).filter(Boolean);
    if (arr.some(u => rejectBadScheme(u))) add(`${label}必须是公网 URL`);
    if (arr.some(u => !validUrl(u))) add(`${label}包含无效 URL`);
    if (max != null && arr.length > max) add(`${label}最多 ${max} 个`);
    body[key] = arr;
  };
  const splitCsv = v => String(v || '').split(',').map(s => s.trim()).filter(Boolean);
  const checkCsv = (key, label, max) => {
    if (!has(key)) return;
    const arr = splitCsv(body[key]);
    if (arr.some(u => rejectBadScheme(u))) add(`${label}必须是公网 URL`);
    if (arr.some(u => !validUrl(u))) add(`${label}包含无效 URL`);
    if (max != null && arr.length > max) add(`${label}最多 ${max} 个`);
    body[key] = arr.join(',');
  };
  const checkUrl = (key, label) => {
    if (!has(key)) return;
    if (rejectBadScheme(body[key])) { add(`${label}必须是公网 URL`); return; }
    if (!validUrl(body[key])) add(`${label}需要以 http:// 或 https:// 开头`);
  };
  const checkIntRange = (key, label, min, max) => {
    if (!has(key)) return;
    const n = Number(body[key]);
    if (!Number.isInteger(n) || n < min || n > max) add(`${label}应为 ${min}～${max} 的整数`);
    else body[key] = String(n);
  };
  const checkEnum = (key, label, values) => {
    if (!has(key)) return;
    const v = String(body[key]);
    if (!values.includes(v)) add(`${label}取值无效`);
    else body[key] = v;
  };

  switch (model?.id) {
    case 'nanoBanana2':
    case 'nanoBanana_pro':
    case 'nanoBanana2Lite':
      checkEnum('size', '分辨率', model.id === 'nanoBanana2Lite' ? ['1K'] : ['1K','2K','4K']);
      checkEnum('aspectRatio', '比例', ['auto','1:1','16:9','9:16','4:3','3:4','3:2','2:3','5:4','4:5','21:9','1:4','1:8','4:1','8:1']);
      checkUrlArray('urls', '参考图', (model.id === 'nanoBanana2' || model.id === 'nanoBanana_pro') ? 14 : null);
      break;
    case 'gpt-image-2':
      checkEnum('size', '比例', ['auto','1:1','3:2','2:3','16:9','9:16','4:3','3:4','21:9','9:21','1:3','3:1','2:1','1:2']);
      break;
    case 'wan3':
      checkEnum('ratio', '宽高比', ['16:9','9:16']);
      checkIntRange('duration', '时长', 4, 30);
      checkEnum('generate_audio', '生成音频', ['true','false']);
      checkUrl('first_frame', '首帧图 URL'); checkUrl('last_frame', '尾帧图 URL');
      checkCsv('images', '参考图片', 10); checkCsv('videos', '参考视频', 5); checkCsv('audios', '参考音频', 5);
      if (has('last_frame') && !has('first_frame')) add('尾帧需要搭配首帧');
      if ((has('first_frame') || has('last_frame')) && (has('images') || has('videos') || has('audios'))) add('首尾帧模式不能同时搭配参考图片、参考视频或参考音频');
      break;
    case 'minimax_h3':
      checkEnum('ratio', '宽高比', ['21:9','16:9','4:3','1:1','3:4','9:16','adaptive']);
      checkIntRange('duration', '时长', 4, 15);
      checkEnum('resolution', '分辨率', ['768P','2K']);
      checkUrl('first_frame', '首帧图 URL'); checkUrl('last_frame', '尾帧图 URL');
      checkCsv('images', '参考图片', 9); checkCsv('videos', '参考视频', 3); checkCsv('audios', '参考音频', 3);
      if (has('last_frame') && !has('first_frame')) add('尾帧需要搭配首帧');
      if ((has('first_frame') || has('last_frame')) && (has('images') || has('videos') || has('audios'))) add('首尾帧模式不能同时搭配参考图片、参考视频或参考音频');
      break;
    case 'video_upscaling':
      checkUrl('video_url', '视频 URL');
      break;
    case 'google_omni':
      if (has('duration') && Number(body.duration) !== 10) add('Google Omni 时长固定为 10 秒');
      body.duration = '10';
      checkUrl('images', '参考图 URL'); checkUrl('video', '参考视频 URL');
      if (has('images') && has('video')) add('Google Omni 参考图与参考视频不要同时使用');

    case 'video_vidu':

      checkIntRange('duration', '时长', 1, 10);
      checkEnum('bgm', '背景音乐', ['true','false']);
      checkEnum('watermark', '水印', ['1','0']);
      checkCsv('subjects', '主体图', 7); checkCsv('image_url', '图像参考', 7);
      if (has('subjects') && has('image_url')) add('主体图与图像参考不能同时使用');
      break;
    case 'video_omni':
      checkEnum('aspectRatio', '宽高比', ['16:9','9:16','1:1']);
      checkEnum('resolution', '模式', ['std','pro','4k']);
      checkIntRange('duration', '时长', 3, 15);
      checkEnum('sound', '声音', ['on','off']); checkEnum('watermark', '水印', ['1','0']);
      checkUrl('firstFrameUrl', '首帧图 URL'); checkUrl('lastFrameUrl', '尾帧图 URL');
      checkCsv('image_url', '参考图', 10); checkUrl('video_url', '参考视频 URL');
      if (has('lastFrameUrl') && !has('firstFrameUrl')) add('尾帧需要搭配首帧');
      if (has('video_url') && String(body.sound) !== 'off') add('有参考视频时 sound 必须为 off');
      break;
    case 'digital_humans':
      checkUrl('audioUrl', '音频 URL'); checkUrl('videoUrl', '人物视频 URL');
      break;
    case 'video_package':
      checkUrl('video', '视频 URL');
      checkEnum('template_id', '模板 ID', Array.from({ length: 30 }, (_, i) => String(i + 1)));
      break;
    case 'veo3_fast':
      checkEnum('aspectRatio', '宽高比', ['16:9']); checkEnum('size', '清晰度', ['720p','1080p']);
      checkUrl('firstFrameUrl', '首帧图 URL'); checkUrl('lastFrameUrl', '尾帧图 URL');
      if (Array.isArray(body.urls) && body.urls.length > 3) add('参考图最多 3 张');
      if (has('lastFrameUrl') && !has('firstFrameUrl')) add('尾帧需要搭配首帧');
      if ((has('firstFrameUrl') || has('lastFrameUrl')) && has('urls')) add('首尾帧与参考图不可同时使用');
      break;
    case 'audio_tts':
      if (has('speed')) { const n = Number(body.speed); if (!Number.isFinite(n) || n < 0.5 || n > 2) add('语速应在 0.5～2'); else body.speed = String(n); }
      if (has('vol')) { const n = Number(body.vol); if (!Number.isFinite(n) || n <= 0 || n > 10) add('音量应大于 0 且不超过 10'); else body.vol = String(n); }
      checkEnum('language_boost', '语种', ['auto','Chinese','Chinese,Yue','English','Arabic','Russian','Spanish','French','Portuguese','German','Turkish','Dutch','Ukrainian','Vietnamese','Indonesian','Japanese','Italian','Korean']);
      break;
    case 'voice_composite':
      if (has('speed')) { const n = Number(body.speed); if (!Number.isFinite(n) || n < 0.5 || n > 2) add('语速应在 0.5～2'); else body.speed = n; }
      if (has('vol')) { const n = Number(body.vol); if (!Number.isFinite(n) || n <= 0 || n > 10) add('音量应大于 0 且不超过 10'); else body.vol = n; }
      checkEnum('language_boost', '语种', ['auto','Chinese','Chinese,Yue','English','Arabic','Russian','Spanish','French','Portuguese','German','Turkish','Dutch','Ukrainian','Vietnamese','Indonesian','Japanese','Italian','Korean']);
      break;
    case 'voice_clone':
      checkUrl('audio_url', '参考音频 URL');
      break;
  }
  return { ok: errors.length === 0, body, errors };
}

      '',
      '【AI 优化指令】',
      '请先理解并分析工作流中的参考素材，再结合当前任务、模型、原始提示词与生成设置优化提示词。',
      '优化时优先保留参考素材的核心主体、构图关系、视觉风格、关键特征和表达意图；除非原工作流明确要求，否则不要擅自改变模型、参考素材或生成设置。',
      '若参考素材已经存在，不得删除、替换、虚构或擅自修改参考素材地址。',
      '若仅需优化提示词，则只修改【提示词】内容；除非用户明确要求，不得修改模型、参考素材和其它生成参数。',
      '优化完成后，请严格保持工作流 V32 的字段结构，输出完整、干净、可直接再次导入的工作流。',
      '只输出最终工作流内容，不输出分析过程、修改说明、前后对比、备注或模板之外的文字。',
      '# END'
    );
    return lines.join('\n');
  },
  parse(text) {
    const s = String(text || '').replace(/\r/g, '').trim();
    if (!/^#\s*速创工作台\s*[·-]\s*工作流\s+V32[\s\S]*#\s*END\s*$/i.test(s)) return null;
    const r = { model: null, type: null, prompt: '', refs: { image: [], video: [], first: null, last: null }, fields: {} };
    let sec = '', field = '';
    const add = (k, v) => {
      const u = String(v || '').trim().replace(/^\d+\.\s*/, '');
      if (/^https?:\/\//i.test(u)) {
        if (k === '参考图' || k === '参考图片') r.refs.image.push(u);
        else if (k === '参考视频') r.refs.video.push(u);
        else if (k === '首帧') r.refs.first = u;
        else if (k === '尾帧') r.refs.last = u;
      }
    };
    s.replace(/\n#\s*END\s*$/i, '').split('\n').forEach(raw => {
      const line = raw.trim();
      if (!line || line.startsWith('#')) return;
      const h = line.match(/^【([^】]+)】$/);
      if (h) { sec = h[1]; field = ''; return; }
      // If we're collecting ref URLs, treat lines as list items (skip kv matching)
      if (field && /^\d+\.\s*https?:\/\//.test(line)) { add(field, line); return; }
      // Section-based single-line values (任务/模型 are single-line content, not kv)
      if (sec === '任务' && line && !line.includes('：') && !line.includes(':')) { r.type = line; return; }
      if (sec === '模型' && line && !line.includes('：') && !line.includes(':')) { r.model = line; return; }
      const kv = line.match(/^([^:：]+)[:：]\s*(.*)$/);
      if (kv) {
        const k = kv[1].trim(), v = kv[2].trim();
        if (k === '模型') { r.model = v; return; }
        if (k === '任务' || k === '类型') { r.type = v; return; }
        if (k === '提示词') { sec = '提示词'; r.prompt = v === '（空）' ? '' : v; return; }
        if (['参考图','参考图片','参考视频','首帧','尾帧'].includes(k)) { field = k; if (v && v !== '无') add(k, v); return; }
        if (sec === '生成设置' || sec === '生成参数' || sec === '其他参数') r.fields[k] = v;
        return;
      }
      if (field) add(field, line);
      else if (sec === '提示词') r.prompt += (r.prompt ? '\n' : '') + line;
    });
    return r;
  },
  findModel(name) {
    for (const [tab, list] of Object.entries(MODELS || {})) {
      for (const m of list || []) {
        if (m.id === name || m.name === name) return { tab, m };
      }
    }
    return null;
  },
  apply(text) {
    const p = this.parse(text);
    if (!p) return false;
    const hit = this.findModel(p.model);
    if (hit && hit.tab !== UI.tab) UI.switchTab(hit.tab);
    if (hit && hit.m.id !== UI.model?.id) UI.renderForm(hit.m.id);
    const model = UI.model;
    if (!model) return false;
    const pp = model.params.find(x => x.key === 'prompt' || x.key === 'text');
    if (pp) {
      const ta = UI.getPromptTextarea();
      if (ta) { ta.value = p.prompt; ta.dispatchEvent(new Event('input', { bubbles: true })); }
    }
    const ip = model.params.find(x => x.type === 'ref-image' && !isFrameKey(x.key));
    const vp = model.params.find(x => x.type === 'ref-video' && !isFrameKey(x.key));
    const fp = model.params.find(x => ['first_frame','firstFrameUrl'].includes(x.key));
    const lp = model.params.find(x => ['last_frame','lastFrameUrl'].includes(x.key));
    if (ip && p.refs.image.length) this._replaceRefs(ip.key, p.refs.image, false);
    if (vp && p.refs.video.length) this._replaceRefs(vp.key, p.refs.video, true);
    if (fp && p.refs.first) this._replaceRefs(fp.key, [p.refs.first], false);
    if (lp && p.refs.last) this._replaceRefs(lp.key, [p.refs.last], false);
    Object.entries(p.fields).forEach(([label, v]) => {
      const param = model.params.find(x => x.label === label || x.key === label);
      if (!param) return;
      let g = $(`#paramForm .form-group[data-key="${CSS.escape(param.key)}"]`);
      if (!g) g = $(`#paramForm .prompt-module[data-key="${CSS.escape(param.key)}"]`);
      const el = g?.querySelector('input:not([type=file]),textarea,select');
      if (!el) return;
      el.value = Array.isArray(v) ? v.join(', ') : v;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    });
    UI.updateEstimate();
    Toast.success('工作流已导入');
    return true;
  },
  _replaceRefs(key, urls, video) {
    const refs = UI.getRefs(key);
    if (!refs) return;
    refs.splice(0);
    urls.forEach(u => refs.push({
      id: 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      kind: video ? 'url-video' : 'url',
      src: u, name: video ? '工作流视频' : '工作流图片', uploaded: true, remote: u,
      mediaType: video ? 'video' : 'image'
    }));
    UI.refreshRefGrid(key);
  },
  async copy(task) {
    const md = this.build(task);
    if (!md) { Toast.error('当前无可复制的工作流'); return; }
    try { const ok = await copy(md); if (!ok) throw new Error('浏览器未允许复制'); Toast.success('工作流已复制'); }
    catch (e) { Toast.error('复制失败：' + e.message); }
  },
  openImportModal() {
    $('#workflowInput').value = '';
    $('#workflowModal').classList.add('show');
    setTimeout(() => $('#workflowInput')?.focus(), 100);
  }
};

  bindSheetSwipe(sheetId, overlayId) {
    const sh = $('#' + sheetId);
    if (!sh || sh.dataset.swipeBound) return;
    sh.dataset.swipeBound = '1';
    let startY = 0, lastY = 0, tracking = false;
    const handle = sh.querySelector('[data-sheet-handle]') || sh;
    sh.addEventListener('touchstart', e => {
      if (!sh.classList.contains('show') || e.touches.length !== 1) return;
      // Only track if touching near the top (handle area) or if scrollTop === 0
      if (e.touches[0].clientY - sh.getBoundingClientRect().top > 60 && sh.scrollTop > 0) return;
      startY = lastY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });
    sh.addEventListener('touchmove', e => {
      if (!tracking || e.touches.length !== 1) return;
      const y = e.touches[0].clientY;
      const dy = Math.max(0, y - startY);
      lastY = y;
      if (dy > 0) { sh.classList.add('dragging'); sh.style.transform = `translateY(${Math.min(dy, 320)}px)`; }
    }, { passive: true });
    sh.addEventListener('touchend', () => {
      if (!tracking) return;
      tracking = false;
      const dy = Math.max(0, lastY - startY);
      sh.classList.remove('dragging');
      if (dy > 80) this.closeSheet(sheetId, overlayId);
      else sh.style.transform = '';
    }, { passive: true });
  },

  playSound() {
    if (!Store.getSound()) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.setValueAtTime(1320, ctx.currentTime + .12);
      g.gain.setValueAtTime(.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .4);
      o.start(); o.stop(ctx.currentTime + .4);
    } catch {}
  },

  /* ===== Form rendering ===== */
  renderForm(mid) {
    const model = MODELS[this.tab]?.find(m => m.id === mid);

    // Render the unified prompt module FIRST (always at top)
