    f.innerHTML = '';
    const promptParam = model.params.find(p => p.key === 'prompt' || p.key === 'text');
    if (promptParam) f.appendChild(this.buildPromptModule(promptParam));

    // Render remaining params
    const byKey = Object.fromEntries(model.params.map(p => [p.key, p]));
    const otherParams = model.params.filter(p => p.key !== 'prompt' && p.key !== 'text');

    const group = (p, note = '') => {
      if (!p) return null;
      const g = document.createElement('div');
      g.className = 'form-group'; g.dataset.key = p.key;
      const def = p.default != null ? String(p.default) : '';
      let input = '';
      if (p.type === 'select') {
        input = `<select data-key="${esc(p.key)}">${(p.options || []).map(o => { const v = typeof o === 'object' ? o.value : o, l = typeof o === 'object' ? o.label : o; return `<option value="${esc(v)}" ${String(v) === def ? 'selected' : ''}>${esc(l)}</option>` }).join('')}</select>`;
      } else if (p.type === 'datalist') {
        input = `<input type="text" data-key="${esc(p.key)}" value="${esc(def)}" list="dl-${esc(p.key)}"><datalist id="dl-${esc(p.key)}">${(p.options || []).map(o => { const v = typeof o === 'object' ? o.value : o, l = typeof o === 'object' ? o.label : o; return `<option value="${esc(v)}">${esc(l)}</option>` }).join('')}</datalist>`;
      } else if (p.type === 'range') {
        const unit = p.unit || ((p.key === 'speed') ? 'x' : (p.key === 'duration' ? 's' : ''));
        input = `<div class="range-row"><input type="range" data-key="${esc(p.key)}" value="${esc(def)}" min="${p.min}" max="${p.max}" step="${p.step || 1}"><span class="range-value" id="rv-${esc(p.key)}">${esc(def)}${esc(unit)}</span></div>`;
      } else if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') {
        if (!this.refState[stateKey][p.key]) this.refState[stateKey][p.key] = [];
        input = this.renderRefGrid(p.key);
      } else if (p.type === 'url') {
        input = `<input type="url" data-key="${esc(p.key)}" value="${esc(def)}" placeholder="${esc(p.placeholder || 'https://...')}" ${p.required ? 'required' : ''}>`;
      } else {
        input = `<input type="text" data-key="${esc(p.key)}" value="${esc(def)}" placeholder="${esc(p.placeholder || '')}" ${p.required ? 'required' : ''}>`;
      }
      const label = `<label>${esc(p.label || p.key)} ${p.required ? '<span class="req">*</span>' : '<span class="opt">（可选）</span>'}</label>`;
      g.innerHTML = label + input + (note ? `<div class="hint">${esc(note)}</div>` : (p.hint ? `<div class="hint">${esc(p.hint)}</div>` : ''));
      return g;
    };

    const section = (title, hint, groups) => {
      const s = document.createElement('section');
      s.className = 'api-section';
      s.innerHTML = `<div class="api-section-title">${esc(title)}${hint ? ` <span style="float:right;font-weight:400;font-size:10px;color:var(--text-dim)">${esc(hint)}</span>` : ''}</div>`;
      groups.forEach(g => g && s.appendChild(g));
      f.appendChild(s);
      return s;
    };

    const modeSection = (title, hint, modes, builders) => {
      const s = document.createElement('section');
      s.className = 'api-section';
      s.innerHTML = `<div class="api-section-title">${esc(title)}${hint ? ` <span style="float:right;font-weight:400;font-size:10px;color:var(--text-dim)">${esc(hint)}</span>` : ''}</div><div class="api-mode-row">${modes.map((m, i) => `<button type="button" class="api-mode-btn ${i === 0 ? 'active' : ''}" data-api-mode="${esc(m.value)}">${esc(m.label)}</button>`).join('')}</div>`;
      const body = document.createElement('div'); s.appendChild(body);
      modes.forEach((m, i) => {
        const p = document.createElement('div');
        p.className = 'api-mode-panel ' + (i === 0 ? 'active' : '');
        p.dataset.apiModePanel = m.value;
        (builders[m.value] || (() => []))().forEach(g => g && p.appendChild(g));
        body.appendChild(p);
      });
      $$('.api-mode-btn', s).forEach(btn => btn.onclick = () => {
        $$('.api-mode-btn', s).forEach(x => x.classList.toggle('active', x === btn));
        $$('.api-mode-panel', s).forEach(x => x.classList.toggle('active', x.dataset.apiModePanel === btn.dataset.apiMode));
        this.updateEstimate();
      });
      f.appendChild(s);
      return s;
    };

    // Model-specific layouts
    if (model.id === 'wan3' || model.id === 'minimax_h3') {
      modeSection('参考素材', '只能选择一种',
        [{ label: '首 / 尾帧', value: 'frame' }, { label: '参考图片', value: 'images' }, { label: '参考视频', value: 'videos' }, { label: '参考音频', value: 'audios' }],
        { frame: () => [group(byKey.first_frame), group(byKey.last_frame, '尾帧必须搭配首帧')], images: () => [group(byKey.images)], videos: () => [group(byKey.videos)], audios: () => [group(byKey.audios)] }
      );
      section('生成参数', '', otherParams.filter(p => !['first_frame','last_frame','images','videos','audios'].includes(p.key)).map(p => group(p)));
    } else if (model.id === 'google_omni') {
      modeSection('参考素材', '参考图 / 视频二选一',
        [{ label: '无参考', value: 'none' }, { label: '参考图', value: 'image' }, { label: '参考视频', value: 'video' }],
        { none: () => [], image: () => [group(byKey.images)], video: () => [group(byKey.video)] }
      );
      section('生成参数', '', [group(byKey.size), group(byKey.duration)]);
    } else if (model.id === 'video_vidu') {
      modeSection('参考方式', '主体与图像参考互斥',
        [{ label: '主体参考', value: 'subject' }, { label: '图像参考', value: 'image' }],
        { subject: () => [group(byKey.subjects, '支持 1–7 张')], image: () => [group(byKey.image_url, '支持 1–7 张')] }
      );
      section('生成参数', '', otherParams.filter(p => !['subjects','image_url','video_url'].includes(p.key)).map(p => group(p)));
    } else if (model.id === 'video_omni') {
      modeSection('参考素材', '选择一种参考方式',
        [{ label: '无参考', value: 'none' }, { label: '首尾帧', value: 'frames' }, { label: '参考图', value: 'image' }, { label: '参考视频', value: 'video' }],
        { none: () => [], frames: () => [group(byKey.firstFrameUrl), group(byKey.lastFrameUrl, '尾帧必须搭配首帧')], image: () => [group(byKey.image_url)], video: () => [group(byKey.video_url, '有参考视频时 sound 必须为 off')] }
      );
      section('生成参数', '', otherParams.filter(p => !['firstFrameUrl','lastFrameUrl','image_url','video_url'].includes(p.key)).map(p => group(p)));
    } else if (model.id === 'veo3_fast') {
      modeSection('参考素材', '首尾帧与参考图互斥',
        [{ label: '无参考', value: 'none' }, { label: '首尾帧', value: 'frames' }, { label: '参考图', value: 'images' }],
        { none: () => [], frames: () => [group(byKey.firstFrameUrl), group(byKey.lastFrameUrl, '尾帧必须搭配首帧')], images: () => [group(byKey.urls, '最多 3 张')] }
      );
      section('生成参数', '', [group(byKey.aspectRatio), group(byKey.size)]);
    } else if (model.id === 'video_upscaling') {
      section('输入素材', '', [group(byKey.video_url)]);
    } else if (model.id === 'digital_humans') {
      section('素材输入', '均需公网可访问', [group(byKey.videoName), group(byKey.videoUrl, '视频时长不得低于 10 秒'), group(byKey.audioUrl)]);
    } else if (model.id === 'video_package') {
      section('素材输入', '', [group(byKey.video), group(byKey.template_id, '模板 ID 1–30')]);
    } else if (model.type === 'image') {
      section('生成参数', '', otherParams.filter(p => p.key !== 'urls').map(p => group(p)));
      if (byKey.urls) section('参考图', '', [group(byKey.urls, (model.id === 'nanoBanana2' || model.id === 'nanoBanana_pro') ? '最多 14 张' : '公网可访问 URL')]);
    } else if (model.type === 'audio') {
      section('生成参数', '', otherParams.filter(p => p.key !== 'audio_url').map(p => group(p)));
      if (byKey.audio_url) section('参考音频', '', [group(byKey.audio_url)]);
    } else {
      section('生成参数', '', otherParams.map(p => group(p)));
    }

    // Bind range inputs
    $$('[data-key]', f).forEach(el => el.oninput = () => {
      if (el.type === 'range') {
        const rv = $('#rv-' + el.dataset.key);
        if (rv) {
          const param = this.model.params.find(p => p.key === el.dataset.key);
          rv.textContent = el.value + (param?.unit || (param?.key === 'speed' ? 'x' : ''));
        }
      }
      this.updateEstimate();
    });

    this.bindRefEvents();
    this.updateEstimate();
  },

  /* ===== Prompt module (unified) ===== */
  buildPromptModule(param) {
    const wrap = document.createElement('div');
    wrap.className = 'prompt-module';
    wrap.dataset.key = param.key;
    const def = param.default != null ? String(param.default) : '';
    wrap.innerHTML = `
      <div class="prompt-head">
        <span class="prompt-title">提示词</span>
        <div class="prompt-head-actions">
          <button type="button" class="preset-btn" id="openPresetBtn" aria-label="选择预设">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            预设
          </button>
          <button type="button" class="icon-btn" id="savePresetBtn" aria-label="保存为预设">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          </button>
        </div>
      </div>
      <textarea id="promptInput" data-key="${esc(param.key)}" placeholder="${esc(param.placeholder || '描述你想要生成的内容…')}" maxlength="2000" ${param.required ? 'required' : ''}>${esc(def)}</textarea>
      <div class="prompt-tools">
        <button type="button" data-prompt-action="recent">最近</button>
        <button type="button" data-prompt-action="inspire">灵感</button>
        <button type="button" data-prompt-action="copy">复制</button>
        <button type="button" data-prompt-action="clear">清空</button>
        <span class="prompt-count" id="promptCount">0/2000</span>
      </div>
    `;
    // Bind events
    const ta = wrap.querySelector('#promptInput');
    const countEl = wrap.querySelector('#promptCount');
    const updateCount = () => { countEl.textContent = `${ta.value.length}/2000`; };
    ta.addEventListener('input', () => { updateCount(); this.updateEstimate(); });
    updateCount();
    wrap.querySelector('#openPresetBtn').onclick = () => this.openPresetSheet();
    wrap.querySelector('#savePresetBtn').onclick = () => {
      if (!ta.value.trim()) { Toast.warning('请先填写提示词'); return; }
      $('#presetNameInput').value = '';
      $('#presetSaveModal').classList.add('show');
      setTimeout(() => $('#presetNameInput').focus(), 100);
    };
    wrap.querySelector('[data-prompt-action="recent"]').onclick = () => this.showPromptHistory();
    wrap.querySelector('[data-prompt-action="inspire"]').onclick = () => this.insertInspiration();
    wrap.querySelector('[data-prompt-action="copy"]').onclick = async () => {
      const ok = await copy(ta.value); Toast[ok ? 'success' : 'error'](ok ? '已复制提示词' : '复制失败');
    };
    wrap.querySelector('[data-prompt-action="clear"]').onclick = () => {
      const old = ta.value; if (!old) return;
      ta.value = ''; ta.dispatchEvent(new Event('input', { bubbles: true }));
      Toast.success('已清空', { duration: 3000, actions: [{ label: '撤销', onClick: () => { ta.value = old; ta.dispatchEvent(new Event('input', { bubbles: true })); } }] });
    };
    return wrap;
  },
  getPromptTextarea() {
    return $('#promptInput') || $('#paramForm textarea[data-key="prompt"]') || $('#paramForm textarea[data-key="text"]');
  },
  showPromptHistory() {
    const h = Store.getPromptHistory();
    if (!h.length) { Toast.info('暂无最近提示词'); return; }
    const body = h.map((p, i) => `<div class="history-item" data-prompt-pick="${i}"><div class="history-info"><div class="hi-prompt" style="white-space:normal">${esc(trunc(p, 120))}</div></div></div>`).join('');
    $('#modalTitle').textContent = '最近提示词';
    $('#modalBody').innerHTML = body;
    $('#modalFooter').innerHTML = `<button class="act" id="modalClose">关闭</button>`;
    $('#modalClose').onclick = () => $('#modal').classList.remove('show');
    $$('#modalBody [data-prompt-pick]').forEach(el => el.onclick = () => {
      const idx = Number(el.dataset.promptPick);
      const ta = this.getPromptTextarea();
      if (ta) { ta.value = h[idx]; ta.dispatchEvent(new Event('input', { bubbles: true })); }
      $('#modal').classList.remove('show');
      Toast.success('已填入');
    });
    $('#modal').classList.add('show');
  },
  insertInspiration() {
    const ta = this.getPromptTextarea();
    if (!ta) return;
    const x = PROMPT_INSPIRATIONS[Math.floor(Math.random() * PROMPT_INSPIRATIONS.length)];
    ta.value = ta.value.trim() ? ta.value.trim().replace(/[。！？.!?]$/, '') + '，' + x : x;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    Toast.success('已加入灵感');
  },
  confirmSavePreset() {
    const name = String($('#presetNameInput').value || '').trim();
    if (!name) { Toast.warning('请输入预设名称'); return; }
    const ta = this.getPromptTextarea();
    const prompt = String(ta?.value || '').trim();
    if (!prompt) { Toast.warning('请先填写提示词'); return; }
    const id = Store.savePreset(name, this.tab, this.model?.id || '', prompt);
    if (id) {
      $('#presetSaveModal').classList.remove('show');
      Toast.success('已保存预设');
    }
  },

  /* ===== Preset sheet (bottom sheet) ===== */
  openPresetSheet() {
    $('#presetSearchInput').value = '';
    this._presetActiveTab = this._presetActiveTab || 'builtin';
    this._presetActiveCat = '';
    this.renderPresetSheet();
    this.openSheet('presetSheet', 'presetOverlay');
  },
  renderPresetSheet() {
    const q = String($('#presetSearchInput').value || '').trim().toLowerCase();
    const builtinMap = { image: PROMPT_PRESETS, video: VIDEO_PROMPT_PRESETS, audio: AUDIO_PROMPT_PRESETS };
    const builtins = builtinMap[this.tab] || [];
    const templates = PROMPT_TEMPLATES[this.tab] || [];
    const custom = Store.getPresets().filter(p => p.tab === this.tab);
    const body = $('#presetSheetBody');
    let html = '';

    // Tab switcher
    html += `<div style="display:flex;gap:4px;margin-bottom:10px"><button class="srb ${this._presetActiveTab === 'builtin' ? 'active' : ''}" data-ptab="builtin" style="flex:1">功能预设</button><button class="srb ${this._presetActiveTab === 'templates' ? 'active' : ''}" data-ptab="templates" style="flex:1">创意模板（${templates.length}）</button></div>`;

    if (this._presetActiveTab === 'builtin') {
      const filteredBuiltin = builtins.filter(p => !q || p.name.toLowerCase().includes(q) || p.prompt.toLowerCase().includes(q));
      html += `<div class="preset-section-title">内置（${filteredBuiltin.length}）</div>`;
      if (filteredBuiltin.length === 0) html += `<div class="preset-empty">无匹配预设</div>`;
      html += `<div class="preset-list">`;
      filteredBuiltin.forEach(p => {
        const icon = p.id === 'none' ? '🚫' : '✨';
        const preview = p.prompt ? trunc(p.prompt, 40) : '清空当前提示词前缀';
        html += `<div class="preset-item" data-builtin="${esc(p.id)}"><div class="pi-icon">${icon}</div><div class="pi-text"><div class="pi-name">${esc(p.name)}</div><div class="pi-preview">${esc(preview)}</div></div></div>`;
      });
      html += `</div>`;
      const filteredCustom = custom.filter(p => !q || p.name.toLowerCase().includes(q) || p.prompt.toLowerCase().includes(q));
      html += `<div class="preset-section-title">我的预设（${filteredCustom.length}）</div>`;
      if (filteredCustom.length === 0) {
        html += `<div class="preset-empty">暂无自定义预设，点击右上角 ＋ 保存当前提示词</div>`;
      } else {
        html += `<div class="preset-list">`;
        filteredCustom.forEach(p => {
          html += `<div class="preset-item" data-custom="${esc(p.id)}"><div class="pi-icon">📝</div><div class="pi-text"><div class="pi-name">${esc(p.name)}</div><div class="pi-preview">${esc(trunc(p.prompt, 40))}</div></div><button type="button" class="pi-del" data-del-custom="${esc(p.id)}" aria-label="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg></button></div>`;
        });
        html += `</div>`;
      }
    } else {
      // Templates tab
      const cats = {};
      templates.forEach(t => { if (!cats[t.category]) cats[t.category] = []; cats[t.category].push(t); });
      const catNames = Object.keys(cats);
      // Category chips
      html += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">`;
      html += `<button class="srb ${!this._presetActiveCat ? 'active' : ''}" data-cat="" style="padding:4px 10px">全部</button>`;
      catNames.forEach(c => { html += `<button class="srb ${this._presetActiveCat === c ? 'active' : ''}" data-cat="${esc(c)}" style="padding:4px 10px">${esc(c)}</button>`; });
      html += `</div>`;
      let shown = 0;
      catNames.forEach(cat => {
        if (this._presetActiveCat && this._presetActiveCat !== cat) return;
        const items = cats[cat].filter(t => !q || t.name.toLowerCase().includes(q) || t.prompt.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
        if (!items.length) return;
        html += `<div class="preset-section-title">${esc(cat)}（${items.length}）</div>`;
        html += `<div class="preset-list">`;
        items.forEach(t => {
          html += `<div class="preset-item" data-template="${esc(t.id)}"><div class="pi-icon">🎨</div><div class="pi-text"><div class="pi-name">${esc(t.name)}</div><div class="pi-preview">${esc(trunc(t.prompt, 40))}</div></div></div>`;
        });
        html += `</div>`;
        shown += items.length;
      });
      if (shown === 0) html += `<div class="preset-empty">无匹配模板</div>`;
    }

    body.innerHTML = html;

    // Bind tab switcher
    $$('#presetSheetBody [data-ptab]').forEach(el => el.onclick = () => {
      this._presetActiveTab = el.dataset.ptab;
      this._presetActiveCat = '';
      this.renderPresetSheet();
    });
    // Bind category chips
    $$('#presetSheetBody [data-cat]').forEach(el => el.onclick = () => {
      this._presetActiveCat = el.dataset.cat;
      this.renderPresetSheet();
    });
    $$('#presetSheetBody [data-builtin]').forEach(el => el.onclick = () => {
      this.applyBuiltinPreset(el.dataset.builtin);
      this.closeSheet('presetSheet', 'presetOverlay');
    });
    $$('#presetSheetBody [data-custom]').forEach(el => el.onclick = e => {
      if (e.target.closest('[data-del-custom]')) return;
      this.applyCustomPreset(el.dataset.custom);
      this.closeSheet('presetSheet', 'presetOverlay');
    });
    $$('#presetSheetBody [data-template]').forEach(el => el.onclick = () => {
      this.applyTemplate(el.dataset.template);
      this.closeSheet('presetSheet', 'presetOverlay');
    });
    $$('#presetSheetBody [data-del-custom]').forEach(el => el.onclick = e => {
      e.stopPropagation();
      const id = el.dataset.delCustom;
      if (!confirm('删除这个预设？')) return;
      Store.delPreset(id);
      this.renderPresetSheet();
      Toast.success('已删除');
    });
  },
  applyTemplate(id) {
    const templates = PROMPT_TEMPLATES[this.tab] || [];
    const tpl = templates.find(t => t.id === id);
    if (!tpl) return;
    const ta = this.getPromptTextarea();
    if (ta) { ta.value = tpl.prompt; ta.dispatchEvent(new Event('input', { bubbles: true })); }
    Toast.success(`已应用模板: ${tpl.name}`);
  },
  applyBuiltinPreset(id) {
    const builtinMap = { image: PROMPT_PRESETS, video: VIDEO_PROMPT_PRESETS, audio: AUDIO_PROMPT_PRESETS };
    const list = builtinMap[this.tab] || PROMPT_PRESETS;
    const preset = list.find(x => x.id === id) || list[0];
    const ta = this.getPromptTextarea();
    if (!ta) { Toast.warning('当前模型无提示词'); return; }
    const key = this.tab + '/' + this.model.id;
    const prevBase = this.promptPresetBase[key] || '';
    let tail = ta.value;
    if (prevBase && tail.startsWith(prevBase)) tail = tail.slice(prevBase.length).trimStart();
    ta.value = preset.prompt ? (tail ? preset.prompt + '\n' + tail : preset.prompt) : tail;
    this.promptPresetBase[key] = preset.prompt || '';
    this.promptPresetName[key] = preset.id === 'none' ? '' : preset.name;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    Toast.success(preset.id === 'none' ? '已取消预设' : `已套用：${preset.name}`);
  },
  applyCustomPreset(id) {
    const p = Store.getPresets().find(x => x.id === id);
    if (!p) return;
    const ta = this.getPromptTextarea();
    if (ta) { ta.value = p.prompt; ta.dispatchEvent(new Event('input', { bubbles: true })); }
    const key = this.tab + '/' + this.model.id;
    this.promptPresetBase[key] = '';
    this.promptPresetName[key] = '';
    Toast.success('已载入预设');
  },

  /* ===== Refs ===== */
  getRefs(key) {
    const state = this.refState[this.currentRefKey];
    if (!state) { this.refState[this.currentRefKey] = {}; return []; }
    if (!state[key]) state[key] = [];
    return state[key];
  },
  setRefs(key, refs) {
    const state = this.refState[this.currentRefKey];
    if (state) state[key] = Array.isArray(refs) ? refs.map(r => ({ ...r })) : [];
  },
  clearRefs(key) { this.setRefs(key, []); },
  renderRefGrid(key) {
    const refs = this.getRefs(key);
    const param = this.model && this.model.params.find(p => p.key === key);
    const isVideoParam = param && param.type === 'ref-video';
    const isAudioParam = param && param.type === 'ref-audio';
    const items = refs.map(r => {
      const src = r.remote || r.src || '';
      const isVideo = r.mediaType === 'video' || r.kind === 'local-video' || r.kind === 'url-video';
      const isAudio = r.mediaType === 'audio' || r.kind === 'local-audio' || r.kind === 'url-audio';
      if (isVideo) {
        const m = r.meta || {}; const parts = [];
        if (m.width && m.height) parts.push(`${m.width}×${m.height}`);
        if (m.duration) parts.push(`${m.duration}s`);
        if (m.sizeMB) parts.push(`${m.sizeMB}MB`);
        if (parts.length) metaOverlay = `<div class="ref-meta-overlay">${parts.join(' · ')}</div>`;
        const body = src ? `<video src="${esc(src)}" preload="metadata" muted playsinline></video>` : '<span class="ref-failed">预览失败</span>';
        return `<div class="ref-item ref-item-video">${body}${metaOverlay}<div class="ref-play-icon">▶</div>${r.remote ? `<div class="ref-badge uploaded">已传</div>` : '<div class="ref-badge local">本地</div>'}<button type="button" class="ref-del" data-key="${esc(key)}" data-rid="${esc(r.id)}" aria-label="删除">×</button></div>`;
      }
      if (isAudio) {
        const name = trunc(r.name || 'audio', 10);
        return `<div class="ref-item ref-item-audio"><div class="ref-audio-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="ref-audio-name">${esc(name)}</span></div>${r.remote ? `<div class="ref-badge uploaded">已传</div>` : '<div class="ref-badge local">本地</div>'}<button type="button" class="ref-del" data-key="${esc(key)}" data-rid="${esc(r.id)}" aria-label="删除">×</button></div>`;
      }
      const body = src ? `<img src="${esc(src)}" loading="lazy" alt="${esc(r.name || '参考图')}" referrerpolicy="no-referrer">` : '<span class="ref-failed">预览失败</span>';
      return `<div class="ref-item">${body}${r.remote ? `<div class="ref-badge uploaded">已传</div>` : '<div class="ref-badge local">本地</div>'}<button type="button" class="ref-del" data-key="${esc(key)}" data-rid="${esc(r.id)}" aria-label="删除">×</button></div>`;
    }).join('');
    const addLabel = isVideoParam ? '参考视频' : isAudioParam ? '参考音频' : '参考图';
    const addBtn = `<button type="button" class="ref-add" data-key="${esc(key)}" aria-label="添加${addLabel}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>添加</span></button>`;
    const showWarn = isVideoParam || isAudioParam;
    const warn = showWarn ? `<div class="ref-status-bar" id="rsb-${esc(key)}"><span>素材 ${refs.length}</span><span class="${refs.some(r => !r.uploaded) ? 'pending' : 'ready'}">${refs.some(r => !r.uploaded) ? '待上传' : '已就绪'}</span></div>` : '';
    const gridClass = isVideoParam ? 'ref-grid ref-grid-video' : isAudioParam ? 'ref-grid ref-grid-audio' : 'ref-grid';
    return `<div class="ref-wrap" data-ref-key="${esc(key)}"><div class="${gridClass}" data-key="${esc(key)}">${items}${addBtn}</div>${warn}<div class="ref-progress" id="rp-${esc(key)}"><div class="ring"></div><span id="rpt-${esc(key)}">上传中…</span></div></div>`;
  },
  bindRefEvents() {
    const f = $('#paramForm'); if (!f) return;
    $$('.ref-add[data-key]', f).forEach(b => b.onclick = () => this.openSourcePicker(b.dataset.key));
    $$('.ref-del[data-key]', f).forEach(b => b.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      this.removeRef(b.dataset.key, b.dataset.rid);
    });
    $$('.ref-item-video video', f).forEach(v => {
      v.addEventListener('loadeddata', () => { try { v.currentTime = 0.1; } catch {} });
      v.onclick = e => { e.stopPropagation(); this.openVideoLightbox(v.src); };
    });
    $$('.ref-item img', f).forEach(img => { img.onclick = () => this.openLightbox(img.src); });
  },
  removeRef(key, id) {
    const refs = this.getRefs(key);
    const i = refs.findIndex(r => r.id === id);
    if (i >= 0) refs.splice(i, 1);
    this.refreshRefGrid(key);
  },
  refreshRefGrid(key) {
    const wrap = $(`.ref-wrap[data-ref-key="${CSS.escape(key)}"]`);
    if (wrap) {
      wrap.outerHTML = this.renderRefGrid(key);
      this.bindRefEvents();
    }
  },
  /* ===== Source picker (相册/文件/URL/最近) ===== */
  openSourcePicker(key) {
    const param = this.model?.params.find(p => p.key === key);
    if (!param) return;
    this.activeSourceRefKey = key;
    this.activeSourceIsVideo = param.type === 'ref-video';
    this.activeSourceIsAudio = param.type === 'ref-audio';
    const title = param.type === 'ref-video' ? '添加参考视频' : param.type === 'ref-audio' ? '添加参考音频' : (isFrameKey(key) ? '添加' + param.label : '添加参考图');
    $('#sourceSheetTitle').textContent = title;
    const isVideo = this.activeSourceIsVideo;
    const isAudio = this.activeSourceIsAudio;
    const mediaLabel = isVideo ? '视频' : isAudio ? '音频' : '图片';
    const list = $('#sourceList');
    list.innerHTML = `
      <button type="button" class="source-item" data-source="album">
        <div class="si-icon">📁</div>
        <div class="si-text"><div class="si-name">从相册选择</div><div class="si-desc">选择${mediaLabel}</div></div>
      </button>
      <button type="button" class="source-item" data-source="file">
        <div class="si-icon">📂</div>
        <div class="si-text"><div class="si-name">从文件选择</div><div class="si-desc">本地${mediaLabel}文件</div></div>
      </button>
      <button type="button" class="source-item" data-source="url">
        <div class="si-icon">🔗</div>
        <div class="si-text"><div class="si-name">输入网址</div><div class="si-desc">粘贴公网 URL</div></div>
      </button>
      <button type="button" class="source-item" data-source="recent">
        <div class="si-icon">📋</div>
        <div class="si-text"><div class="si-name">从最近结果选择</div><div class="si-desc">已成功生成的内容</div></div>
      </button>
    `;
    $$('#sourceList [data-source]').forEach(el => el.onclick = () => this.handleSourcePick(el.dataset.source));
    this.openSheet('sourceSheet', 'sourceOverlay');
  },
  handleSourcePick(source) {
    const key = this.activeSourceRefKey;
    const isVideo = this.activeSourceIsVideo;
    if (source === 'album') {
      this.closeSheet('sourceSheet', 'sourceOverlay');
      const inp = $('#albumInput');
      inp.accept = isVideo ? 'video/*' : 'image/*';
      inp.click();
    } else if (source === 'file') {
      this.closeSheet('sourceSheet', 'sourceOverlay');
      const inp = $('#fileInput');
      inp.accept = isVideo ? 'video/*' : isAudio ? 'audio/*' : 'image/*';
      inp.click();
    } else if (source === 'url') {
      this.closeSheet('sourceSheet', 'sourceOverlay');
      this.promptForUrl(key, isVideo, isAudio);
    } else if (source === 'recent') {
      this.closeSheet('sourceSheet', 'sourceOverlay');
      this.openRecentPicker(key, isVideo);
    }
  },
  promptForUrl(key, isVideo, isAudio) {
    const label = isVideo ? '视频' : isAudio ? '音频' : '图片';
    $('#modalTitle').textContent = `输入${label}网址`;
    $('#modalBody').innerHTML = `<input type="url" id="urlInputField" placeholder="https://..." style="margin-bottom:8px"><div style="font-size:11px;color:var(--text-dim)">必须是 http:// 或 https:// 开头的公网地址</div>`;
    $('#modalFooter').innerHTML = `<button class="act" id="modalClose">取消</button><button class="act primary" id="urlConfirmBtn">添加</button>`;
    $('#modalClose').onclick = () => $('#modal').classList.remove('show');
    $('#urlConfirmBtn').onclick = () => {
      const url = String($('#urlInputField').value || '').trim();
      if (!/^https?:\/\/\S+$/i.test(url)) { Toast.warning('请输入合法的 URL'); return; }
      this._addUrlRefTyped(key, url, isVideo, isAudio);
      $('#modal').classList.remove('show');
    };
    $('#modal').classList.add('show');
    setTimeout(() => $('#urlInputField').focus(), 100);
  },
  openRecentPicker(key, isVideo) {
    const history = Store.getHistory().filter(h => h.status === 'success' && h.resultUrl);
    const filtered = isVideo ? history.filter(h => h.type === 'video') : history.filter(h => h.type === 'image');
    const body = $('#recentListBody');
    if (filtered.length === 0) {
      body.innerHTML = `<div class="preset-empty">暂无最近${isVideo ? '视频' : '图片'}结果</div>`;
    } else {
      body.innerHTML = `<div class="ref-grid">` + filtered.slice(0, 30).map(h => `<div class="ref-item" data-recent-url="${esc(h.resultUrl)}">${isVideo ? `<video src="${esc(h.resultUrl)}" preload="metadata" muted></video><div class="ref-play-icon">▶</div>` : `<img src="${esc(h.resultUrl)}" loading="lazy" referrerpolicy="no-referrer">`}</div>`).join('') + `</div>`;
      $$('#recentListBody [data-recent-url]').forEach(el => el.onclick = () => {
        this.addUrlRef(key, el.dataset.recentUrl, isVideo);
        this.closeSheet('recentSheet', 'recentOverlay');
      });
    }
    this.openSheet('recentSheet', 'recentOverlay');
  },
  handleFilePick(files) {
    const key = this.activeSourceRefKey;
    if (!key) return;
    files.forEach(file => {
      if (/^video\//.test(file.type)) this.addLocalVideoRef(file, key);
      else if (/^audio\//.test(file.type)) this.addLocalAudioRef(file, key);
      else if (/^image\//.test(file.type)) this.addLocalImageRef(file, key);
      else Toast.warning(`不支持的文件类型：${file.type || file.name}`);
    });
  },
  addLocalImageRef(file, key) {
    if (!/^image\//.test(file.type)) { Toast.error('非图片文件'); return; }
    if (file.size > 10 * 1024 * 1024) { Toast.error('图片不能超过 10MB'); return; }
    const r = new FileReader();
    r.onload = async () => {
      const ref = { id: 'r_' + genId(), kind: 'local', src: r.result, name: file.name, uploaded: false, remote: null };
      this.getRefs(key).push(ref);
      this.refreshRefGrid(key);
      if (CONFIG.R2.WORKER_URL) {
        try {
          let u = Api.getCached(ref.src);
          if (!u) { u = await Api.uploadDataUrl(ref.src); Api.setCached(ref.src, u); }
          ref.remote = u; ref.uploaded = true; ref.kind = 'url';
          this.refreshRefGrid(key);
          Toast.success('参考图已上传');
        } catch (e) { Toast.warning('参考图上传失败：' + e.message); }
      } else {
        Toast.info('已添加（未配置 R2，仅本地预览）');
      }
    };
    r.onerror = () => Toast.error('读取图片失败');
    r.readAsDataURL(file);
  },
  addLocalVideoRef(file, key) {
    if (!/^video\//.test(file.type)) { Toast.error('非视频文件'); return; }
    if (file.size > 100 * 1024 * 1024) { Toast.error('视频不能超过 100MB'); return; }
    const objectUrl = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true;
    const finalize = meta => {
      this.getRefs(key).push({ id: 'r_' + genId(), kind: 'local-video', src: objectUrl, name: file.name, uploaded: false, remote: null, mediaType: 'video', meta: meta || {}, _file: file });
      this.refreshRefGrid(key);
      Toast.success('已添加视频');
      if (CONFIG.R2.WORKER_URL) {
        Toast.info('正在上传到 R2…');
        this.uploadLocalVideoToR2(key, objectUrl, file).catch(err => Toast.warning('上传失败：' + err.message));
      } else {
        Toast.warning('未配置 R2，无法上传视频（仅本地预览，无法提交）');
      }
    };
    v.onloadedmetadata = () => finalize({ duration: v.duration ? +v.duration.toFixed(1) : null, width: v.videoWidth || null, height: v.videoHeight || null, sizeMB: +(file.size / 1024 / 1024).toFixed(1) });
    v.onerror = () => finalize({ sizeMB: +(file.size / 1024 / 1024).toFixed(1) });
    v.src = objectUrl;
  },
  async uploadLocalVideoToR2(key, objectUrl, file) {
    const refs = this.getRefs(key);
    const ref = refs.find(r => r.src === objectUrl);
    if (!ref) return;
    const prog = $('#rp-' + key); if (prog) prog.classList.add('show');
    try {
      const remoteUrl = await Api.uploadToR2(file, pct => { const t = $('#rpt-' + key); if (t) t.textContent = `上传中 ${pct}%`; });
      ref.kind = 'url-video'; ref.src = remoteUrl; ref.remote = remoteUrl; ref.uploaded = true;
      this.refreshRefGrid(key);
      Toast.success('视频已上传');
    } finally { if (prog) prog.classList.remove('show'); }
  },
  addLocalAudioRef(file, key) {
    if (!/^audio\//.test(file.type)) { Toast.error('非音频文件'); return; }
    if (file.size > 50 * 1024 * 1024) { Toast.error('音频不能超过 50MB'); return; }
    const objectUrl = URL.createObjectURL(file);
    const ref = { id: 'r_' + genId(), kind: 'local-audio', src: objectUrl, name: file.name, uploaded: false, remote: null, mediaType: 'audio', _file: file };
    this.getRefs(key).push(ref);
    this.refreshRefGrid(key);
    Toast.success('已添加音频');
    if (CONFIG.R2.WORKER_URL) {
      Toast.info('正在上传到 R2…');
      this.uploadLocalAudioToR2(key, objectUrl, file).catch(err => Toast.warning('上传失败：' + err.message));
    } else {
      Toast.warning('未配置 R2，无法上传音频（仅本地预览，无法提交）');
    }
  },
  async uploadLocalAudioToR2(key, objectUrl, file) {
    const refs = this.getRefs(key);
    const ref = refs.find(r => r.src === objectUrl);
    if (!ref) return;
    const prog = $('#rp-' + key); if (prog) prog.classList.add('show');
    try {
      const remoteUrl = await Api.uploadToR2(file, pct => { const t = $('#rpt-' + key); if (t) t.textContent = `上传中 ${pct}%`; });
      ref.kind = 'url-audio'; ref.src = remoteUrl; ref.remote = remoteUrl; ref.uploaded = true;
      this.refreshRefGrid(key);
      Toast.success('音频已上传');
    } finally { if (prog) prog.classList.remove('show'); }
  },
  addUrlRef(key, url, isVideo) {
    return this._addUrlRefTyped(key, url, isVideo, false);
  },
  _addUrlRefTyped(key, url, isVideo, isAudio) {
    if (!/^https?:\/\/\S+$/i.test(url)) { Toast.warning('URL 不合法'); return; }
    const refs = this.getRefs(key);
    if (refs.some(r => (r.remote || r.src) === url)) { Toast.info('该 URL 已存在'); return; }
    const kind = isVideo ? 'url-video' : isAudio ? 'url-audio' : 'url';
    const mediaType = isVideo ? 'video' : isAudio ? 'audio' : 'image';
    const name = isVideo ? 'URL视频' : isAudio ? 'URL音频' : 'URL图片';
    refs.push({
      id: 'r_' + genId(),
      kind, src: url, name, uploaded: true, remote: url, mediaType
    });
    this.refreshRefGrid(key);
    Toast.success(isVideo ? '已添加参考视频' : '已添加参考图');
  },

  /* ===== Form cache ===== */
  saveFormToCache() {
    if (!this.model) return;
    const key = this.tab + '_' + this.model.id, params = {}, f = $('#paramForm'); if (!f) return;
    this.model.params.forEach(p => {
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') {
        const refs = this.getRefs(p.key); if (refs.length) params[p.key] = refs.map(r => ({ ...r }));
      } else {
        const el = this.getParamElement(p.key);
        if (el) params[p.key] = el.value;
      }
    });
    const presetKey = this.tab + '/' + this.model.id;
    params.__promptPresetBase = this.promptPresetBase[presetKey] || '';
    params.__promptPresetName = this.promptPresetName[presetKey] || '';
    this.formCache[key] = params;
    this.formCache[this.tab + '_model'] = this.model.id;
  },
  restoreFormFromCache() {
    if (!this.model) return;
    const saved = this.formCache[this.tab + '_' + this.model.id];
    if (!saved) return;
    const presetKey = this.tab + '/' + this.model.id;
    this.promptPresetBase[presetKey] = saved.__promptPresetBase || '';
    this.promptPresetName[presetKey] = saved.__promptPresetName || '';
    this.model.params.filter(p => p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio').forEach(p => this.clearRefs(p.key));
    const f = $('#paramForm'); if (!f) return;
    this.model.params.forEach(p => {
      if (saved[p.key] === undefined) return;
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') {
        const refs = Array.isArray(saved[p.key]) ? saved[p.key] : [];
        this.setRefs(p.key, refs); this.refreshRefGrid(p.key);
      } else if (p.type === 'range') {
        const el = this.getParamElement(p.key);
        if (el) { el.value = saved[p.key]; const rv = $('#rv-' + p.key); if (rv) rv.textContent = saved[p.key] + (p.unit || ''); }
      } else {
        const el = this.getParamElement(p.key);
        if (el) el.value = saved[p.key];
      }
    });
    this.updateEstimate();
  },
  getParamElement(key) {
    return $(`#paramForm [data-key="${CSS.escape(key)}"]`) || null;
  },
  readFieldValue(el) {
    if (!el) return '';
    return String(el.value ?? '').trim();
  },
  collectParamsSync() {
    const body = {}; const f = $('#paramForm'); if (!f || !this.model) return body;
    this.model.params.forEach(p => {
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') return;
      // Support both .form-group and .prompt-module containers
      let g = f.querySelector(`.form-group[data-key="${CSS.escape(p.key)}"]`);
      if (!g) g = f.querySelector(`.prompt-module[data-key="${CSS.escape(p.key)}"]`);
      if (!g) return;
      const hiddenPanel = g.closest('.api-mode-panel');
      if (hiddenPanel && !hiddenPanel.classList.contains('active')) return;
      const el = g.querySelector(`[data-key="${CSS.escape(p.key)}"]`) || g.querySelector('input,textarea,select');
      let val = this.readFieldValue(el);
      if (p.type === 'range') val = Number(val);
      if (val !== '' && !(p.type === 'range' && !Number.isFinite(val))) body[p.key] = val;
    });
    return body;
  },
  async collectParamsAsync() {
    const body = {}; const errors = []; const f = $('#paramForm');
    const model = this.model;
    if (!model || !f) return { body, errors: ['模型参数未加载'] };
    for (const p of model.params) {
      let g = f.querySelector(`.form-group[data-key="${CSS.escape(p.key)}"]`);
      if (!g) g = f.querySelector(`.prompt-module[data-key="${CSS.escape(p.key)}"]`);
      if (g) { const hiddenPanel = g.closest('.api-mode-panel'); if (hiddenPanel && !hiddenPanel.classList.contains('active')) continue; }
      let val = null;
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio' || p.type === 'ref-audio') {
        const refs = this.getRefs(p.key);
        if (p.type === 'ref-video') {
          const localVideo = refs.filter(r => r.kind === 'local-video');
          if (localVideo.length > 0) { errors.push(`${p.label}：${localVideo.length} 个本地视频未上传，请等待上传完成或配置 R2`); continue; }
        }
        if (p.type === 'ref-audio') {
          const localAudio = refs.filter(r => r.kind === 'local-audio');
          if (localAudio.length > 0) { errors.push(`${p.label}：${localAudio.length} 个本地音频未上传，请等待上传完成或配置 R2`); continue; }
        }
        if (refs.length > 0) {
          const pending = refs.filter(r => r.kind === 'local' && !r.uploaded);
          if (pending.length > 0) {
            const prog = $('#rp-' + p.key); if (prog) prog.classList.add('show');
            const results = await Promise.all(pending.map(async r => {
              try { let u = Api.getCached(r.src); if (!u) { u = await Api.uploadDataUrl(r.src); Api.setCached(r.src, u); } r.remote = u; r.uploaded = true; return { ok: true }; }
              catch (e) { return { ok: false, name: r.name, msg: e.message }; }
            }));
            this.refreshRefGrid(p.key);
            if (prog) prog.classList.remove('show');
            const fails = results.filter(x => !x.ok);
            if (fails.length) { errors.push(fails.map(x => `${x.name}: ${x.msg}`).join('; ')); continue; }
          }
          const urls = refs.map(r => r.remote || r.src).filter(u => !/^data:/i.test(u) && !/^blob:/i.test(u));
          if (urls.length) body[p.key] = p.output === 'csv' ? urls.join(',') : (p.output === 'single' ? urls[0] : urls);
        }
      } else {
        const el = this.getParamElement(p.key);
        val = this.readFieldValue(el);
        if (p.type === 'range') val = Number(val);
        if (val !== '' && val != null) body[p.key] = val;
      }
      if (p.required && (val == null || val === '' || (Array.isArray(val) && !val.length) || (body[p.key] == null))) {
        errors.push(p.label); g?.classList.add('error');
      } else { g?.classList.remove('error'); }
    }
    // Model-level cross-validation
    if ((model.id === 'wan3' || model.id === 'minimax_h3') && (body.first_frame || body.last_frame)) {
      if (body.images || body.videos || body.audios) errors.push('首/尾帧不能同时搭配参考图、参考视频或参考音频');
      if (body.last_frame && !body.first_frame) errors.push('尾帧需要搭配首帧');
    }
    if (model.id === 'veo3_fast') {
      if (body.lastFrameUrl && !body.firstFrameUrl) errors.push('尾帧需要搭配首帧');
      if ((body.firstFrameUrl || body.lastFrameUrl) && body.urls) errors.push('首尾帧与参考图不能同时使用');
    }
    if (model.id === 'video_omni' && body.video_url && body.sound === 'on') errors.push('有参考视频时声音必须关闭');
    const strict = normalizeAndValidateApiBody(this.model, body);
    errors.push(...strict.errors);
    return { body: strict.body, errors };
  },

  /* ===== Estimate ===== */
  updateEstimate() {
    if (!this.model) return;
    const est = calcEstimate(this.model, this.collectParamsSync());
    const el = $('#estimate');
    if (!est) { el.innerHTML = ''; return; }
    el.innerHTML = est.amount != null
      ? `预计 <span class="val">¥${est.amount < 1 ? est.amount.toFixed(4) : est.amount.toFixed(2)}</span> · ${esc(est.label)}`
      : `<span style="color:var(--warning)">${esc(est.label)}</span>`;
  },

  /* ===== Generate ===== */
  async handleGenerate() {
    if (!Store.getApiKey()) { this.openSheet('settingsSheet', 'settingsOverlay'); Toast.error('请先填写 API 密钥'); return; }
    if (!this.model) { Toast.warning('请先选择模型'); return; }
    const btn = $('#genBtn'); if (btn?.disabled) return;
    btn.disabled = true; $('#genBtnText').textContent = '准备中…';
    try {
      const collected = await this.collectParamsAsync();
      // Last-line: re-read prompt/text directly
      const promptParam = this.model.params.find(p => p.key === 'prompt' || p.key === 'text');
      if (promptParam) {
        const ta = this.getPromptTextarea();
        const v = String(ta?.value || '').trim();
        if (v) collected.body[promptParam.key] = v;
        const idx = collected.errors.findIndex(x => x === promptParam.label);
        if (v && idx >= 0) collected.errors.splice(idx, 1);
        if (!v && !collected.errors.some(x => String(x).includes(promptParam.label))) collected.errors.push(promptParam.label);
      }
      if (collected.errors.length) { Toast.warning(`请完善：${collected.errors.join('、')}`); return; }
      const body = collected.body;
      const promptVal = body.prompt || body.text || body.video_url || body.videoName || body.audio_url || '';
      if (promptVal) Store.addPromptHistory(String(promptVal));
      const summary = trunc(String(promptVal), 40);
      const taskId = genId(), historyId = 'h_' + taskId.slice(2), now = Date.now();
      if (this.model.async) {
        $('#genBtnText').textContent = '提交中…';
        let resp;
        try { resp = await Api.submit(this.model.endpoint, body); }
        catch (e) { const cls = classifyErr(e.message); Toast.error(`${cls.category}：${cls.hint}`); return; }
        const apiData = (typeof resp?.data === 'string') ? (() => { try { return JSON.parse(resp.data); } catch { return null; } })() : resp?.data;
        const apiId = apiData?.id || resp?.data?.id;
        if (!apiId) { Toast.error('服务未返回任务 ID，请稍后重试'); return; }
        Store.addTask({ id: taskId, apiId, historyId, tab: this.tab, modelId: this.model.id, modelName: this.model.name, type: this.model.type, params: body, prompt: summary, status: 'running', startTime: now, async: true, createdAt: now });
        Store.addHistory({ id: historyId, taskId, apiId, tab: this.tab, modelId: this.model.id, modelName: this.model.name, type: this.model.type, params: body, prompt: summary, status: 'running', startTime: now, createdAt: now });
        this.renderResults();
        poller.start({ id: taskId, apiId, modelName: this.model.name, startTime: now, historyId });
        this.switchView('result');
        Toast.success('任务已提交，后台生成中');
      } else {
        Store.addTask({ id: taskId, historyId, tab: this.tab, modelId: this.model.id, modelName: this.model.name, type: this.model.type, params: body, prompt: summary, status: 'running', startTime: now, async: false, createdAt: now });
        Store.addHistory({ id: historyId, taskId, tab: this.tab, modelId: this.model.id, modelName: this.model.name, type: this.model.type, params: body, prompt: summary, status: 'running', startTime: now, createdAt: now });
        this.renderResults();
        $('#genBtnText').textContent = '调用中…';
        try {
          const resp = await Api.syncCall(this.model.endpoint, body);
          const url = resp?.data?.url || resp?.data?.demo_audio || Api.extractUrl(resp) || '';
          if (!url) throw new Error('服务返回成功，但未找到结果 URL');
          const done = Date.now();
          Store.updateTask(taskId, { status: 'success', resultUrl: url, rawDetail: resp, endTime: done, elapsed: done - now });
          Store.updateHistory(historyId, { status: 'success', resultUrl: url, endTime: done, elapsed: done - now });
          Toast.success('生成成功'); this.playSound();
          this.switchView('result');
        } catch (e) {
          const done = Date.now();
          const cls = classifyErr(e.message);
          Store.updateTask(taskId, { status: 'failed', error: e.message, endTime: done });
          Store.updateHistory(historyId, { status: 'failed', error: e.message, endTime: done });
          Toast.error(`${cls.category}：${cls.hint}`);
        }
        this.renderResults();
      }
    } catch (e) {
      console.error(e);
      Toast.error(`操作失败：${e?.message || '未知错误'}`);
    } finally {
      btn.disabled = false;
      $('#genBtnText').textContent = '生成';
    }
  },

  /* ===== Render results ===== */
  renderResults() {
    const list = $('#resultList');
    const tasks = Store.getTasks();
    list.innerHTML = '';
    if (tasks.length === 0) {
      list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><h3>暂无生成任务</h3><p>填写参数并点击「生成」</p></div>`;
      return;
    }
    const visible = tasks.slice(0, this.page);
    list.innerHTML = visible.map(t => this.renderCard(t)).join('');
    if (tasks.length > visible.length) {
      list.innerHTML += `<button class="act" style="justify-content:center;margin-top:8px;width:100%" id="loadMore">加载更多（剩余 ${tasks.length - visible.length}）</button>`;
      $('#loadMore').onclick = () => { this.page += 20; this.renderResults(); };
    }
    this.bindCardEvents();
  },
  renderCard(t) {
    const stMap = { running: '生成中', success: '成功', failed: '失败', timeout: '超时', stopped: '已停止' };
    const st = stMap[t.status] || t.status;
    const sc = t.status === 'timeout' ? 'timeout' : (t.status === 'stopped' ? 'stopped' : t.status);
    const prompt = t.prompt || trunc(JSON.stringify(t.params).slice(0, 60), 40);
    let body = '';
    if (t.status === 'running') {
      const elapsed = t.elapsed || (Date.now() - (t.startTime || Date.now()));
      const phase = poller.getPhase(elapsed)?.name || '';
      const interval = (poller.getPhase(elapsed)?.interval || 3000) / 1000;
      body = `${t.apiId ? `<div class="task-id">ID: ${esc(t.apiId)} <button class="copy-mini" data-url="${esc(t.apiId)}">复制</button></div>` : ''}<div class="skeleton skeleton-media"></div><div class="bar"></div><div class="timer"><span class="dot"></span>${fmtDur(elapsed)} · ${esc(phase)} ${interval}s${t.error ? ` · ${esc(t.error)}` : ''}</div><div class="poll-actions"><button class="act" data-refresh="${t.id}">刷新</button><button class="act danger" data-stop="${t.id}">停止</button></div>`;
    } else if (t.status === 'success' && t.resultUrl) {
      const m = t.type === 'image' ? `<img src="${esc(t.resultUrl)}" loading="lazy" referrerpolicy="no-referrer" data-preview="${esc(t.resultUrl)}" alt="生成结果">`
        : t.type === 'video' ? `<video src="${esc(t.resultUrl)}" controls preload="metadata" playsinline></video>`
        : `<audio src="${esc(t.resultUrl)}" controls></audio>`;
      body = `<div class="media">${m}</div><div class="url-row"><span style="flex:1">${esc(t.resultUrl)}</span><button class="copy-mini" data-url="${esc(t.resultUrl)}">复制</button></div><div class="actions"><button class="act" data-copy="${esc(t.resultUrl)}" aria-label="复制链接"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button><a class="act" href="${esc(t.resultUrl)}" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</a>${t.type === 'image' ? `<button class="act" data-edit="${esc(t.resultUrl)}">✏ 编辑</button>` : ''}<button class="act" data-ref="${esc(t.resultUrl)}" data-type="${t.type}">📌 用作参考</button><button class="act" data-regen="${t.id}">🔄 重生成</button><button class="act" data-copy-workflow="${t.id}">📋 工作流</button><button class="act danger" data-del="${t.id}">🗑 删除</button></div>`;
    } else if (t.status === 'failed' || t.status === 'timeout' || t.status === 'stopped') {
      const cls = classifyErr(t.error);
      const retryTip = cls.category === '认证' ? '检查设置中的 API 密钥'
        : (cls.category === '网络' || cls.category === '超时') ? '检查网络后点「刷新」或「重生成」'
        : '检查参数后重试';
      body = `<div class="err-banner"><strong>${esc(cls.category)}：${esc(t.error || '错误')}</strong><br><span>${esc(cls.hint)}</span><br><span style="font-size:10px;color:var(--text-dim)">建议：${esc(retryTip)}</span></div>${t.apiId ? `<div class="poll-actions"><button class="act" data-refresh="${t.id}">刷新</button></div>` : ''}<div class="actions"><button class="act" data-regen="${t.id}">🔄 重生成</button><button class="act" data-copy-workflow="${t.id}">📋 工作流</button><button class="act danger" data-del="${t.id}">🗑 删除</button></div>`;
    }
    return `<div class="card" data-id="${t.id}"><div class="card-top"><span class="card-model">${esc(t.modelName)}</span><span class="pill ${sc}">${st}</span></div><div class="card-prompt">${esc(prompt)}</div><div class="card-body">${body}</div></div>`;
  },
  bindCardEvents() {
    $$('.copy-mini').forEach(b => b.onclick = async e => {
      e.stopPropagation(); const ok = await copy(b.dataset.url);
      Toast[ok ? 'success' : 'error'](ok ? '已复制' : '复制失败');
    });
    $$('[data-copy]').forEach(b => b.onclick = async e => {
      e.stopPropagation(); const ok = await copy(b.dataset.copy);
      Toast[ok ? 'success' : 'error'](ok ? '已复制' : '复制失败');
    });
    $$('[data-preview]').forEach(img => img.onclick = e => { e.stopPropagation(); this.openLightbox(img.dataset.preview); });
    $$('[data-refresh]').forEach(b => b.onclick = e => { e.stopPropagation(); void poller.refresh(b.dataset.refresh); });
    $$('[data-stop]').forEach(b => b.onclick = e => {
      e.stopPropagation(); poller.stop(b.dataset.stop);
      const now = Date.now(); const t = Store.getTasks().find(x => x.id === b.dataset.stop);
      Store.updateTask(b.dataset.stop, { status: 'stopped', error: '已停止', endTime: now });
      if (t) Store.updateHistory(t.historyId, { status: 'stopped', error: '已停止', endTime: now });
      this.renderResults();
    });
    $$('[data-edit]').forEach(b => b.onclick = e => { e.stopPropagation(); void this.openEditor(b.dataset.edit); });
    $$('[data-ref]').forEach(b => b.onclick = e => { e.stopPropagation(); this.useAsRef(b.dataset.ref, b.dataset.type); });
    $$('[data-regen]').forEach(b => b.onclick = e => { e.stopPropagation(); this.regen(b.dataset.regen); });
    $$('[data-copy-workflow]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const t = Store.getTasks().find(x => x.id === b.dataset.copyWorkflow);
      if (t) Workflow.copy(t);
    });
    $$('[data-del]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      this.confirmDeleteTask(b.dataset.del);
    });
    $$('.card').forEach(card => this.bindLongPress(card));
  },
  bindLongPress(card) {
    if (card.dataset.longpressBound) return;
    card.dataset.longpressBound = '1';
    let timer = null, startX = 0, startY = 0;
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    card.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('button,a,input,textarea,select,video,audio')) return;
      startX = e.clientX; startY = e.clientY;
      timer = setTimeout(() => { this.openCardActions(card.dataset.id); }, 520);
    }, { passive: true });
    card.addEventListener('pointermove', e => {
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 12) cancel();
    }, { passive: true });
    card.addEventListener('pointerup', cancel, { passive: true });
    card.addEventListener('pointercancel', cancel, { passive: true });
    card.addEventListener('contextmenu', e => { e.preventDefault(); this.openCardActions(card.dataset.id); });
  },
  confirmDeleteTask(id) {
    if (!confirm('删除这条任务记录？')) return;
    poller.stop(id); Store.delTask(id); this.renderResults(); Toast.success('已删除');
  },
  openCardActions(id) {
    const t = Store.getTasks().find(x => x.id === id);
    if (!t) return;
    $('#actionSheetTitle').textContent = (t.type === 'image' ? '图片任务' : t.type === 'video' ? '视频任务' : '音频任务') + ' · 操作';
    const actions = [];
    const url = t.resultUrl;
    if (url) {
      actions.push(['复制链接', () => copy(url).then(ok => Toast[ok ? 'success' : 'error'](ok ? '已复制' : '复制失败'))]);
      actions.push(['下载', () => this.downloadResult(url, t.type)]);
    }
    if (url && t.type === 'image') actions.push(['编辑图片', () => this.openEditor(url)]);
    if (url) actions.push(['用作参考', () => this.useAsRef(url, t.type)]);
    if (t.status === 'failed' || t.status === 'timeout' || t.status === 'running') actions.push(['重生成', () => this.regen(id)]);
    actions.push(['复制工作流', () => Workflow.copy(t)]);
    actions.push(['详情', () => this.showDetail(t)]);
    actions.push(['删除', () => this.confirmDeleteTask(id)]);
    const html = actions.map((a, i) => `<button class="act ${a[0] === '删除' ? 'danger' : ''}" data-menu-action="${i}" style="justify-content:flex-start">${esc(a[0])}</button>`).join('') + `<button class="act" data-menu-action="close" style="justify-content:center;margin-top:6px">取消</button>`;
    $('#actionSheetActions').innerHTML = html;
    $$('#actionSheetActions [data-menu-action]').forEach(b => b.onclick = async () => {
      if (b.dataset.menuAction === 'close') { this.closeSheet('actionSheet', 'actionOverlay'); return; }
      this.closeSheet('actionSheet', 'actionOverlay');
      try { await actions[Number(b.dataset.menuAction)][1](); }
      catch (e) { Toast.error(e.message || '操作失败'); }
    });
    this.openSheet('actionSheet', 'actionOverlay');
  },
  async downloadResult(url, type) {
    if (!url) return;
    Toast.info('准备下载…');
    try {
      const r = await Api.request(url, { method: 'GET' }, Math.min(CONFIG.REQUEST_TIMEOUT, 15000));
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const blob = await r.blob();
      const objectUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = `ai-result-${Date.now()}.${type === 'image' ? 'png' : type === 'video' ? 'mp4' : 'mp3'}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      Toast.success('已开始下载');
    } catch {
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.download = '';
      document.body.appendChild(a); a.click(); a.remove();
      Toast.info('已打开结果链接');
    }
  },
  useAsRef(url, type) {
    if (!url) return;
    if (type === 'image') {
      if (this.tab !== 'image') this.switchTab('image');
      const refParam = this.model?.params.find(p => p.type === 'ref-image');
      if (refParam) { this.addUrlRef(refParam.key, url, false); }
      else Toast.warning('当前图片模型不支持参考图');
    } else if (type === 'video') {
      if (this.tab !== 'video') this.switchTab('video');
      const refVideoParam = this.model?.params.find(p => p.type === 'ref-video');
      if (refVideoParam) { this.addUrlRef(refVideoParam.key, url, true); }
      else {
        const p = this.model?.params.find(x => x.type === 'url' && /video_?url/i.test(x.key)) || this.model?.params.find(x => x.type === 'url');
        if (p) {
          const el = this.getParamElement(p.key);
          if (el) { el.value = String(el.value || '').trim() ? String(el.value).trim() + ',' + url : url; el.dispatchEvent(new Event('input', { bubbles: true })); Toast.success('已填入引用链接'); }
        } else Toast.warning('当前模型没有可用的 URL 参数');
      }
    } else {
      if (this.tab !== 'audio') this.switchTab('audio');
      const p = this.model?.params.find(x => x.type === 'url' && /audio_?url/i.test(x.key)) || this.model?.params.find(x => x.type === 'url');
      if (p) {
        const el = this.getParamElement(p.key);
        if (el) { el.value = String(el.value || '').trim() ? String(el.value).trim() + ',' + url : url; el.dispatchEvent(new Event('input', { bubbles: true })); Toast.success('已填入引用链接'); }
      } else Toast.warning('当前模型没有可用的 URL 参数');
    }
    this.switchView('param');
  },
  regen(id) {
    const t = Store.getTasks().find(x => x.id === id);
    if (!t) return;
    this.switchTab(t.tab);
    const m = MODELS[t.tab].find(x => x.id === t.modelId);
    if (m) this.renderForm(m.id);
    Object.entries(t.params || {}).forEach(([k, v]) => {
      const p = this.model?.params.find(x => x.key === k);
      if (!p) return;
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') {
        const urls = Array.isArray(v) ? v : String(v).split(',').map(s => s.trim()).filter(Boolean);
        const isVideo = p.type === 'ref-video';
        this.setRefs(k, urls.map(u => ({ id: 'r_' + genId(), kind: isVideo ? 'url-video' : 'url', src: u, name: isVideo ? 'URL视频' : 'URL', uploaded: true, remote: u, mediaType: isVideo ? 'video' : 'image' })));
        this.refreshRefGrid(k);
      } else {
        const el = this.getParamElement(k);
        if (el) { el.value = Array.isArray(v) ? v.join(',') : v; el.dispatchEvent(new Event('input', { bubbles: true })); }
      }
    });
    this.updateEstimate();
    this.switchView('param');
    Toast.info('已恢复参数');
  },
  updateTimer(id, elapsed, st) {
    const card = $(`.card[data-id="${id}"]`);
    if (!card) return;
    const timer = card.querySelector('.timer');
    if (timer) {
      const phase = poller.getPhase(elapsed)?.name || '';
      const interval = (poller.getPhase(elapsed)?.interval || 3000) / 1000;
      const net = st.netFails > 0 ? ` · 网络失败 ${st.netFails}/${CONFIG.POLL_FAIL_LIMIT}` : '';
      const req = st.requestError === 'REQUEST_TIMEOUT' ? ' · 请求超时，自动重试' : st.requestError === 'NETWORK_OR_CORS' ? ' · 网络异常，自动重试' : '';
      timer.innerHTML = `<span class="dot"></span>${fmtDur(elapsed)} · ${esc(phase)} ${interval}s${net}${req}`;
    }
  },

  /* ===== Lightbox ===== */
  openLightbox(url) {
    if (!url) return;
    const lb = $('#mediaLightbox');
    $('#lightboxImage').src = url;
    $('#lightboxImage').style.display = '';
    $('#lightboxVideo').style.display = 'none';
    $('#lightboxVideo').pause();
    lb.classList.add('show');
    lb.setAttribute('aria-hidden', 'false');
  },
  openVideoLightbox(url) {
    if (!url) return;
    const lb = $('#mediaLightbox');
    const vid = $('#lightboxVideo');
    $('#lightboxImage').style.display = 'none';
    vid.style.display = '';
    vid.src = url;
    lb.classList.add('show');
    lb.setAttribute('aria-hidden', 'false');
    try { vid.play().catch(() => {}); } catch {}
  },
  closeLightbox() {
    const lb = $('#mediaLightbox'); if (!lb) return;
    lb.classList.remove('show');
    lb.setAttribute('aria-hidden', 'true');
    $('#lightboxImage').removeAttribute('src');
    const vid = $('#lightboxVideo');
    try { vid.pause(); vid.removeAttribute('src'); vid.load(); } catch {}
  },

  /* ===== Detail modal ===== */
  showDetail(t) {
    $('#modalTitle').textContent = '任务详情';
    const rows = [
      ['任务ID', t.id],
      ['API ID', t.apiId || '-'],
      ['模型', t.modelName],
      ['类型', typeName(t.type)],
      ['状态', { running: '生成中', success: '成功', failed: '失败', timeout: '超时', stopped: '已停止' }[t.status] || t.status],
      ['创建时间', fmtTime(t.createdAt)],
      ['耗时', t.elapsed ? fmtDur(t.elapsed) : '-'],
      ['结果URL', t.resultUrl || '-'],
      ['错误', t.error || '-']
    ];
    $('#modalBody').innerHTML = rows.map(([k, v]) => `<div class="kv"><div class="kv-k">${esc(k)}</div><div class="kv-v">${esc(v)}</div></div>`).join('');
    $('#modalFooter').innerHTML = `<button class="act" id="modalClose">关闭</button><button class="act primary" id="modalRegen">重生成</button>`;
    $('#modalClose').onclick = () => $('#modal').classList.remove('show');
    $('#modalRegen').onclick = () => { $('#modal').classList.remove('show'); this.regen(t.id); };
    $('#modal').classList.add('show');
  },

  /* ===== Stats ===== */
  showStats() {
    const all = Store.getHistory(); const now = Date.now();
    const ranges = [
      { id: 'today', label: '今天', start: new Date().setHours(0, 0, 0, 0) },
      { id: 'week', label: '本周', start: now - 7 * 86400000 },
      { id: 'month', label: '本月', start: now - 30 * 86400000 },
      { id: 'all', label: '全部', start: 0 }
    ];
    const stats = ranges.map(r => {
      const items = all.filter(h => h.createdAt >= r.start);
      let cost = 0, success = 0, fail = 0;
      const byModel = {};
      items.forEach(h => {
        const m = MODELS[h.tab]?.find(x => x.id === h.modelId);
        if (h.status === 'success') success++; else if (h.status === 'failed' || h.status === 'timeout') fail++;
        const est = m ? calcEstimate(m, h.params || {}) : null;
        if (est?.amount != null) cost += est.amount;
        const mn = h.modelName || '未知';
        if (!byModel[mn]) byModel[mn] = { cost: 0, count: 0 };
        byModel[mn].cost += est?.amount || 0;
        byModel[mn].count++;
      });
      const modelList = Object.entries(byModel).map(([n, d]) => ({ name: n, ...d })).sort((a, b) => b.cost - a.cost);
      return { ...r, cost, total: items.length, success, fail, modelList };
    });
    const fmt = v => v < 1 ? v.toFixed(4) : v.toFixed(2);
    const renderRange = (s) => {
      const maxM = s.modelList[0]?.cost || 0;
      return `<div class="ssum">
        <div class="sc sc-main"><div class="sl">总消费</div><div class="sv">¥${fmt(s.cost)}</div></div>
        <div class="sc"><div class="sl">任务</div><div class="svs">${s.total}</div></div>

  openEnergyPayment() {

      const btn = $('#energyPayBtn'); if (btn) { btn.disabled = true; btn.textContent = '正在打开…'; }

      frame.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-10px;top:-10px';

      $('#modalFooter').innerHTML = `<button class="act" id="modalClose">关闭</button>`;
      $('#modalClose').onclick = () => $('#modal').classList.remove('show');

  },

  /* ===== History ===== */
  showHistory() {
    const arr = Store.getHistory();
    const filterBtns = ['all', 'image', 'video', 'audio'];
    const filterLabels = { all: '全部', image: '图片', video: '视频', audio: '音频' };
    let filtered = arr.filter(h => this.historyFilter === 'all' || h.type === this.historyFilter);
    if (this.historySearch) {
      const q = this.historySearch.toLowerCase();
      filtered = filtered.filter(h => (h.prompt || '').toLowerCase().includes(q) || (h.modelName || '').toLowerCase().includes(q));
    }
    // Day-grouped
    const now = new Date(); const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const yestStart = todayStart - 86400000; const weekStart = todayStart - 7 * 86400000;
    const groups = { 今天: [], 昨天: [], 本周: [], 更早: [] };
    filtered.forEach(h => {
      if (h.createdAt >= todayStart) groups['今天'].push(h);
      else if (h.createdAt >= yestStart) groups['昨天'].push(h);
      else if (h.createdAt >= weekStart) groups['本周'].push(h);
      else groups['更早'].push(h);
    });
    let body = `
      <div class="history-search-row"><input type="search" id="historySearchInput" placeholder="搜索历史…" value="${esc(this.historySearch)}"></div>
      <div class="history-filter-tabs">${filterBtns.map(f => `<button class="srb ${this.historyFilter === f ? 'active' : ''}" data-filter="${f}">${filterLabels[f]}</button>`).join('')}</div>
    `;
    const statusMap = { running: '中', success: '成', failed: '败', timeout: '超', stopped: '停' };
    Object.entries(groups).forEach(([day, items]) => {
      if (items.length === 0) return;
      body += `<div class="history-day-group">${day}（${items.length}）</div>`;
      body += items.map(h => `<div class="history-item" data-hid="${esc(h.id)}">
        <div class="history-thumb">${h.resultUrl && h.type === 'image' ? `<img src="${esc(h.resultUrl)}" loading="lazy">` : h.type === 'video' ? '🎬' : h.type === 'audio' ? '🎵' : '📄'}</div>
        <div class="history-info">
          <div class="hi-top">${esc(h.modelName)} <span class="pill ${h.status}" style="font-size:9px">${statusMap[h.status] || h.status}</span></div>
          <div class="hi-prompt">${esc(trunc(h.prompt || '', 60))}</div>
          <div class="hi-time">${fmtTime(h.createdAt)} <button class="act" data-reuse="${esc(h.id)}">再用</button> <button class="act" data-del-h="${esc(h.id)}">删</button></div>
        </div>
      </div>`).join('');
    });
    if (filtered.length === 0) body += `<div class="preset-empty">暂无历史记录</div>`;
    $('#modalTitle').textContent = `历史记录（${arr.length}）`;
    $('#modalBody').innerHTML = body;
    $('#modalFooter').innerHTML = `<button class="act" id="modalClose">关闭</button><button class="act danger" id="clearHist">清空</button>`;
    $('#modalClose').onclick = () => $('#modal').classList.remove('show');
    $('#clearHist').onclick = () => {
      if (!confirm('确定清空全部历史？')) return;
      Store.clearHistory(); this.showHistory();
    };
    $('#historySearchInput').oninput = e => { this.historySearch = e.target.value; this.showHistory(); $('#historySearchInput').focus(); };
    $$('.srb[data-filter]').forEach(b => b.onclick = () => { this.historyFilter = b.dataset.filter; this.showHistory(); });
    $$('#modalBody [data-hid]').forEach(el => el.onclick = () => {
      const h = Store.getHistory().find(x => x.id === el.dataset.hid);
      if (h) this.showHistoryDetail(h);
    });
    $$('#modalBody [data-reuse]').forEach(b => b.onclick = e => { e.stopPropagation(); const h = Store.getHistory().find(x => x.id === b.dataset.reuse); if (h) this.regen(h.taskId || ''); });
    $$('#modalBody [data-del-h]').forEach(b => b.onclick = e => { e.stopPropagation(); Store.delHistory(b.dataset.delH); this.showHistory(); });
    $('#modal').classList.add('show');
  },
  showHistoryDetail(h) {
    $('#modalTitle').textContent = '历史详情';
    const rows = [
      ['模型', h.modelName],
      ['类型', typeName(h.type)],
      ['状态', { running: '生成中', success: '成功', failed: '失败', timeout: '超时', stopped: '已停止' }[h.status] || h.status],
      ['时间', fmtTime(h.createdAt)],
      ['耗时', h.elapsed ? fmtDur(h.elapsed) : '-'],
