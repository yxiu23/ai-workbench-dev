<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI 工作台 · 手机版</title>
<style>
/* ========== 主题变量 ========== */
:root {
  color-scheme: dark;
  /* 修复/优化：统一卡片圆角与触控按压反馈，避免各组件视觉不一致。 */
  --brand: #3b6ef5;
  --brand-soft: rgba(59,110,245,.12);
  --danger: #e5484d;
  --success: #16a34a;
  --warning: #f59e0b;
  --transition: 200ms cubic-bezier(.4,0,.2,1);
  --card-radius: 12px;
  --touch-scale: .985;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tabbar-core-h: 48px;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0e18; --bg-elev: #111726; --surface: #1a2030; --surface-2: #232a3d;
  --border: rgba(148,163,209,.1); --text: #e9edf8; --text-muted: #9aa5c0; --text-dim: #5f6b8a;
  --overlay: rgba(0,0,0,.6);
  --bg-grad: radial-gradient(600px 400px at 80% -10%, rgba(59,110,245,.08), transparent 60%);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7fb; --bg-elev: #ffffff; --surface: #ffffff; --surface-2: #f0f2f8;
  --border: #e3e6ee; --text: #1c1f26; --text-muted: #5a6172; --text-dim: #8b91a0;
  --overlay: rgba(0,0,0,.4);
  --bg-grad: radial-gradient(600px 400px at 80% -10%, rgba(59,110,245,.05), transparent 60%);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
html[data-theme] .header, html[data-theme] .content, html[data-theme] .tabbar, html[data-theme] .card, html[data-theme] input, html[data-theme] textarea, html[data-theme] select, html[data-theme] .sheet, html[data-theme] .modal-content, html[data-theme] .editor, html[data-theme] .model-btn, html[data-theme] .model-item { transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease, box-shadow 180ms ease; }

body {
  font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  background: var(--bg-grad), var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; padding-top: var(--safe-top);
  transition: background-color 280ms ease, color 280ms ease;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
input, textarea, select {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; outline: none; width: 100%; -webkit-appearance: none; font-size: 15px;
  transition: border-color var(--transition);
}
input:focus, textarea:focus { border-color: var(--brand); }
button, .act, .tab, .model-item, .ref-add { transition: transform var(--transition), background-color var(--transition), border-color var(--transition), color var(--transition), opacity var(--transition); }
button:active, .act:active, .tab:active, .model-item:active, .ref-add:active { transform: scale(var(--touch-scale)); }
textarea { resize: none; min-height: 80px; }
select { background-image: none; }
::-webkit-scrollbar { width: 0; height: 0; }
::selection { background: var(--brand-soft); }

/* ========== 生成 / 结果切换 ========== */
.view-switcher { display:none; }
.workspace-switch {
  width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  color: var(--text-muted); background: var(--surface);
}
.workspace-switch svg { width: 17px; height: 17px; }
.workspace-switch:active { transform: translate(-50%, -50%) scale(var(--touch-scale)); }
.workspace-switch.result-mode { color: var(--brand); border-color: var(--brand-soft); background: var(--brand-soft); }
.workspace-switch .view-result-badge {
  position:absolute; top:-5px; right:-5px; min-width:15px; height:15px; padding:0 3px; border-radius:999px;
  display:inline-flex; align-items:center; justify-content:center; background:var(--brand-soft); color:var(--brand);
  font-size:8px; font-weight:700; border:2px solid var(--bg-elev);
}
/* ========== Header ========== */
.header {
  height: 44px; display: flex; align-items: center; justify-content: space-between; position: relative;
  padding: 0 16px; background: var(--bg-elev); border-bottom: 1px solid var(--border); z-index: 30;
}
.header-title { font-size: 16px; font-weight: 600; }
.header-btn {
  width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); transition: all var(--transition);
}
.header-btn:active { background: var(--surface-2); }
.header-btn svg { width: 20px; height: 20px; }

/* ========== 内容区 ========== */
.content {
  height: calc(100svh - 44px - 42px - var(--tabbar-core-h) - var(--safe-bottom));
  height: calc(100dvh - 44px - 42px - var(--tabbar-core-h) - var(--safe-bottom));
  overflow: hidden; position: relative;
}
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; padding: 12px 12px 20px; opacity: 0; transform: translateY(6px); pointer-events: none; }
.view.active { display: block; animation: viewIn 220ms ease both; pointer-events: auto; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ========== 参数视图 ========== */
.section { margin-bottom: 16px; }
.section-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.preset-row { display: flex; gap: 6px; margin-bottom: 8px; }
.preset-select {
  flex: 1; font-size: 12px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text-muted);
}
.preset-save {
  width: 32px; height: 32px; border-radius: 8px; background: var(--brand-soft); color: var(--brand);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.model-btn {
  width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 14px;
}
.model-btn:active { background: var(--surface-2); }
.model-btn svg { width: 16px; height: 16px; color: var(--text-dim); }
.model-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
.tag.price { background: rgba(22,163,74,.1); color: var(--success); }
.tag.async { background: var(--brand-soft); color: var(--brand); }
.tag.sync { background: rgba(245,158,11,.1); color: var(--warning); }

/* 表单 */
.form-group { margin-bottom: 14px; }
.form-group label { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 13px; font-weight: 500; }
.form-group .req { color: var(--danger); font-size: 11px; }
.form-group .opt { color: var(--text-dim); font-size: 11px; font-weight: 400; }
.form-group .hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.form-group.error input, .form-group.error textarea { border-color: var(--danger); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type=range] {
  flex: 1; appearance: none; -webkit-appearance: none; height: 6px;
  background: var(--surface-2); border-radius: 3px; padding: 0; border: none;
}
.range-row input[type=range]::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none; width: 28px; height: 28px;
  border-radius: 50%; background: var(--brand);
}
.range-value { font-family: monospace; font-size: 13px; font-weight: 600; color: var(--brand); min-width: 40px; text-align: right; }

/* 参考图 */
.ref-wrap { margin-top: 8px; }
.ref-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.ref-item { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); }
.ref-item img { width: 100%; height: 100%; object-fit: cover; }
.ref-badge { position: absolute; top: 4px; left: 4px; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
.ref-badge.local { color: #fcd34d; background: rgba(251,191,36,.2); }
.ref-badge.uploaded { color: #6ee7b7; background: rgba(52,211,153,.16); }
.ref-del { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 5px; background: rgba(0,0,0,.6); color: #fca5a5; font-size: 12px; display: grid; place-items: center; }
.ref-add { aspect-ratio: 1; width: 100%; border: 2px dashed var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--brand); background: var(--brand-soft); }
.ref-add svg { width: 24px; height: 24px; }
.ref-empty { grid-column: 1/-1; text-align: center; padding: 16px; font-size: 12px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 10px; }
/* 参考视频卡片（16:9） */
.ref-grid-video { grid-template-columns: repeat(2,1fr); }
.ref-item-video { aspect-ratio: 16/9; }
.ref-item-video video { width: 100%; height: 100%; object-fit: cover; background: #000; }
.ref-meta-overlay { position: absolute; bottom: 4px; left: 4px; font-size: 9px; font-family: monospace; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.7); color: #fff; }
.ref-play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; font-size: 11px; pointer-events: none; }
.ref-badge.local-video { color: #fca5a5; background: rgba(239,68,68,.16); }
.ref-badge.url-video { color: #c4b5fd; background: rgba(139,92,246,.16); }
.ref-video-warn { margin-top: 6px; padding: 6px 8px; background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.3); border-radius: 6px; font-size: 10px; color: var(--warning); display: none; }
.ref-video-warn.show { display: block; }
.ref-progress { display: none; align-items: center; gap: 6px; margin-top: 6px; padding: 6px 10px; background: var(--brand-soft); border-radius: 8px; font-size: 12px; color: var(--brand); }
.ref-progress.show { display: flex; }
.ref-progress .ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--brand); border-top-color: transparent; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 生成按钮 */
.estimate { text-align: center; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.estimate .val { color: var(--success); font-weight: 600; font-family: monospace; }
.gen-btn {
  width: 100%; padding: 14px; background: var(--brand); color: white; border-radius: 12px;
  font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all var(--transition); position: sticky; bottom: 0; z-index: 10;
}
.gen-btn:active { transform: scale(.98); }
.gen-btn:disabled { opacity: .5; }

/* ========== 结果视图 ========== */
.result-list { display: flex; flex-direction: column; gap: 12px; }
.empty { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; text-align: center; color: var(--text-dim); }
.empty svg { width: 56px; height: 56px; opacity: .4; margin-bottom: 12px; }
.empty h3 { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
.empty p { font-size: 12px; }

/* 任务卡 */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius); overflow: hidden; }
.card.pressable { user-select: none; -webkit-user-select: none; }
.card-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.card-model { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 500; flex-shrink: 0; }
.pill.running { background: var(--brand-soft); color: var(--brand); }
.pill.success { background: rgba(22,163,74,.12); color: var(--success); }
.pill.failed { background: rgba(229,72,77,.12); color: var(--danger); }
.pill.timeout { background: rgba(245,158,11,.12); color: var(--warning); }
.card-prompt { padding: 8px 12px; font-size: 11px; color: var(--text-muted); background: var(--surface-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-body { padding: 10px 12px; }
.task-id { font-family: monospace; font-size: 10px; color: var(--text-dim); background: var(--surface-2); padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
.task-id .copy { padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 9px; color: var(--brand); }
.bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; position: relative; }
.skeleton { position: relative; overflow: hidden; border-radius: 10px; background: var(--surface-2); }
.skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); animation: shimmer 1.3s infinite; }
.skeleton-media { height: 180px; margin-bottom: 8px; }
@keyframes shimmer { to { transform: translateX(100%); } }
.bar::after { content: ""; position: absolute; left: -40%; top: 0; height: 100%; width: 40%; background: var(--brand); animation: ind 1.4s infinite ease-in-out; }
@keyframes ind { 0% { left: -40%; } 100% { left: 100%; } }
.timer { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
.timer .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.poll-actions { display: flex; gap: 6px; margin-top: 8px; }
.poll-actions .act { flex: 1; }

/* 结果展示 */
.media { width: 100%; border-radius: 10px; background: var(--surface-2); overflow: hidden; margin-bottom: 8px; display: flex; justify-content: center; }
.media img, .media video { max-width: 100%; max-height: 300px; display: block; }
.media img { cursor: zoom-in; }
.media audio { width: 100%; padding: 12px; }
.url-row { display: flex; gap: 4px; align-items: center; background: var(--surface-2); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-family: monospace; color: var(--text-muted); word-break: break-all; }
.url-row .copy { flex-shrink: 0; padding: 3px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; color: var(--brand); }
.actions { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.act {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; padding: 8px 10px; font-size: 11px;
  background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); border-radius: 8px;
  transition: all var(--transition);
}
.act:active { background: var(--brand-soft); }
.act svg { width: 16px; height: 16px; }
.act.danger { color: var(--danger); }
.err-banner { background: rgba(229,72,77,.1); color: var(--danger); padding: 8px 10px; border-radius: 8px; font-size: 11px; margin-bottom: 8px; }

/* ========== 底部 Tab：按屏幕高度自适应 ========== */
.tabbar {
  position: fixed; bottom: var(--safe-bottom); left: 0; right: 0;
  height: var(--tabbar-core-h); padding-bottom: 0; box-sizing: border-box;
  background: var(--bg-elev); border-top: 1px solid var(--border);
  display: flex; z-index: 20;
}
.tabbar::after {
  content: ""; position: absolute; top: 100%; left: 0; right: 0; height: var(--safe-bottom);
  background: var(--bg-elev); border-top: 0; pointer-events: none;
}
@media (display-mode: standalone), (display-mode: fullscreen) {
  :root { --tabbar-core-h: 48px; }
  .tab { font-size: 10px; }
  .tab svg { width: 20px; height: 20px; }
}
.tab {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  color: var(--text-dim); font-size: 10px; line-height: 1; position: relative; transition: color var(--transition);
}
.tab svg { width: clamp(19px, 3.2vw, 21px); height: clamp(19px, 3.2vw, 21px); }
.tab.active { color: var(--brand); }
.tab.active::before { content: ""; position: absolute; top: 0; width: 22px; height: 2px; background: var(--brand); border-radius: 0 0 3px 3px; }

/* ========== Sheet ========== */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 90; opacity: 0; pointer-events: none; transition: opacity var(--transition); }
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-elev); border-radius: 16px 16px 0 0;
  max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 100;
  transform: translateY(100%); transition: transform 280ms cubic-bezier(.4,0,.2,1); padding: 20px 16px calc(20px + var(--safe-bottom));
}
.sheet.show { transform: translateY(0); }
.sheet.dragging { transition: none; }
.handle { width: 36px; height: 4px; background: var(--text-dim); border-radius: 2px; margin: 0 auto 16px; opacity: .5; }
.sheet h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; }
.sheet-group { margin-bottom: 16px; }
.sheet-group > label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.sheet-actions .act { flex: 1; min-width: 72px; justify-content: center; padding: 12px; font-size: 12px; }
.settings-sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.settings-sheet-header h3 { margin: 0; font-size: 15px; }
.sheet-close-btn { background: none; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1; }
.sheet-close-btn:hover { background: var(--surface-2); color: var(--text); }
.settings-sheet-body { padding: 0 4px; }
.settings-section { margin-bottom: 18px; }
.settings-section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-soft); }
.settings-row-list { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; }
.settings-row-list .act { justify-content: center; padding: 10px; font-size: 13px; }
.settings-about { font-size: 12px; color: var(--text-dim); text-align: center; padding: 8px 0; }
.input-row { display: flex; gap: 6px; }
.input-row input { flex: 1; }
.input-row .act { padding: 0 12px; font-size: 12px; }

/* 模型选择器 */
.model-list { display: flex; flex-direction: column; gap: 8px; }
.model-item { padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; transition: all var(--transition); }
.model-item:active { background: var(--surface-2); }
.model-item.selected { border-color: var(--brand); background: var(--brand-soft); }
.model-item-name { font-size: 14px; font-weight: 600; }
.model-item-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.model-item-price { font-size: 12px; color: var(--success); font-weight: 600; margin-top: 4px; }

/* ========== 结果长按操作 / 图片预览 ========== */
.media-lightbox { position: fixed; inset: 0; z-index: 260; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.9); }
.media-lightbox.show { display: flex; animation: fadeIn 160ms ease-out; }
.media-lightbox img { max-width: 100%; max-height: 88vh; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 50px rgba(0,0,0,.4); }
.media-lightbox .lightbox-close { position: absolute; top: calc(12px + var(--safe-top)); right: 12px; width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.12); color: #fff; font-size: 24px; }
.action-sheet .sheet-actions .act { flex: 1 1 calc(50% - 4px); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ========== Toast ========== */
.toasts { position: fixed; top: 48px; right: 8px; left: 8px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
.toast {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--text-dim);
  border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  font-size: 12px; display: flex; gap: 8px; animation: tin 280ms ease-out;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
.toast.info { border-left-color: var(--brand); }
.toast .msg { flex: 1; word-break: break-word; }
.toast .ta { display: flex; gap: 4px; }
.toast .tbtn { padding: 2px 8px; font-size: 11px; border-radius: 4px; background: var(--surface-2); color: var(--brand); border: 1px solid var(--border); }
@keyframes tin { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ========== 编辑器 ========== */
.editor { position: fixed; inset: 0; background: var(--bg-elev); z-index: 150; display: none; flex-direction: column; padding-top: var(--safe-top); }
.editor.show { display: flex; }
.editor-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--border); height: 44px; flex-shrink: 0; }
.editor-header h3 { font-size: 15px; margin: 0; }
.editor-body { flex: 1; overflow-y: auto; padding: 12px; }
.editor-tools { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px; background: var(--surface-2); border-radius: 10px; margin-bottom: 8px; }
.tg { display: flex; align-items: center; gap: 3px; padding-right: 6px; border-right: 1px solid var(--border); }
.tg:last-child { border-right: none; }
.tb { padding: 6px 8px; font-size: 11px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
.tb.active { background: var(--brand); color: white; border-color: var(--brand); }
.sb { padding: 4px 6px; font-size: 10px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
.sb.active { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.cb { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; }
.cb.active { border-color: var(--text); transform: scale(1.1); }
.or { width: 60px; appearance: none; -webkit-appearance: none; height: 4px; background: var(--surface); border-radius: 2px; padding: 0; border: none; }
.or::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--brand); }
.dc { font-size: 11px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 2px; }
.dc input { width: auto; margin: 0; }
.op-ctrl { display: none; padding: 10px; background: var(--brand-soft); border-radius: 10px; margin-bottom: 8px; gap: 10px; flex-direction: column; align-items: stretch; }
.op-row { display:flex; align-items:center; gap:10px; justify-content:space-between; }
.op-label { font-size:11px; color:var(--text-muted); min-width:58px; }
.op-label span { color:var(--brand); font-family:monospace; margin-left:4px; }
.dir-grid { display:grid; grid-template-columns:repeat(2,42px); gap:6px; }
.dir-btn { width:42px; height:38px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text-muted); font-size:20px; line-height:1; touch-action:manipulation; }
.dir-btn.active { background:var(--brand); border-color:var(--brand); color:#fff; }
.op-segment { display:flex; gap:6px; flex:1; }
.op-segment .sb { flex:1; min-height:34px; padding:6px 8px; font-size:12px; }
.feather-touch { flex:1; width:100%; min-width:0; height:6px; }
.op-apply { min-height:42px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-weight:700; font-size:13px; touch-action:manipulation; }
.canvas-wrap { position: relative; background: var(--surface-2); border-radius: 10px; overflow: auto; max-height: 52vh; display: flex; justify-content: center; align-items: center; min-height: 220px; padding: 8px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.canvas-stack { position: relative; display: inline-block; }
#bgCanvas, #maskCanvas { display: block; max-width: 100%; max-height: 52vh; }
#bgCanvas { position: relative; z-index: 1; }
#maskCanvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; touch-action: none; -webkit-user-select: none; user-select: none; }
.canvas-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 12px; pointer-events: none; }
.canvas-hint.hide { display: none; }
.editor-prompt { min-height: 50px; font-size: 13px; }

/* ========== Modal ========== */
.modal { position: fixed; inset: 0; background: var(--overlay); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal.show { display: flex; }
.modal-content { box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal-content { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; padding: 20px; max-width: 100%; width: 100%; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-header h3 { font-size: 15px; }
.modal-body { font-size: 13px; }
.modal-body pre { background: var(--surface-2); padding: 8px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 11px; margin: 6px 0; }
.modal-body .kv { display: flex; padding: 5px 0; border-bottom: 1px solid var(--border); gap: 10px; }
.modal-body .kv-k { width: 80px; color: var(--text-muted); flex-shrink: 0; font-size: 11px; }
.modal-body .kv-v { flex: 1; word-break: break-all; font-family: monospace; font-size: 11px; }
.modal-footer { display: flex; gap: 8px; margin-top: 16px; }
.modal-footer .act { flex: 1; justify-content: center; padding: 10px; }
.pi { width: 100%; padding: 10px; font-size: 14px; margin: 8px 0; }

/* 统计 */
.stabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.srb { padding: 5px 12px; font-size: 11px; border-radius: 999px; color: var(--text-muted); background: var(--surface-2); }
.srb.active { background: var(--brand); color: white; }
.ssum { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.sc { background: var(--surface-2); border-radius: 8px; padding: 10px; text-align: center; }
.sc-main { background: var(--brand-soft); grid-column: 1/-1; text-align: left; }
.sl { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
.sv { font-size: 18px; font-weight: 700; color: var(--brand); font-family: monospace; }
.svs { font-size: 15px; font-weight: 600; font-family: monospace; }
.ssec { margin-bottom: 14px; }
.sst { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.sbr { display: grid; grid-template-columns: 80px 1fr 60px; gap: 8px; align-items: center; margin-bottom: 6px; }
.sbl { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbb { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.sbf { height: 100%; background: var(--brand); border-radius: 3px; }
.sbc { font-size: 11px; font-family: monospace; color: var(--success); text-align: right; }

/* ========== V8 移动端工作流优化 ========== */
.prompt-tools{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.prompt-tools button{padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text-muted);font-size:11px}
.prompt-tools .prompt-count{margin-left:auto;font-size:10px;color:var(--text-dim);font-family:monospace}
.ref-status-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--surface-2);font-size:10px;color:var(--text-muted)}
.ref-status-bar .ready{color:var(--success)} .ref-status-bar .pending{color:var(--warning)}
.task-dock{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;margin:-2px 0 10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px)}
.task-dock b{color:var(--brand)}
.task-dock button{padding:5px 8px;border-radius:7px;background:var(--brand-soft);color:var(--brand);font-size:10px}
.quick-action-row{display:flex;gap:5px;overflow:auto;margin-bottom:8px}.quick-action-row .act{padding:6px 8px;font-size:10px}
.energy-mobile-card{display:flex;align-items:center;gap:10px;padding:12px;margin-top:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.energy-mobile-card .ei{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--brand-soft)}
.energy-mobile-card .ec{flex:1;min-width:0}.energy-mobile-card .et{font-weight:700;font-size:13px}.energy-mobile-card .es{font-size:10px;color:var(--text-dim);margin-top:2px}
.energy-mobile-card .ep{padding:8px 11px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;font-weight:600}
.mobile-pay-qr{text-align:center;padding:8px 4px 4px}.mobile-pay-qr img{display:block;width:min(72vw,280px);height:auto;max-height:58vh;object-fit:contain;margin:0 auto 10px;background:#fff;border-radius:12px;padding:8px;box-sizing:border-box}.mobile-pay-qr>div:not(.pay-note){font-size:12px;font-weight:600;color:var(--text)}.mobile-pay-qr .pay-note{font-size:10px;line-height:1.6;color:var(--text-dim);margin-top:5px}..editor-quickdirs{display:flex;gap:4px;align-items:center;margin:6px 0;flex-wrap:wrap}.editor-quickdirs button{width:30px;height:28px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--text-muted);font-size:12px}.editor-quickdirs button:active{transform:scale(.95)}
.mask-preview-row{display:flex;align-items:center;justify-content:space-between;margin:6px 0;padding:6px 8px;background:var(--surface-2);border-radius:8px;font-size:11px;color:var(--text-muted)}
@supports not (background:color-mix(in srgb,white,black)){.task-dock{background:var(--surface)}}


/* API-driven layout v8: controls are mapped 1:1 to the selected endpoint. */
.api-section{margin:12px 0;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.api-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--text-muted)}
.api-section-hint{font-size:10px;color:var(--text-dim);font-weight:400;text-align:right}
.api-mode-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.api-mode-btn{padding:8px 6px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);color:var(--text-muted);font-size:11px;cursor:pointer}
.api-mode-btn.active{border-color:var(--brand-1, var(--brand));background:var(--brand-soft);color:var(--brand-1, var(--brand));font-weight:600}
.api-mode-panel{display:none}.api-mode-panel.active{display:block}
.api-field-note{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.45}
.api-readonly-note{padding:8px 10px;border-radius:8px;background:rgba(245,158,11,.08);color:var(--warning);font-size:11px;line-height:1.5}
@media(max-width:760px){.api-section{padding:10px}.api-mode-row{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* v8.1 interaction/theme polish */
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
html[data-theme] .header, html[data-theme] .content, html[data-theme] .tabbar, html[data-theme] .card, html[data-theme] .sheet, html[data-theme] .modal-content { transition: background-color .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
.ref-copy-url{position:absolute;right:32px;top:5px;height:22px;padding:0 7px;border-radius:6px;border:1px solid rgba(148,163,209,.3);background:rgba(0,0,0,.62);color:#fff;font-size:10px;line-height:20px;cursor:pointer}.ref-copy-url:hover{background:var(--brand);border-color:var(--brand)}
</style>

/* ============================================================
   API Schema 严格校验层
   关键修改：统一在最终提交前按速创文档校验字段、枚举、数量上限、互斥关系与条件参数。
   这样手机端/电脑端不会因为 UI 差异发送不同格式的请求。
   ============================================================ */
function normalizeAndValidateApiBody(model, input) {
  const body = { ...(input || {}) };
  const errors = [];
  const has = k => body[k] !== undefined && body[k] !== null && String(body[k]).trim() !== '';
  const add = msg => { if (msg && !errors.includes(msg)) errors.push(msg); };
  const validUrl = v => /^https?:\/\/\S+$/i.test(String(v || '').trim()) && String(v || '').trim().length < 4000;
  const checkUrlArray = (key, label, max) => {
    if (!Array.isArray(body[key])) return;
    const arr = body[key].map(v => String(v || '').trim()).filter(Boolean);
    if (arr.some(u => !validUrl(u))) add(`${label}包含无效 URL`);
    if (max != null && arr.length > max) add(`${label}最多 ${max} 个`);
    body[key] = arr;
  };
  const splitCsv = v => String(v || '').split(',').map(s => s.trim()).filter(Boolean);
  const checkCsv = (key, label, max) => {
    if (!has(key)) return;
    const arr = splitCsv(body[key]);
    if (arr.some(u => !validUrl(u))) add(`${label}包含无效 URL`);
    if (max != null && arr.length > max) add(`${label}最多 ${max} 个`);
    body[key] = arr.join(',');
  };
  const checkUrl = (key, label) => { if (has(key) && !validUrl(body[key])) add(`${label}需要以 http:// 或 https:// 开头`); };
  const checkIntRange = (key, label, min, max) => {
    if (!has(key)) return;
    const n = Number(body[key]);
    if (!Number.isInteger(n) || n < min || n > max) add(`${label}应为 ${min}～${max} 的整数`);
    else body[key] = String(n);
  };
  const checkEnum = (key, label, values) => {
    if (!has(key)) return;
    const v = String(body[key]);
    if (!values.includes(v)) add(`${label}取值无效`);
    else body[key] = v;
  };

  switch (model?.id) {
    case 'nanoBanana2':
    case 'nanoBanana_pro':
    case 'nanoBanana2Lite':
      checkEnum('size', '分辨率', model.id === 'nanoBanana2Lite' ? ['1K'] : ['1K','2K','4K']);
      checkEnum('aspectRatio', '比例', ['auto','1:1','16:9','9:16','4:3','3:4','3:2','2:3','5:4','4:5','21:9','1:4','1:8','4:1','8:1']);
      checkUrlArray('urls', '参考图', model.id === 'nanoBanana2' || model.id === 'nanoBanana_pro' ? 14 : null);
      break;
    case 'gpt-image-2':
      checkEnum('size', '比例', ['auto','1:1','3:2','2:3','16:9','9:16','4:3','3:4','21:9','9:21','1:3','3:1','2:1','1:2']);
      break;

    case 'wan3':
      checkEnum('ratio', '宽高比', ['16:9','9:16']);
      checkIntRange('duration', '时长', 4, 30);
      checkEnum('generate_audio', '生成音频', ['true','false']);
      checkUrl('first_frame','首帧图 URL'); checkUrl('last_frame','尾帧图 URL');
      checkCsv('images','参考图片',10); checkCsv('videos','参考视频',5); checkCsv('audios','参考音频',5);
      if (has('last_frame') && !has('first_frame')) add('尾帧需要搭配首帧');

async function copy(text) {
  if (!text) return false;
  try {
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(String(text)); return true; }
  } catch {}
  try {
    const ta = document.createElement('textarea'); ta.value = String(text); ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}

function calcEstimate(model, body) {
  if (!model.billing) return null;
  const b = model.billing;
  if (b.type === 'perImage') return { amount: b.unit, label: `${b.unit} 元/张` };
  if (b.type === 'perSecond') {
    if (b.durationKey && body[b.durationKey]) { const d = Number(body[b.durationKey]); return { amount: d*b.unit, label: `${d}s × ${b.unit}` }; }
    return { amount: null, label: b.note || '按时长' };
  }
  if (b.type === 'perChar') { const len = (body[b.charKey]||'').length; return { amount: len*b.unit, label: `${len}字 × ${b.unit}` }; }
  if (b.type === 'perCall') return { amount: b.unit, label: `${b.unit} 元/次` };
  return null;
}

function classifyErr(msg) {
  const raw = String(msg || '');
  const m = raw.toLowerCase();
  if (/no_api_key|密钥|key|auth|401/.test(m)) return { category:'认证', hint: 'API 密钥无效或未填写', action: '检查设置' };
  if (/429|rate_limited|too many|频繁|限流/.test(m)) return { category:'限流', hint: '请求过于频繁，系统会自动退避，请稍后重试', action: '稍后重试' };
  if (/invalid_json|不是有效 json|返回.*json/.test(m)) return { category:'服务', hint: '服务返回格式异常，请稍后重试', action: '重试' };
  if (/余额|balance|quota|次数|limit/.test(m)) return { category:'额度', hint: '账户余额、点数或调用额度可能不足', action: '检查速创账户' };
  if (/参数|param|422|400/.test(m)) return { category:'参数', hint: '请检查必填项、URL 格式和模型参数范围', action: '回到参数页' };
  if (/timeout|超时|abort/.test(m)) return { category:'超时', hint: '网络响应时间过长，可稍后重试', action: '重试' };
  if (/网络|fetch|cors|network/.test(m)) return { category:'网络', hint: '网络异常或浏览器跨域限制', action: '检查网络' };
  return { category:'服务', hint: raw || '未知错误', action: '重试' };
}

const Toast = {
  show(msg, type = 'info', opts = {}) {
    const { duration = 3500, actions = [] } = opts;
    const root = $('#toasts'); if (!root) return;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const actionsHtml = actions.length ? `<div class="ta">${actions.map((a,i) => `<button class="tbtn" data-action-index="${i}">${esc(a.label || '操作')}</button>`).join('')}</div>` : '';
    el.innerHTML = `<div class="msg">${esc(msg)}</div>${actionsHtml}<button class="tbtn toast-close" style="font-size:14px;line-height:1" aria-label="关闭">×</button>`;
    root.appendChild(el);
    let closed = false;
    const close = () => { if (closed) return; closed = true; el.style.animation = 'tin 160ms reverse'; setTimeout(() => el.remove(), 170); };
    el.querySelector('.toast-close')?.addEventListener('click', close);
    el.querySelectorAll('[data-action-index]').forEach(b => b.addEventListener('click', async () => {
      const a = actions[Number(b.dataset.actionIndex)];
      try { const result = a?.onClick?.(); if (result?.then) await result; } catch (e) { console.error(e); }
      close();
    }));
    if (duration > 0) setTimeout(close, duration);
  },
  success(m, o) { this.show(m, 'success', o); },
  error(m, o) { this.show(m, 'error', { duration: 5000, ...o }); },
  warning(m, o) { this.show(m, 'warning', o); },
  info(m, o) { this.show(m, 'info', o); }
};

function strictNumber(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function strictArr(v){
  if (Array.isArray(v)) return v.filter(Boolean);
  if (typeof v === 'string') return v.split(',').map(s=>s.trim()).filter(Boolean);
  return [];
}
function strictValidateRequest(model, body){
  // 唯一最终入口：先执行模型细则，再执行 Schema 元数据兜底。
  const out = normalizeAndValidateApiBody(model, body);
  const b = out?.body || { ...(body || {}) };
  const errors = Array.isArray(out?.errors) ? [...out.errors] : [];
  const add = msg => { if (msg && !errors.includes(msg)) errors.push(msg); };
  const schema = API_SCHEMA?.[model?.id];
  const has = k => b[k] !== undefined && b[k] !== null && String(b[k]).trim() !== '';
  if (schema?.prompt && !has(schema.prompt)) add('提示词不能为空');
  if (schema?.text && !has(schema.text)) add('文本不能为空');
  if (Array.isArray(schema?.required)) {
    schema.required.forEach(k => { if (!has(k)) add(`${k}不能为空`); });
  }
  if (schema?.fixedDuration != null) b.duration = String(schema.fixedDuration);
  return { body:b, errors };
}

/* API 响应统一解析：兼容文档中的 data:string 与实际示例中的 data:object。 */
function normalizeApiResponse(payload) {
  if (!payload || typeof payload !== 'object') return payload;
  if (typeof payload.data === 'string') {
    const raw = payload.data.trim();
    if (raw && (raw.startsWith('{') || raw.startsWith('['))) {
      try { payload = { ...payload, data: JSON.parse(raw) }; } catch { /* 保留原字符串，交由调用方处理 */ }
    }
  }
  return payload;
}

const Api = {
  async request(url, options = {}, timeout = CONFIG.REQUEST_TIMEOUT) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try { return await fetch(url, { ...options, signal: controller.signal }); }
    catch (e) {
      if (e?.name === 'AbortError') throw new Error('REQUEST_TIMEOUT');
      throw new Error('NETWORK_OR_CORS');
    }
    finally { clearTimeout(timer); }
  },
  async parseJson(r) {
    try { return await r.json(); } catch { throw new Error('INVALID_JSON'); }
  },
  async submit(endpoint, body) {
    const key = Store.getApiKey(); if (!key) throw new Error('NO_API_KEY');
    const r = await this.request(CONFIG.API_BASE + endpoint, { method:'POST', headers:{ Authorization:key, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return normalizeApiResponse(await this.parseJson(r));
  },
  async syncCall(endpoint, body) {
    const key=Store.getApiKey(); if(!key) throw new Error('NO_API_KEY');
    const r=await this.request(CONFIG.API_BASE+endpoint,{method:'POST',headers:{Authorization:key,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(`HTTP_${r.status}`);
    const payload=normalizeApiResponse(await this.parseJson(r));
    if(payload?.code!=null && Number(payload.code)!==200){ const err=new Error(`API_${payload.code}:${payload.msg||''}`); err.apiCode=Number(payload.code); err.apiMsg=payload.msg||''; throw err; }
    return payload;
  },
  async queryDetail(id) {
    const key = Store.getApiKey(); if (!key) throw new Error('NO_API_KEY');
    const r = await this.request(`${CONFIG.API_BASE}${CONFIG.DETAIL_PATH}?id=${encodeURIComponent(id)}`, { headers:{ Authorization:key, 'Content-Type':'application/json' }, cache:'no-store' });
    if (r.status === 429) { const e = new Error('RATE_LIMITED'); e.retryAfter = parseInt(r.headers.get('Retry-After')||'0',10)||0; throw e; }
    if (!r.ok) throw new Error(`QUERY_HTTP_${r.status}`);
    const j = await this.parseJson(r);
    if (j?.code != null && Number(j.code) !== 200) throw new Error(`QUERY_API_${j.code}:${j.msg||''}`);
    if (typeof j?.data === 'string') { try { j.data = JSON.parse(j.data); } catch {} }
    return j;
  },
  extractUrl(d) {
    if (!d) return null;
    const data = typeof d.data === 'string' ? (() => { try { return JSON.parse(d.data); } catch { return d.data; } })() : d.data;
    const isUrl = s => typeof s === 'string' && /^https?:\/\/\S+/i.test(s) && s.length < 4000;
    const keys = ['url','video_url','image_url','audio_url','result','result_url','demo_audio','file_url','download_url','output_url','video','image','audio','media_url'];
    for (const k of keys) { if (isUrl(data?.[k])) return data[k]; if (Array.isArray(data?.[k])) { const u = data[k].find(isUrl); if (u) return u; } }
    if (isUrl(data)) return data;
    return this._deepFind(data);
  },
  _deepFind(obj, d=0) {
    if (!obj || d > 8) return null;
    const isUrl = s => typeof s === 'string' && /^https?:\/\/\S+/i.test(s) && s.length < 4000;
    if (typeof obj === 'string') return isUrl(obj) ? obj : null;
    if (Array.isArray(obj)) { for (const it of obj) { const u=this._deepFind(it,d+1); if(u) return u; } return null; }
    if (typeof obj === 'object') { for (const [k,v] of Object.entries(obj)) { if (/url|file|output|result|media|video|image|audio/i.test(k) && isUrl(v)) return v; const u=this._deepFind(v,d+1); if(u) return u; } }
    return null;
  },
  async uploadToR2(file, onProgress, retry = 0) {
    if (!CONFIG.R2.WORKER_URL) throw new Error('R2 未配置：请打开设置 → 填写 R2 网址');
    let workerUrl = CONFIG.R2.WORKER_URL.trim().replace(/\/+$/, '');
    if (!/^https:\/\//i.test(workerUrl)) {
      throw new Error('R2 网址必须以 https:// 开头');
    }
    // token 走 URL query，避免触发 CORS 预检（file:// 协议兼容）
    if (CONFIG.R2.AUTH_TOKEN) {
      const sep = workerUrl.includes('?') ? '&' : '?';
      workerUrl = workerUrl + sep + 'token=' + encodeURIComponent(CONFIG.R2.AUTH_TOKEN);
    }
    const fileName = file.name || `file-${Date.now()}`;
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', workerUrl);
      // 用 FormData 提交：multipart/form-data 是简单类型，不触发预检
      const formData = new FormData();
      formData.append('file', file, fileName);
      formData.append('name', fileName);
      xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
      xhr.onload = () => {
        let data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 200 && data && data.url) resolve(data.url);
        else if (xhr.status === 403) reject(new Error('R2 鉴权失败：请检查 R2 密钥与 Worker AUTH_TOKEN 是否一致'));
        else if (xhr.status === 413) reject(new Error('文件太大：超过 Worker 大小上限'));
        else if (xhr.status === 0 || xhr.status >= 500) {
          if (retry < 1) {
            setTimeout(() => this.uploadToR2(file, onProgress, retry + 1).then(resolve, reject), 1000);
          } else {
            reject(new Error('Worker 异常（HTTP ' + xhr.status + '）：' + (xhr.responseText || '').substring(0, 200)));
          }
        } else if (xhr.status === 404) {
          reject(new Error('Worker URL 不存在（404）：请确认 Worker 已部署'));
        } else {
          reject(new Error((data && data.error) || `R2 HTTP ${xhr.status}: ${xhr.responseText.substring(0, 200)}`));
        }
      };
      xhr.onerror = () => {
        let hint = 'R2 网络错误';
        if (/\.r2\.dev/.test(workerUrl)) {
          hint = '网址错误：应填 Worker URL（形如 https://ai-media-proxy.xxx.workers.dev），不是 R2 公网域名';
        } else if (!/\.workers\.dev/.test(workerUrl) && !/cloudflare/.test(workerUrl)) {
          hint = '网址看起来不是 Cloudflare Worker，请确认是 https://xxx.workers.dev';
        } else if (retry < 1) {
          setTimeout(() => this.uploadToR2(file, onProgress, retry + 1).then(resolve, reject), 1000);
          return;
        } else {
          hint = '网络连接失败（已重试 1 次仍失败）：Worker 未部署 / URL 拼错 / 跨域拦截';
        }
        reject(new Error(hint));
      };
      xhr.ontimeout = () => reject(new Error('R2 上传超时'));
      xhr.timeout = 120000;
      xhr.send(formData);
    });
  },
  async testR2Connection() {
    if (!CONFIG.R2.WORKER_URL) { Toast.error('请先填写 R2 网址'); return false; }
    const btn = document.getElementById('testR2Btn');
    const orig = btn?.textContent;
    if (btn) { btn.disabled = true; btn.textContent = '测试中…'; }
    try {
      const blob = new Blob(['t'], { type: 'text/plain' });
      const file = new File([blob], 'r2-test.txt', { type: 'text/plain' });
      const url = await this.uploadToR2(file);
      Toast.success('R2 连接成功！');
      if (btn) { btn.disabled = false; btn.textContent = '已连接 ✓'; setTimeout(() => { btn.textContent = orig; }, 3000); }
      return true;
    } catch (err) {
      Toast.error('R2 测试失败：' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = orig; }
      return false;
    }
  },
  async dataUrlToBlob(dataUrl) {
    const m = /^data:([^;,]+)(;base64)?,([\s\S]*)$/.exec(dataUrl);
    if (!m) throw new Error('无法解析的 data URL');
    const mime = (m[1] || 'image/png').toLowerCase();
    const isB64 = !!m[2];
    const bytes = isB64 ? atob(m[3]) : decodeURIComponent(m[3]);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    return new Blob([arr], { type: mime });
  },
  async uploadDataUrl(dataUrl, onProgress) {
    if (!CONFIG.R2.WORKER_URL) throw new Error('请先在设置里配置 R2 网址');
    const blob = await this.dataUrlToBlob(dataUrl);
    const extMap = { 'image/png':'png','image/jpeg':'jpg','image/jpg':'jpg','image/webp':'webp','image/gif':'gif' };
    const ext = extMap[blob.type.toLowerCase()] || 'png';
    const file = new File([blob], `upload-${Date.now()}.${ext}`, { type: blob.type });
    return await this.uploadToR2(file, onProgress);
  },
  _cache: Object.create(null),
  getCached(d) { return this._cache[d]; },
  setCached(d,u) { if (d && u) this._cache[d]=u; }
};

// ==================== 轮询器 ====================
class Poller {
  constructor() { this.timers = {}; this.polls = {}; }
  getPhase(elapsed) { for (const p of CONFIG.POLL_PHASES) { if (elapsed < p.until) return p; } return CONFIG.POLL_PHASES[CONFIG.POLL_PHASES.length - 1]; }
  start(task) {
    if (this.timers[task.id]) return;
    const st = { count: 0, netFails: 0, startAt: task.startTime || Date.now(), stopped: false, _timer: null };
    this.polls[task.id] = st;
    Store.updateTask(task.id, { status: 'running', startTime: st.startAt });
    UI.renderResults();
    this.timers[task.id] = setInterval(() => {
      const t = Store.getTasks().find(x => x.id === task.id);
      if (!t || t.status !== 'running') { this.stop(task.id); return; }
      const elapsed = Date.now() - st.startAt;
      Store.updateTask(task.id, { elapsed });
      UI.updateTimer(task.id, elapsed, st);
    }, 500);
    const tick = async () => {
      st._timer = null;
      if (st.stopped) return;
      if (Date.now() - st.startAt >= CONFIG.POLL_TIMEOUT) { this.onTimeout(task.id); return; }
      st.count++;
      try {
        const detail = await Api.queryDetail(task.apiId);
        if (st.stopped) return;
        if (Date.now() - st.startAt >= CONFIG.POLL_TIMEOUT) { this.onTimeout(task.id); return; }
        st.netFails = 0; st.rateFails = 0;
        const status = detail?.data?.status;
        Store.updateTask(task.id, { lastStatus: status, lastQueryAt: Date.now(), phase: this.getPhase(Date.now()-st.startAt).name });
        if (status === 2) {
          const url = Api.extractUrl(detail);
          const elapsed = Date.now() - st.startAt;
          this.stop(task.id);
          Store.updateTask(task.id, { status: 'success', resultUrl: url, rawDetail: detail, endTime: Date.now(), elapsed });
          Store.updateHistory(task.historyId, { status: 'success', resultUrl: url, endTime: Date.now(), elapsed });
          UI.renderResults();
          if (url) { Toast.success(`${task.modelName} 成功`, { actions: [{ label: '查看', onClick: () => UI.switchView('result') }] }); UI.playSound(); UI.notify(task.modelName, false); }
          else Toast.warning('任务成功但未提取到URL');
          return;
        } else if (status === 3) {
          const err = detail?.data?.message || '生成失败';
          this.stop(task.id);
          Store.updateTask(task.id, { status: 'failed', error: err, endTime: Date.now() });
          Store.updateHistory(task.historyId, { status: 'failed', error: err, endTime: Date.now() });
          UI.renderResults();
          Toast.error(`${task.modelName} 失败: ${err}`);
          UI.notify(task.modelName, true, err);
          return;
        }
        st._timer = setTimeout(tick, this.getPhase(Date.now() - st.startAt).interval);
      } catch (e) {
        if (e.message === 'RATE_LIMITED') {
          st.rateFails = (st.rateFails||0) + 1;
          const backoff = e.retryAfter > 0 ? e.retryAfter*1000 : Math.min(10000 * Math.pow(2, st.rateFails-1), 60000);
          st._timer = setTimeout(tick, backoff);
          return;
        }
        st.netFails++;
        if (e.message === 'NETWORK_OR_CORS' || e.message === 'REQUEST_TIMEOUT') {
          if (st.netFails >= CONFIG.POLL_FAIL_LIMIT) {
            this.stop(task.id); const msg = e.message === 'REQUEST_TIMEOUT' ? '查询请求连续超时' : `连续${st.netFails}次网络失败`;
            Store.updateTask(task.id, { status:'failed', error:msg, endTime:Date.now() }); Store.updateHistory(task.historyId,{status:'failed',error:msg,endTime:Date.now()});
            UI.renderResults(); Toast.error(`${msg}，请检查网络后重试`); return;
          }
          UI.updateTimer(task.id, Date.now()-st.startAt, {...st, requestError:e.message});
          st._timer = setTimeout(tick, Math.min(this.getPhase(Date.now()-st.startAt).interval * 2, 8000));
          return;
        }
        if (e.message === 'NO_API_KEY') { this.stop(task.id); const msg='API密钥缺失'; Store.updateTask(task.id,{status:'failed',error:msg,endTime:Date.now()}); Store.updateHistory(task.historyId,{status:'failed',error:msg,endTime:Date.now()}); UI.renderResults(); Toast.error('请先填写API密钥'); return; }
        if (st.netFails >= CONFIG.POLL_FAIL_LIMIT) { this.stop(task.id); const msg=`连续${st.netFails}次查询失败`; Store.updateTask(task.id,{status:'failed',error:msg,endTime:Date.now()}); Store.updateHistory(task.historyId,{status:'failed',error:msg,endTime:Date.now()}); UI.renderResults(); Toast.error('查询失败，可稍后重试'); return; }
        st._timer = setTimeout(tick, this.getPhase(Date.now() - st.startAt).interval);
      }
    };
    tick();
  }
  onTimeout(id) {
    this.stop(id);
    const t = Store.getTasks().find(x => x.id === id);
    if (!t) return;
    Store.updateTask(id, { status: 'timeout', error: '超时(10分钟)，可手动刷新', endTime: Date.now() });
    Store.updateHistory(t.historyId, { status: 'timeout', endTime: Date.now() });
    UI.renderResults();
    Toast.warning('轮询超时');
  }
  stop(id) { if (this.timers[id]) { clearInterval(this.timers[id]); delete this.timers[id]; } const st = this.polls[id]; if (st) { if (st._timer) clearTimeout(st._timer); st.stopped = true; delete this.polls[id]; } }
  async refresh(id) {
    const t = Store.getTasks().find(x => x.id === id);
    if (!t || !t.apiId) return;
    Toast.info('查询中…');
    try {
      const d = await Api.queryDetail(t.apiId);
      const s = d?.data?.status;
      if (s === 2) { const url = Api.extractUrl(d); const now=Date.now(); this.stop(id); Store.updateTask(id,{status:'success',resultUrl:url,rawDetail:d,endTime:now,elapsed:now-(t.startTime||now)}); Store.updateHistory(t.historyId,{status:'success',resultUrl:url,endTime:now,elapsed:now-(t.startTime||now)}); UI.renderResults(); Toast.success(url?'成功':'成功，但未提取到结果URL'); if(url) UI.playSound(); }
      else if (s === 3) { const msg=d?.data?.message||'生成失败'; const now=Date.now(); this.stop(id); Store.updateTask(id,{status:'failed',error:msg,endTime:now}); Store.updateHistory(t.historyId,{status:'failed',error:msg,endTime:now}); UI.renderResults(); Toast.error('生成失败：'+msg); }
      else { Toast.info('仍在生成中'); if (!this.timers[id]) this.start({ id: t.id, apiId: t.apiId, modelName: t.modelName, startTime: t.startTime, historyId: t.historyId }); }
    } catch (e) {
      if(e.message==='RATE_LIMITED') Toast.warning('查询受限，稍后自动退避重试');
      else if(e.message==='REQUEST_TIMEOUT') Toast.warning('查询超时，请稍后再次刷新');
      else if(e.message==='NETWORK_OR_CORS') Toast.error('网络或跨域异常，请检查网络后重试');
      else if(e.message==='NO_API_KEY') Toast.error('请先填写 API 密钥');
      else if(String(e.message||'').startsWith('QUERY_API_')) Toast.error('API 查询失败：'+String(e.message).replace(/^QUERY_API_\d+:/,''));
      else Toast.error('查询失败：'+e.message);
    }
  }
  resumeAll() { const now=Date.now(); Store.getTasks().filter(t=>t.status==='running').forEach(t=>{ if(!t.startTime || now-t.startTime>=CONFIG.POLL_TIMEOUT){ this.onTimeout(t.id); return; } this.start({id:t.id,apiId:t.apiId,modelName:t.modelName,startTime:t.startTime,historyId:t.historyId}); }); }
}

  renderRefGrid(key) {
    const refs = this.getRefs(key);
    const param = this.model && this.model.params.find(p => p.key === key);
    const isVideoParam = param && param.type === 'ref-video';
    const items = refs.map(r => {
      const src = r.remote || r.src || '';
      const isVideo = r.mediaType === 'video' || r.kind === 'local-video' || r.kind === 'url-video';
      let badge;
      if (r.kind === 'local-video') badge = `<span class="ref-badge local-video">本地视频</span>`;
      else if (r.kind === 'url-video') badge = `<span class="ref-badge url-video">URL视频</span>`;
      else badge = `<span class="ref-badge ${r.uploaded?'uploaded':'local'}">${r.uploaded?'已传':'本地'}</span>`;
      let metaOverlay = '';
      if (isVideo) {
        const m = r.meta || {};
        const parts = [];
        if (m.width && m.height) parts.push(`${m.width}×${m.height}`);
        if (m.duration) parts.push(`${m.duration}s`);
        if (m.sizeMB) parts.push(`${m.sizeMB}MB`);
        if (parts.length) metaOverlay = `<div class="ref-meta-overlay">${parts.join(' · ')}</div>`;
        const body = src ? `<video src="${esc(src)}" preload="metadata" muted playsinline></video>` : '<span style="display:grid;place-items:center;height:100%;color:var(--text-dim);font-size:10px">预览失败</span>';
        return `<div class="ref-item ref-item-video">${badge}${body}${metaOverlay}<div class="ref-play-icon">▶</div><button type="button" class="ref-del" data-key="${esc(key)}" data-rid="${esc(r.id)}" aria-label="删除">×</button></div>`;
      }
      const body = src ? `<img src="${esc(src)}" loading="lazy" alt="${esc(r.name||'参考图')}" referrerpolicy="no-referrer">` : '<span style="display:grid;place-items:center;height:100%;color:var(--text-dim);font-size:10px">预览失败</span>';
      return `<div class="ref-item">${badge}${body}${r.remote || r.kind === 'url' ? `<button type="button" class="ref-copy-url" data-ref-copy="${esc(r.id)}" data-ref-key="${esc(key)}">复制网址</button>` : ''}<button type="button" class="ref-del" data-key="${esc(key)}" data-rid="${esc(r.id)}" aria-label="删除参考图">×</button></div>`;
    }).join('');
    const addBtn = `<button type="button" class="ref-add" data-key="${esc(key)}" aria-label="添加${isVideoParam?'视频':'参考图'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button><input type="file" id="refFile-${esc(key)}" accept="${isVideoParam?'video/*':'image/*'}" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">`;
    const warn = isVideoParam ? `<div class="ref-video-warn" id="rvw-${esc(key)}">⚠ 本地视频需上传到 R2 后才能使用</div>` : '';
    const gridClass = isVideoParam ? 'ref-grid ref-grid-video' : 'ref-grid';
    const empty = refs.length ? '' : '';
    return `<div class="ref-wrap" data-ref-key="${esc(key)}"><div class="${gridClass}" data-key="${esc(key)}">${items}${empty}${addBtn}</div>${warn}<div class="ref-progress" id="rp-${esc(key)}"><div class="ring"></div><span id="rpt-${esc(key)}">上传中…</span></div></div>`;
  },
  addVideoRef(file, key) {
    if (!/^video\//.test(file.type)) return Toast.error('非视频文件');
    if (file.size > 100*1024*1024) return Toast.error('视频不能超过 100MB');
    const objectUrl = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true;
    const finalize = (meta) => {
      this.getRefs(key).push({id:'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:'local-video',src:objectUrl,name:file.name,uploaded:false,remote:null,mediaType:'video',meta:meta||{},_file:file});
      this.refreshRefGrid(key);
      Toast.success('已加视频');
      if (CONFIG.R2.WORKER_URL) {
        Toast.info('正在上传到 R2...');
        this.uploadLocalVideoToR2(key, objectUrl, file).catch(err => Toast.warning('上传失败：'+err.message));
      } else {
        Toast.warning('未配置 R2，仅用于预览');
      }
    };
    v.onloadedmetadata = () => finalize({duration:v.duration?+v.duration.toFixed(1):null,width:v.videoWidth||null,height:v.videoHeight||null,sizeMB:+(file.size/1024/1024).toFixed(1)});
    v.onerror = () => finalize({sizeMB:+(file.size/1024/1024).toFixed(1)});
    v.src = objectUrl;
  },
  async uploadLocalVideoToR2(key, objectUrl, file) {
    const refs = this.getRefs(key);
    const ref = refs.find(r => r.src === objectUrl);
    if (!ref) return;
    const prog = $('#rp-'+key); if (prog) prog.classList.add('show');
    try {
      const remoteUrl = await Api.uploadToR2(file, (pct) => {
        const t = $('#rpt-'+key); if (t) t.textContent = `上传中 ${pct}%`;
      });
      ref.kind = 'url-video'; ref.src = remoteUrl; ref.remote = remoteUrl; ref.uploaded = true;
      this.refreshRefGrid(key);
      Toast.success('视频已上传');
    } finally { if (prog) prog.classList.remove('show'); }
  },

  getRefs(key) { return this.refState[this.currentRefKey]?.[key] || []; },
  setRefs(key, refs) { const state=this.refState[this.currentRefKey]; if(state) state[key]=Array.isArray(refs)?refs.map(r=>({...r})):[]; },
  clearRefs(key) { this.setRefs(key, []); },

  addRef(file, key) {
    if (!/^image\//.test(file.type)) return Toast.error('非图片文件');
    if (file.size > 10*1024*1024) return Toast.error('图片过大');
    const r = new FileReader();
    r.onload = () => { this.getRefs(key).push({ id:'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), kind:'local', src:r.result, name:file.name, uploaded:false, remote:null }); this.refreshRefGrid(key); Toast.success('已添加参考图'); };
    r.onerror = () => Toast.error('读取图片失败，请重新选择');
    r.readAsDataURL(file);
  },
  removeRef(key, id) { const refs = this.getRefs(key); const i = refs.findIndex(r => r.id === id); if (i >= 0) refs.splice(i, 1); this.refreshRefGrid(key); },
  refreshRefGrid(key) { const wrap = $(`.ref-wrap[data-ref-key="${CSS.escape(key)}"]`); if (wrap) { wrap.outerHTML = this.renderRefGrid(key); this.bindRefEvents(key); } },
  bindRefEvents(key) {
    const f=$('#paramForm'); if(!f) return;
    $$('.ref-add[data-key]', f).forEach(b=>b.onclick=()=>{ const inp=$('#refFile-'+b.dataset.key); if(inp) inp.click(); });
    $$('input[type=file][id^="refFile-"]', f).forEach(inp=>inp.onchange=e=>{ Array.from(e.target.files||[]).forEach(file=>{ if(/^video\//.test(file.type)){ this.addVideoRef(file, inp.id.slice(8)); } else { this.addRef(file, inp.id.slice(8)); } }); e.target.value=''; });
    $$('.ref-del[data-key]', f).forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); this.removeRef(b.dataset.key,b.dataset.rid); });
    $$('.ref-item-video video', f).forEach(v=>{ v.addEventListener('loadeddata',()=>{ try{ v.currentTime=0.1; }catch(e){} }); v.onclick=e=>{ e.stopPropagation(); this.openVideoLightbox(v.src); }; });
    $$('.ref-item img', f).forEach(img=>{ img.onclick=()=>this.openLightbox(img.src); });
  },

  // 修复：不能对 url-list 等非 input 元素直接调用 value.trim()。统一安全取值。
  // 统一参数取值：优先读取参数组内真正的 input/textarea/select，避免移动端 data-key 容器误命中。
  getParamElement(group, param) {
    if (!group) return null;
    if (param.key === 'prompt' || param.key === 'text') return group.querySelector('textarea[data-key]') || group.querySelector('textarea');
    return group.querySelector(`[data-key=\"${CSS.escape(param.key)}\"]`) || group.querySelector('input,textarea,select');
  },
  readFieldValue(el) {
    if (!el) return '';
    const value = el?.value ?? '';
    return String(value).trim();
  },

  collectParamsSync() {
    const body = {}; const f = $('#paramForm'); if (!f || !this.model) return body;
    this.model.params.forEach(p => {
      if (p.type === 'ref-image') return;
      const g = f.querySelector(`.form-group[data-key="${CSS.escape(p.key)}"]`);
      if (!g) return;
      const hiddenPanel = g.closest('.api-mode-panel');
      if (hiddenPanel && !hiddenPanel.classList.contains('active')) return;
      let val = '';
      if (p.type === 'url-list') {
        val = Array.from(g.querySelectorAll('input[type="url"]')).map(i => this.readFieldValue(i)).filter(Boolean);
        if (val.length) body[p.key] = val;
        return;
      }
      const el = g.querySelector(`[data-key="${CSS.escape(p.key)}"]`) || g.querySelector('input,textarea,select');
      val = this.readFieldValue(el);
      if (p.type === 'range') val = Number(val);
      if (val !== '' && !(p.type === 'range' && !Number.isFinite(val))) body[p.key] = val;
    });
    return body;
  },

  async collectParamsAsync() {
    const body = {}; const errors = []; const f = $('#paramForm');
    const model = this.model;
    if (!model || !f) return { body, errors: ['模型参数未加载'] };
    for (const p of model.params) {
      const g = f.querySelector(`.form-group[data-key="${p.key}"]`);
      if (g) { const hiddenPanel = g.closest('.api-mode-panel'); if (hiddenPanel && !hiddenPanel.classList.contains('active')) continue; }
      let val = null;
      if (p.type === 'ref-image' || p.type === 'ref-video') {
        const refs = this.getRefs(p.key);
        // 视频本地未上传的检查
        if (p.type === 'ref-video') {
          const localVideo = refs.filter(r => r.kind === 'local-video');
          if (localVideo.length > 0) { errors.push(`${p.label}: ${localVideo.length} 个本地视频未上传，请等待上传完成或配置 R2`); continue; }
        }
        if (refs.length > 0) {
          const pending = refs.filter(r => r.kind === 'local' && !r.uploaded);
          if (pending.length > 0) {
            const prog = $('#rp-'+p.key); if (prog) prog.classList.add('show');
            const results = await Promise.all(pending.map(async r => {
              try { let u = Api.getCached(r.src); if (!u) { u = await Api.uploadDataUrl(r.src); Api.setCached(r.src, u); } r.remote = u; r.uploaded = true; return { ok: true }; }
              catch (e) { return { ok: false, name: r.name, msg: e.message }; }
            }));
            this.refreshRefGrid(p.key);
            if (prog) prog.classList.remove('show');
            const fails = results.filter(x => !x.ok);
            if (fails.length) { errors.push(fails.map(f => `${f.name}: ${f.msg}`).join('; ')); continue; }
          }
          const urls = refs.map(r => r.remote || r.src).filter(u => !/^data:/i.test(u) && !/^blob:/i.test(u));
          if (urls.length) body[p.key] = p.output === 'csv' ? urls.join(',') : (p.output === 'single' ? urls[0] : urls);
        }
      } else if (p.type === 'url-list') {
        const inputs = Array.from(g.querySelectorAll('input[type="url"]'));
        const arr = inputs.map(i => this.readFieldValue(i)).filter(Boolean);
        val = arr;
        if (arr.length) body[p.key] = arr;
      } else {
        // 关键修复：prompt/text 强制从当前表单组的真实 textarea 读取，避免移动端被错误 data-key 元素命中。
        const el = this.getParamElement(g, p);
        val = this.readFieldValue(el);
        if ((p.key === 'prompt' || p.key === 'text') && !val) {
          const direct = g.querySelector('textarea');
          val = this.readFieldValue(direct);
        }
        if (p.type === 'range') val = Number(val);
        if (val !== '') body[p.key] = val;
      }
      if (p.required && (val == null || val === '' || (Array.isArray(val) && !val.length) || (body[p.key] == null))) { errors.push(p.label); g.classList.add('error'); }
      else g.classList.remove('error');
    }
    // 与电脑端保持一致的模型级 API 约束校验。
    if ((model.id === 'wan3' || model.id === 'minimax_h3') && (body.first_frame || body.last_frame)) {
      if (body.images || body.videos || body.audios) errors.push('首/尾帧不能同时搭配参考图、参考视频或参考音频');
      if (body.last_frame && !body.first_frame) errors.push('尾帧需要搭配首帧');
    }
    if (model.id === 'veo3_fast') {
      if (body.lastFrameUrl && !body.firstFrameUrl) errors.push('尾帧需要搭配首帧');
      if ((body.firstFrameUrl || body.lastFrameUrl) && body.urls) errors.push('首尾帧与参考图不能同时使用');
    }
    if (model.id === 'video_omni') {
      if (body.video_url && body.sound === 'on') errors.push('有参考视频时声音必须关闭');
    }
    const strict = normalizeAndValidateApiBody(this.model, body);
    errors.push(...strict.errors);
    return { body: strict.body, errors };
  },

  updateEstimate() {
    if (!this.model) return;
    const est = calcEstimate(this.model, this.collectParamsSync());
    const el = $('#estimate');
    if (!est) { el.innerHTML = ''; return; }
    el.innerHTML = est.amount != null ? `预计 <span class="val">¥${est.amount < 1 ? est.amount.toFixed(4) : est.amount.toFixed(2)}</span> · ${esc(est.label)}` : `<span style="color:var(--warning)">${esc(est.label)}</span>`;
  },

  saveFormToCache() {
    if (!this.model) return;
    const key=this.tab+'_'+this.model.id, params={}, f=$('#paramForm'); if(!f) return;
    this.model.params.forEach(p=>{
      if(p.type==='ref-image'||p.type==='ref-video'){ const refs=this.getRefs(p.key); if(refs.length) params[p.key]=refs.map(r=>({...r})); }
      else if(p.type==='url-list'){ const vals=Array.from(f.querySelectorAll(`.form-group[data-key=\"${CSS.escape(p.key)}\"] input[type=\"url\"]`)).map(x=>this.readFieldValue(x)).filter(Boolean); if(vals.length) params[p.key]=vals; }
      else { const el=this.getParamElement(f.querySelector(`.form-group[data-key=\"${CSS.escape(p.key)}\"]`),p); if(el) params[p.key]=el.value; }
    });
    const presetKey=this.tab+'/'+this.model.id;
    params.__promptPresetBase=this.promptPresetBase[presetKey]||'';
    params.__promptPresetName=this.promptPresetName[presetKey]||'';
    this.formCache[key]=params; this.formCache[this.tab+'_model']=this.model.id;
  },

  restoreFormFromCache() {
    if (!this.model) return;
    const saved=this.formCache[this.tab+'_'+this.model.id];
    if(!saved) return;
    const presetKey=this.tab+'/'+this.model.id;
    this.promptPresetBase[presetKey]=saved.__promptPresetBase||'';
    this.promptPresetName[presetKey]=saved.__promptPresetName||'';
    this.model.params.filter(p=>p.type==='ref-image'||p.type==='ref-video').forEach(p=>this.clearRefs(p.key));
    const f = $('#paramForm'); if (!f) return;
    this.model.params.forEach(p => {
      if (saved[p.key] === undefined) return;
      const g = f.querySelector(`.form-group[data-key="${p.key}"]`);
      if (p.type === 'ref-image' || p.type === 'ref-video') { const refs=Array.isArray(saved[p.key])?saved[p.key]:[]; this.setRefs(p.key,refs); this.refreshRefGrid(p.key); }
      else if (p.type === 'range') { const el = g?.querySelector(`[data-key="${p.key}"]`); if (el) { el.value = saved[p.key]; const rv = $('#rv-'+p.key); if (rv) rv.textContent = saved[p.key] + (p.unit||''); } }
      else { const el = g?.querySelector(`[data-key="${p.key}"]`); if (el) el.value = saved[p.key]; }
    });
    this.updateEstimate();
  },

  async handleGenerate() {
    if (!Store.getApiKey()) { this.openSheet('settingsSheet','settingsOverlay'); Toast.error('请先填写速创 API 密钥'); return; }
    if (!this.model) { Toast.warning('请先选择模型'); return; }
    const btn=$('#genBtn'); if(btn?.disabled) return;
    btn.disabled=true; $('#genBtnText').textContent='准备中…';
    try {
      const collected=await this.collectParamsAsync();
      // v8：最终请求前统一 API Schema 校验（移动端）
      const strictCheck = strictValidateRequest(this.model, collected.body);
      Object.assign(collected.body, strictCheck.body);
      collected.errors.push(...strictCheck.errors);
      // 最后一层防护：提交前直接读取当前可见 prompt/text，彻底杜绝“明明填写却判空”。
      const promptParam = this.model.params.find(p => p.key === 'prompt' || p.key === 'text');
      if (promptParam) {
        const promptGroup = $('#paramForm .form-group[data-key="' + CSS.escape(promptParam.key) + '"]');
        const promptEl = promptGroup?.querySelector('textarea');
        const directPrompt = this.readFieldValue(promptEl);
        if (directPrompt) collected.body[promptParam.key] = directPrompt;
        const idx = collected.errors.findIndex(x => x === promptParam.label);
        if (directPrompt && idx >= 0) collected.errors.splice(idx, 1);
        if (!directPrompt && !collected.errors.some(x => String(x).includes(promptParam.label))) collected.errors.push(promptParam.label);
      }
      if(collected.errors.length){ Toast.warning(`请完善：${collected.errors.join('、')}`); return; }
      const body=collected.body;
      const promptVal=body.prompt||body.text||body.video_url||body.videoName||body.audio_url||'';
      if(promptVal) Store.addPromptHistory(String(promptVal));
      const summary=trunc(String(promptVal),40); const taskId=genId(), historyId='h_'+taskId.slice(2), now=Date.now();
      if(this.model.async){
        $('#genBtnText').textContent='提交中…';
        let resp; try { resp=await Api.submit(this.model.endpoint,body); } catch(e) { const cls=classifyErr(e.message); Toast.error(`${cls.category}：${cls.hint}`); return; }
        if(Number(resp?.code)!==200){ const cls=classifyErr(resp?.msg||`API ${resp?.code||'错误'}`); Toast.error(`${cls.category}：${cls.hint}`); return; }
        const apiData=typeof resp?.data==='string' ? (()=>{try{return JSON.parse(resp.data)}catch{return null}})() : resp?.data; const apiId=apiData?.id; if(!apiId){ Toast.error('服务未返回任务 ID，请稍后重试'); return; }
        Store.addTask({id:taskId,apiId,historyId,tab:this.tab,modelId:this.model.id,modelName:this.model.name,type:this.model.type,params:body,prompt:summary,status:'running',startTime:now,async:true,createdAt:now});
        Store.addHistory({id:historyId,taskId,apiId,tab:this.tab,modelId:this.model.id,modelName:this.model.name,type:this.model.type,params:body,prompt:summary,status:'running',startTime:now,createdAt:now});
        this.renderResults(); poller.start({id:taskId,apiId,modelName:this.model.name,startTime:now,historyId}); this.switchView('result'); Toast.success('任务已提交，后台生成中');
      } else {
        Store.addTask({id:taskId,historyId,tab:this.tab,modelId:this.model.id,modelName:this.model.name,type:this.model.type,params:body,prompt:summary,status:'running',startTime:now,async:false,createdAt:now});
        Store.addHistory({id:historyId,taskId,tab:this.tab,modelId:this.model.id,modelName:this.model.name,type:this.model.type,params:body,prompt:summary,status:'running',startTime:now,createdAt:now});
        this.renderResults(); $('#genBtnText').textContent='调用中…';
        try {
          const resp=await Api.syncCall(this.model.endpoint,body);
          if(Number(resp?.code)!==200) throw new Error(resp?.msg||`API ${resp?.code||'错误'}`);
          const url=resp?.data?.url||resp?.data?.demo_audio||Api.extractUrl(resp)||''; if(!url) throw new Error('服务返回成功，但未找到结果 URL');
          const done=Date.now(); Store.updateTask(taskId,{status:'success',resultUrl:url,rawDetail:resp,endTime:done,elapsed:done-now}); Store.updateHistory(historyId,{status:'success',resultUrl:url,endTime:done,elapsed:done-now});
          Toast.success('生成成功'); this.playSound();
        } catch(e) { const done=Date.now(); const cls=classifyErr(e.message); Store.updateTask(taskId,{status:'failed',error:e.message,endTime:done}); Store.updateHistory(historyId,{status:'failed',error:e.message,endTime:done}); Toast.error(`${cls.category}：${cls.hint}`); }
        this.renderResults();
      }
    } catch(e) { console.error(e); Toast.error(`操作失败：${e?.message||'未知错误'}`); }
    finally { btn.disabled=false; $('#genBtnText').textContent='生成'; }
  },

  switchView(view) {
    const targetId = view.endsWith('View') ? view : view + 'View';
    const target = document.getElementById(targetId) || document.getElementById('paramView');
    const finalId = target.id;
    this.currentView = finalId;
    $$('.view').forEach(v => v.classList.toggle('active', v.id === finalId));

    if (btn && icon) {
      const resultMode = finalId === 'resultView';
      btn.classList.toggle('result-mode', resultMode);

      btn.title = resultMode ? '返回生成区' : '查看结果';
      icon.innerHTML = resultMode
        ? '<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle>'
        : '<path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path>';
