    $('#modalFooter').innerHTML = `<button class="act" id="modalClose">关闭</button><button class="act primary" id="modalReuse">再用参数</button>`;
    $('#modalClose').onclick = () => $('#modal').classList.remove('show');
    $('#modalReuse').onclick = () => { $('#modal').classList.remove('show'); if (h.taskId) this.regen(h.taskId); };
    $('#modal').classList.add('show');
  },

  /* ===== Editor ===== */
  openEditor(url) {
    if (!url) { Toast.error('图片 URL 为空'); return; }
    $('#editor').classList.add('show');
    $('#canvasHint').textContent = '加载图片…'; $('#canvasHint').classList.remove('hide');
    const promptEl = $('#editorPrompt'); if (promptEl) promptEl.value = '';
    this.editor.isDrawing = false; this.editor.undoStack = []; this.editor.maskOps = [];
    this.editor.currentBrush = null; this.editor.rectPreview = null; this.editor.strokeSnapshot = null;
    $$('.dir-btn').forEach(b => b.classList.remove('active'));
    const loadImage = (src, crossOrigin = false) => new Promise((resolve, reject) => {
      const img = new Image();
      if (crossOrigin) img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('IMAGE_LOAD_FAILED'));
      img.src = src;
    });
    (async () => {
      try {
        const img = await loadImage(url, false);
        this.editor.img = img; this.editor.origSrc = url; this.editor.imgClean = false;
        this.initEditorCanvas(); $('#canvasHint').classList.add('hide');
      } catch {
        try {
          const proxyUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, ''));
          const img = await loadImage(proxyUrl, true);
          this.editor.img = img; this.editor.origSrc = url; this.editor.imgClean = true;
          this.initEditorCanvas(); $('#canvasHint').classList.add('hide');
        } catch {
          $('#canvasHint').textContent = '图片加载失败，请使用公开可访问的图片';
          Toast.error('编辑器无法读取此图片');
        }
      }
    })();
  },
  initEditorCanvas() {
    const canvas = $('#maskCanvas'), ctx = canvas.getContext('2d');
    const bgCanvas = $('#bgCanvas'), bgCtx = bgCanvas.getContext('2d');
    const img = this.editor.img; if (!img) return;
    const MAX = 1024;
    let w = img.naturalWidth, h = img.naturalHeight;
    if (w > MAX || h > MAX) { const r = Math.min(MAX / w, MAX / h); w = Math.round(w * r); h = Math.round(h * r); }
    canvas.width = w; canvas.height = h; bgCanvas.width = w; bgCanvas.height = h;
    bgCtx.clearRect(0, 0, w, h); bgCtx.drawImage(img, 0, 0, w, h);
    ctx.clearRect(0, 0, w, h); ctx.globalCompositeOperation = 'source-over';
    this.editor.canvas = canvas; this.editor.ctx = ctx;
    this.editor.bg = bgCanvas; this.editor.bgCtx = bgCtx;
    this.editor.undoStack = []; this.editor.maskOps = [];
    this.pushUndo(); this.bindEditorEvents();
    this.updateEditorToolUI();
  },
  updateEditorToolUI() {
    const bg = $('#brushSizeGroup');
    if (bg) {
      const need = this.editor.tool === 'brush' || this.editor.tool === 'eraser';
      bg.style.opacity = need ? '1' : '0.4';
      bg.style.pointerEvents = need ? 'auto' : 'none';
    }
    const op = $('#outpaintCtrl');
    if (op) op.style.display = this.editor.tool === 'outpaint' ? 'flex' : 'none';
    const c = $('#maskCanvas');
    if (c) c.className = `tool-${this.editor.tool}`;
  },
  bindEditorEvents() {
    $$('.tb[data-tool]').forEach(b => b.onclick = () => {
      $$('.tb[data-tool]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      this.editor.tool = b.dataset.tool;
      this.editor.isDrawing = false; this.editor.currentBrush = null;
      this.updateEditorToolUI();
    });
    $$('.sb[data-size]').forEach(b => b.onclick = () => {
      $$('.sb[data-size]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      this.editor.brushSize = +b.dataset.size;
    });
    $$('.cb').forEach(b => b.onclick = () => {
      $$('.cb').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      this.editor.color = b.dataset.color;
    });
    $$('.dir-btn[data-dir]').forEach(b => b.onclick = () => b.classList.toggle('active'));
    $$('.sb[data-expand]').forEach(b => b.onclick = () => {
      $$('.sb[data-expand]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      this.editor.expandSize = +b.dataset.expand;
    });
    const c = this.editor.canvas;
    if (window.PointerEvent) {
      c.onpointerdown = e => { if (e.pointerType !== 'mouse' || e.button === 0) { e.preventDefault(); c.setPointerCapture?.(e.pointerId); this.onEditorDown(e); } };
      c.onpointermove = e => { if (this.editor.isDrawing) { e.preventDefault(); this.onEditorMove(e); } };
      c.onpointerup = e => { if (this.editor.isDrawing) { e.preventDefault(); this.onEditorUp(e); } c.releasePointerCapture?.(e.pointerId); };
      c.onpointercancel = e => { if (this.editor.isDrawing) this.onEditorUp(e); c.releasePointerCapture?.(e.pointerId); };
      c.onpointerleave = e => { if (e.pointerType === 'mouse' && this.editor.isDrawing) this.onEditorUp(e); };
    } else {
      c.onmousedown = e => this.onEditorDown(e);
      c.onmousemove = e => this.onEditorMove(e);
      c.onmouseup = e => this.onEditorUp(e);
      c.onmouseleave = e => this.onEditorUp(e);
      c.ontouchstart = e => { e.preventDefault(); this.onEditorDown(e.touches[0]); };
      c.ontouchmove = e => { e.preventDefault(); this.onEditorMove(e); };
      c.ontouchend = e => { e.preventDefault(); const t = e.changedTouches[0]; if (t) this.onEditorUp(t); };
    }
  },
  getCanvasPos(e) {
    const canvas = this.editor.canvas, rect = canvas.getBoundingClientRect();
    const sx = canvas.width / (rect.width || 1), sy = canvas.height / (rect.height || 1);
    return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
  },
  onEditorDown(e) {
    if (!this.editor.img || !this.editor.canvas || this.editor.tool === 'outpaint') return;
    const p = this.getCanvasPos(e);
    this.editor.isDrawing = true; this.editor.startX = p.x; this.editor.startY = p.y;
    if (this.editor.tool === 'rect') {
      this.editor.rectPreview = this.snapshotMaskCanvas();
    } else {
      this.editor.strokeSnapshot = this.snapshotMaskCanvas();
      this.editor.currentBrush = { type: this.editor.tool, color: this.editor.color, opacity: this.editor.opacity, size: this.editor.brushSize, points: [{ x: p.x, y: p.y }] };
      this.redrawStroke(this.editor.currentBrush);
    }
  },
  onEditorMove(e) {
    if (!this.editor.isDrawing) return;
    const p = this.getCanvasPos(e);
    if (this.editor.tool === 'rect') {
      this.restoreMaskCanvas(this.editor.rectPreview);
      this.drawRect(this.editor.startX, this.editor.startY, p.x, p.y);
    } else if (this.editor.currentBrush) {
      this.editor.currentBrush.points.push({ x: p.x, y: p.y });
      this.restoreMaskCanvas(this.editor.strokeSnapshot);
      this.redrawStroke(this.editor.currentBrush);
    }
  },
  onEditorUp(e) {
    if (!this.editor.isDrawing) return;
    this.editor.isDrawing = false;
    if (this.editor.tool === 'rect' && e) {
      const p = this.getCanvasPos(e);
      const x = Math.min(this.editor.startX, p.x), y = Math.min(this.editor.startY, p.y);
      const w = Math.abs(p.x - this.editor.startX), h = Math.abs(p.y - this.editor.startY);
      if (w > 2 && h > 2) this.editor.maskOps.push({ type: 'rect', color: this.editor.color, opacity: this.editor.opacity, x, y, w, h });
    } else if (this.editor.currentBrush) {
      if (this.editor.currentBrush.points.length) this.editor.maskOps.push(this.editor.currentBrush);
      this.editor.currentBrush = null;
    }
    this.editor.dirty = true; this.pushUndo();
  },
  redrawStroke(brush) {
    const ctx = this.editor.ctx, pts = brush.points;
    if (!ctx || !pts || !pts.length) return;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = brush.size;
    if (brush.type === 'brush') { ctx.strokeStyle = `rgba(${brush.color},${brush.opacity})`; ctx.globalCompositeOperation = 'source-over'; }
    else { ctx.strokeStyle = 'rgba(0,0,0,1)'; ctx.globalCompositeOperation = 'destination-out'; }
    ctx.beginPath();
    if (pts.length === 1) { ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[0].x + .01, pts[0].y + .01); }
    else { ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); }
    ctx.stroke(); ctx.restore(); ctx.globalCompositeOperation = 'source-over';
  },
  drawRect(x1, y1, x2, y2) {
    const ctx = this.editor.ctx;
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    ctx.fillStyle = `rgba(${this.editor.color},${this.editor.opacity})`;
    ctx.fillRect(x, y, w, h);
  },
  snapshotMaskCanvas() {
    const tmp = document.createElement('canvas');
    tmp.width = this.editor.canvas.width; tmp.height = this.editor.canvas.height;
    tmp.getContext('2d').drawImage(this.editor.canvas, 0, 0);
    return tmp;
  },
  restoreMaskCanvas(snapshot) {
    if (!snapshot) return;
    const ctx = this.editor.ctx;
    ctx.clearRect(0, 0, this.editor.canvas.width, this.editor.canvas.height);
    ctx.drawImage(snapshot, 0, 0);
  },
  applyOutpaint() {
    const top = $('#outpaintDirections .dir-btn[data-dir="top"]')?.classList.contains('active');
    const bottom = $('#outpaintDirections .dir-btn[data-dir="bottom"]')?.classList.contains('active');
    const left = $('#outpaintDirections .dir-btn[data-dir="left"]')?.classList.contains('active');
    const right = $('#outpaintDirections .dir-btn[data-dir="right"]')?.classList.contains('active');
    if (!top && !bottom && !left && !right) { Toast.warning('请选择至少一个扩展方向'); return; }
    const exp = this.editor.expandSize;
    const bgCanvas = this.editor.bg, bgCtx = this.editor.bgCtx;
    const maskCanvas = this.editor.canvas, maskCtx = this.editor.ctx;
    if (!bgCanvas || !maskCanvas) { Toast.error('编辑器未就绪'); return; }
    const oldW = bgCanvas.width, oldH = bgCanvas.height;
    const newW = oldW + (left ? exp : 0) + (right ? exp : 0);
    const newH = oldH + (top ? exp : 0) + (bottom ? exp : 0);
    const offsetX = left ? exp : 0, offsetY = top ? exp : 0;
    const tmpBg = document.createElement('canvas'); tmpBg.width = oldW; tmpBg.height = oldH;
    tmpBg.getContext('2d').drawImage(bgCanvas, 0, 0);
    const tmpMask = document.createElement('canvas'); tmpMask.width = oldW; tmpMask.height = oldH;
    tmpMask.getContext('2d').drawImage(maskCanvas, 0, 0);
    bgCanvas.width = newW; bgCanvas.height = newH;
    maskCanvas.width = newW; maskCanvas.height = newH;
    bgCtx.fillStyle = `rgba(${this.editor.color},${this.editor.opacity})`;
    bgCtx.fillRect(0, 0, newW, newH);
    bgCtx.drawImage(tmpBg, offsetX, offsetY);
    if (this.editor.feather > 0) {
      const f = Math.min(this.editor.feather, Math.max(1, Math.min(oldW, oldH) / 2));
      bgCtx.save(); bgCtx.globalCompositeOperation = 'source-over';
      const edge = `rgba(${this.editor.color},${this.editor.opacity})`;
      const none = `rgba(${this.editor.color},0)`;
      if (top) { const g = bgCtx.createLinearGradient(0, offsetY - f, 0, offsetY + f); g.addColorStop(0, none); g.addColorStop(1, edge); bgCtx.fillStyle = g; bgCtx.fillRect(offsetX, offsetY - f, oldW, f * 2); }
      if (bottom) { const g = bgCtx.createLinearGradient(0, offsetY + oldH - f, 0, offsetY + oldH + f); g.addColorStop(0, edge); g.addColorStop(1, none); bgCtx.fillStyle = g; bgCtx.fillRect(offsetX, offsetY + oldH - f, oldW, f * 2); }
      if (left) { const g = bgCtx.createLinearGradient(offsetX - f, 0, offsetX + f, 0); g.addColorStop(0, none); g.addColorStop(1, edge); bgCtx.fillStyle = g; bgCtx.fillRect(offsetX - f, offsetY, f * 2, oldH); }
      if (right) { const g = bgCtx.createLinearGradient(offsetX + oldW - f, 0, offsetX + oldW + f, 0); g.addColorStop(0, edge); g.addColorStop(1, none); bgCtx.fillStyle = g; bgCtx.fillRect(offsetX + oldW - f, offsetY, f * 2, oldH); }
      bgCtx.restore();
    }
    maskCtx.clearRect(0, 0, newW, newH);
    maskCtx.drawImage(tmpMask, offsetX, offsetY);
    this.editor.maskOps.push({ type: 'outpaint', color: this.editor.color, opacity: this.editor.opacity, feather: this.editor.feather, top, bottom, left, right, oldW, oldH, newW, newH, offsetX, offsetY });
    this.editor.dirty = true; this.pushUndo();
    Toast.success(`已扩展画布至 ${newW}×${newH}`);
  },
  pushUndo() {
    const m = this.editor.canvas, b = this.editor.bg; if (!m || !b) return;
    if (this.editor.undoStack.length >= 20) this.editor.undoStack.shift();
    const maskSnap = document.createElement('canvas');
    maskSnap.width = m.width; maskSnap.height = m.height;
    maskSnap.getContext('2d').drawImage(m, 0, 0);
    const bgSnap = document.createElement('canvas');
    bgSnap.width = b.width; bgSnap.height = b.height;
    bgSnap.getContext('2d').drawImage(b, 0, 0);
    this.editor.undoStack.push({ mask: maskSnap, bg: bgSnap, maskOps: JSON.parse(JSON.stringify(this.editor.maskOps || [])) });
  },
  undoEditor() {
    if (this.editor.undoStack.length <= 1) { Toast.info('已是最早状态'); return; }
    this.editor.undoStack.pop();
    const prev = this.editor.undoStack[this.editor.undoStack.length - 1];
    if (!prev) return;
    this.editor.canvas.width = prev.mask.width; this.editor.canvas.height = prev.mask.height;
    this.editor.ctx.clearRect(0, 0, prev.mask.width, prev.mask.height);
    this.editor.ctx.drawImage(prev.mask, 0, 0);
    this.editor.bg.width = prev.bg.width; this.editor.bg.height = prev.bg.height;
    this.editor.bgCtx.clearRect(0, 0, prev.bg.width, prev.bg.height);
    this.editor.bgCtx.drawImage(prev.bg, 0, 0);
    this.editor.maskOps = JSON.parse(JSON.stringify(prev.maskOps || []));
    this.editor.dirty = true;
  },
  clearEditor() {
    if (this.editor.ctx) this.editor.ctx.clearRect(0, 0, this.editor.canvas.width, this.editor.canvas.height);
    this.editor.maskOps = []; this.editor.undoStack = []; this.pushUndo();
    this.editor.dirty = true; Toast.info('已清空蒙版');
  },
  async confirmEditor() {
    if (!this.editor.canvas || !this.editor.bg) { Toast.error('画布未就绪'); return; }
    const prompt = String($('#editorPrompt')?.value || '').trim();
    if (!prompt) { Toast.warning('请填写修改描述'); $('#editorPrompt')?.focus(); return; }
    const btn = $('#editorConfirmBtn'), orig = btn.textContent;
    btn.disabled = true; btn.textContent = '合成上传中…';
    try {
      const maskCanvas = this.editor.canvas, bgCanvas = this.editor.bg;
      const w = Math.max(bgCanvas.width, maskCanvas.width), h = Math.max(bgCanvas.height, maskCanvas.height);
      let mergedDataUrl = null;
      const mergeWithImage = async (src, cross = true) => {
        const i = new Image(); if (cross) i.crossOrigin = 'anonymous';
        i.src = src; await new Promise((r, j) => { i.onload = r; i.onerror = j; });
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
        x.drawImage(i, Math.round((w - bgCanvas.width) / 2), Math.round((h - bgCanvas.height) / 2), bgCanvas.width, bgCanvas.height);
        x.drawImage(maskCanvas, Math.round((w - maskCanvas.width) / 2), Math.round((h - maskCanvas.height) / 2));
        return c.toDataURL('image/png');
      };
      try {
        const proxy = 'https://images.weserv.nl/?url=' + encodeURIComponent(this.editor.origSrc.replace(/^https?:\/\//, ''));
        mergedDataUrl = await mergeWithImage(proxy, true);
      } catch {}
      if (!mergedDataUrl) {
        try {
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const x = c.getContext('2d');
          x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
          x.drawImage(bgCanvas, Math.round((w - bgCanvas.width) / 2), Math.round((h - bgCanvas.height) / 2));
          x.drawImage(maskCanvas, Math.round((w - maskCanvas.width) / 2), Math.round((h - maskCanvas.height) / 2));
          mergedDataUrl = c.toDataURL('image/png');
        } catch {}
      }
      if (!mergedDataUrl) throw new Error('浏览器无法导出编辑结果');
      let refUrl = Api.getCached(mergedDataUrl);
      if (!refUrl) { refUrl = await Api.uploadDataUrl(mergedDataUrl); Api.setCached(mergedDataUrl, refUrl); }
      if (this.tab !== 'image') this.switchTab('image');
      const refParam = this.model?.params.find(p => p.type === 'ref-image');
      if (refParam) {
        this.setRefs(refParam.key, [
          { id: 'r_' + genId(), kind: 'url', src: this.editor.origSrc, name: '原图', uploaded: true, remote: this.editor.origSrc },
          { id: 'r_' + genId(), kind: 'url', src: refUrl, name: '合成图', uploaded: true, remote: refUrl }
        ]);
        this.refreshRefGrid(refParam.key);
      }
      const pParam = this.model?.params.find(p => p.key === 'prompt');
      if (pParam) {
        const ta = this.getPromptTextarea();
        if (ta) { ta.value = prompt; ta.dispatchEvent(new Event('input', { bubbles: true })); }
      }
      this.closeEditor(); this.switchView('param');
      Toast.success('已合成参考图并填入参数');
    } catch (e) {
      Toast.error('合成失败：' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  },
  closeEditor() {
    const ed = $('#editor'); if (ed) ed.classList.remove('show');
    this.editor.isDrawing = false; this.editor.currentBrush = null;
    this.editor.canvas = null; this.editor.ctx = null;
    this.editor.bg = null; this.editor.bgCtx = null; this.editor.img = null;
    this.editor.undoStack = []; this.editor.maskOps = [];
  },

  /* ===== Global paste (workflow auto-apply) ===== */
  handleGlobalPaste(e) {
    const cd = e.clipboardData; if (!cd) return;
    const text = cd.getData ? cd.getData('text/plain') : '';
    // Workflow auto-apply
    if (text && /^#\s*速创工作台\s*[·-]\s*工作流\s+V32[\s\S]*#\s*END\s*$/i.test(text.trim())) {
      e.preventDefault();
      Workflow.apply(text);
      return;
    }
  }
};

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => UI.init());
</script>
