  renderResults() {
    const list = $('#resultList');
    let tasks = Store.getTasks();
    $('#resultList').innerHTML = '';
    if (tasks.length === 0) {
      list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><h3>暂无任务</h3><p>填写参数并点击「生成」</p></div>`;
      return;
    }
    const visible = tasks.slice(0, this.page);
    list.innerHTML = visible.map(t => this.renderCard(t)).join('');
    if (tasks.length > visible.length) {
      list.innerHTML += `<button class="act" style="justify-content:center;margin-top:8px" id="loadMore">加载更多（剩余 ${tasks.length - visible.length}）</button>`;
      $('#loadMore').onclick = () => { this.page += 20; this.renderResults(); };
    }
    this.bindCardEvents();
  },

  renderCard(t) {
    const st = { running:'生成中', success:'成功', failed:'失败', timeout:'超时' }[t.status] || t.status;
    const sc = t.status === 'timeout' ? 'timeout' : t.status;
    const prompt = t.prompt || trunc(JSON.stringify(t.params).slice(0,60),40);
    let body = '';
    if (t.status === 'running') {
      const elapsed = t.elapsed || (Date.now()-(t.startTime||Date.now()));
      const phase = poller.getPhase(elapsed)?.name || '';
      const interval = (poller.getPhase(elapsed)?.interval || 3000) / 1000;
      body = `${t.apiId ? `<div class="task-id">ID: ${esc(t.apiId)} <button class="copy" data-url="${esc(t.apiId)}">复制</button></div>` : ''}<div class="skeleton skeleton-media"></div><div class="bar"></div><div class="timer"><span class="dot"></span>${fmtDur(elapsed)} · ${esc(phase)} ${interval}s${t.error?` · ${esc(t.error)}`:''}</div><div class="poll-actions"><button class="act" data-refresh="${t.id}">刷新</button><button class="act danger" data-stop="${t.id}">停止</button></div>`;
    } else if (t.status === 'success' && t.resultUrl) {
      const m=t.type==='image' ? `<img src="${esc(t.resultUrl)}" loading="lazy" referrerpolicy="no-referrer" data-preview="${esc(t.resultUrl)}" alt="生成结果">` : t.type==='video' ? `<video src="${esc(t.resultUrl)}" controls preload="metadata"></video>` : `<audio src="${esc(t.resultUrl)}" controls></audio>`;
      body = `<div class="media">${m}</div><div class="url-row"><span style="flex:1">${esc(t.resultUrl)}</span><button class="copy" data-url="${esc(t.resultUrl)}">复制</button></div><div class="actions"><button class="act" data-copy="${esc(t.resultUrl)}">📋</button><a class="act" href="${esc(t.resultUrl)}" download>⬇</a>${t.type==='image' ? `<button class="act" data-edit="${esc(t.resultUrl)}">✏</button>` : ''}<button class="act" data-ref="${esc(t.resultUrl)}" data-type="${t.type}">📌</button><button class="act" data-regen="${t.id}">🔄</button><button class="act danger" data-del="${t.id}">🗑</button></div>`;
    } else if (t.status === 'failed' || t.status === 'timeout') {
      const cls=classifyErr(t.error);
      const retryTip = cls.category==='认证' ? '检查设置中的 API 密钥' : cls.category==='网络'||cls.category==='超时' ? '检查网络后点「刷新」或「重生成」' : '检查参数后重试';
      body = `<div class="err-banner"><strong>${esc(cls.category)}：${esc(t.error||'错误')}</strong><br><span>${esc(cls.hint)}</span><br><span style="font-size:10px;color:var(--text-dim)">建议：${esc(retryTip)}</span></div>${t.apiId ? `<div class="poll-actions"><button class="act" data-refresh="${t.id}">刷新</button></div>` : ''}<div class="actions"><button class="act" data-regen="${t.id}">🔄 重生成</button><button class="act danger" data-del="${t.id}">🗑 删除</button></div>`;
    }
    return `<div class="card" data-id="${t.id}"><div class="card-top"><span class="card-model">${esc(t.modelName)}</span><span class="pill ${sc}">${st}</span></div><div class="card-prompt">${esc(prompt)}</div><div class="card-body">${body}</div></div>`;
  },

  bindCardEvents() {
    $$('.copy').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const ok=await copy(b.dataset.url); Toast[ok?'success':'error'](ok?'已复制':'复制失败，请长按手动复制'); });
    $$('[data-copy]').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const ok=await copy(b.dataset.copy); Toast[ok?'success':'error'](ok?'已复制':'复制失败'); });
    $$('[data-preview]').forEach(img=>img.onclick=e=>{ e.stopPropagation(); this.openLightbox(img.dataset.preview); });
    $$('[data-refresh]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); void poller.refresh(b.dataset.refresh); });
    $$('[data-stop]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); poller.stop(b.dataset.stop); const now=Date.now(); const t=Store.getTasks().find(x=>x.id===b.dataset.stop); Store.updateTask(b.dataset.stop,{status:'stopped',error:'已停止',endTime:now}); if(t) Store.updateHistory(t.historyId,{status:'stopped',error:'已停止',endTime:now}); this.renderResults(); });
    $$('[data-edit]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); void this.openEditor(b.dataset.edit); });
    $$('[data-ref]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); this.useAsRef(b.dataset.ref,b.dataset.type); });

    $$('[data-del]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); this.confirmDeleteTask(b.dataset.del); });
    $$('.card').forEach(card=>this.bindLongPress(card));
  },

  bindLongPress(card) {
    if(card.dataset.longpressBound) return; card.dataset.longpressBound='1';
    let timer=null,startX=0,startY=0,fired=false;
    const cancel=()=>{ if(timer){clearTimeout(timer);timer=null;} };
    card.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse' && e.button!==0) return; if(e.target.closest('button,a,input,textarea,select,video,audio')) return; startX=e.clientX;startY=e.clientY;fired=false; timer=setTimeout(()=>{ fired=true; this.openCardActions(card.dataset.id); },520); },{passive:true});
    card.addEventListener('pointermove',e=>{ if(Math.hypot(e.clientX-startX,e.clientY-startY)>12) cancel(); },{passive:true});
    card.addEventListener('pointerup',cancel,{passive:true}); card.addEventListener('pointercancel',cancel,{passive:true}); card.addEventListener('contextmenu',e=>{ e.preventDefault(); this.openCardActions(card.dataset.id); });
  },

  async confirmDeleteTask(id) {
    const t=Store.getTasks().find(x=>x.id===id); if(!t) return;
    const ok=window.confirm('删除这条任务记录？'); if(!ok) return;
    poller.stop(id); Store.delTask(id); this.renderResults(); Toast.success('已删除');
  },

  openCardActions(id) {

    if(url && t.type==='image') actions.push(['编辑',()=>this.openEditor(url)]);

  },

  async downloadResult(url,type) {

    try{
      const r=await Api.request(url,{method:'GET'},Math.min(CONFIG.REQUEST_TIMEOUT,15000)); if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const blob=await r.blob(); const objectUrl=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=objectUrl; a.download=`ai-result-${Date.now()}.${type==='image'?'png':type==='video'?'mp4':'mp3'}`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(objectUrl),1000); Toast.success('已开始下载');
    }catch{ const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.download=''; document.body.appendChild(a); a.click(); a.remove(); Toast.info('已打开结果链接；部分浏览器会在新标签页保存'); }

  openLightbox(url) { if(!url) return; const lb=$('#mediaLightbox'); $('#lightboxImage').src=url; $('#lightboxImage').style.display=''; $('#lightboxVideo').style.display='none'; $('#lightboxVideo').pause(); lb.classList.add('show'); lb.setAttribute('aria-hidden','false'); },
  openVideoLightbox(url) { if(!url) return; const lb=$('#mediaLightbox'); const vid=$('#lightboxVideo'); $('#lightboxImage').style.display='none'; vid.style.display=''; vid.src=url; lb.classList.add('show'); lb.setAttribute('aria-hidden','false'); try{ vid.play().catch(()=>{}); }catch(e){} },
  closeLightbox() { const b=$('#mediaLightbox'); if(!b) return; b.classList.remove('show'); b.setAttribute('aria-hidden','true'); $('#lightboxImage').removeAttribute('src'); const vid=$('#lightboxVideo'); try{ vid.pause(); vid.removeAttribute('src'); vid.load(); }catch(e){} },

  updateTimer(id, elapsed, st) {
    const card = $(`.card[data-id="${id}"]`); if (!card) return;
    const timer = card.querySelector('.timer');
    if (timer) { const phase=poller.getPhase(elapsed)?.name||''; const interval=(poller.getPhase(elapsed)?.interval||3000)/1000; const net=st.netFails>0?` · 网络失败 ${st.netFails}/${CONFIG.POLL_FAIL_LIMIT}`:''; const req=st.requestError==='REQUEST_TIMEOUT'?' · 请求超时，自动重试':st.requestError==='NETWORK_OR_CORS'?' · 网络异常，自动重试':''; timer.innerHTML=`<span class="dot"></span>${fmtDur(elapsed)} · ${esc(phase)} ${interval}s${net}${req}`; }
  },

  // ============ 参数模版（MD 中转） ============
  buildParamTemplate(task) {
    let model, body, tab, resultUrl='';
    if (task) { model=MODELS[task.tab]?.find(m=>m.id===task.modelId); body=task.params||{}; tab=task.tab; resultUrl=task.resultUrl||''; }
    else { model=this.currentModel; body=this.collectParamsSync(); tab=this.currentTab; }
    if (!model) return '';
    const typeText = tab==='image'?'图片':tab==='video'?'视频':'音频';
    const promptVal = body.prompt || body.text || '';
    const imageRefs=[];
    const videoRefs=[];
    model.params.forEach(p=>{
      if(p.type==='ref-image'){ const v=body[p.key]; const arr=Array.isArray(v)?v:String(v||'').split(',').map(x=>x.trim()).filter(Boolean); arr.forEach(u=>{if(/^https?:\/\//i.test(u)) imageRefs.push(u);}); }
      if(p.type==='ref-video'){ const v=body[p.key]; const arr=Array.isArray(v)?v:String(v||'').split(',').map(x=>x.trim()).filter(Boolean); arr.forEach(u=>{if(/^https?:\/\//i.test(u)) videoRefs.push(u);}); }
    });
    const lines=['# 速创参数模板 v1',`模型: ${model.name||model.id}`,`类型: ${typeText}`,`提示词: ${promptVal}`,`参考图片: ${imageRefs.length?imageRefs.join('\n'):'无'}`];
    if(videoRefs.length) lines.push(`参考视频: ${videoRefs.join('\n')}`);
    if(resultUrl) lines.push(`结果图片/视频/音频: ${resultUrl}`);
    lines.push('其他参数:');
    model.params.forEach(p=>{
      if(['prompt','text','ref-image','ref-video'].includes(p.key)) return;
      const v=body[p.key]; if(v==null||v===''||(Array.isArray(v)&&!v.length)) return;
      lines.push(`${p.label||p.key}: ${Array.isArray(v)?v.join(', '):String(v)}`);
    });
    lines.push('# 可由其他 AI 优化“提示词”；如修改图片/视频网址或参数，请保留字段名称。', '# END');
    return lines.join('\n');
  },
  async copyParamTemplate(task) {
    const md = this.buildParamTemplate(task);
    if (!md) { Toast.error('当前无可复制的参数'); return; }
    try {
      await navigator.clipboard.writeText(md);
      Toast.success('参数模版已复制');
    } catch (e) {
      Toast.error('复制失败：' + e.message);
    }
  },
  parseParamTemplate(md) {
    const text=String(md||'').replace(/\r/g,'').trim();
    if(!/^#\s*速创参数模板\s+v1\b/i.test(text)) return null;
    if(!/\n#\s*END\s*$/i.test(text)) return null;
    const block=text.replace(/\n#\s*END\s*$/i,'').split('\n');
    const result={model:null,type:null,prompt:'',imageRefs:[],videoRefs:[],fields:{}};
    let section='';
    block.forEach(line=>{
      const m=line.match(/^([^:：]+)[:：]\s*(.*)$/);
      if(m){
        const key=m[1].trim(),val=m[2].trim();
        if(key==='模型'){result.model=val;section='';return;}
        if(key==='类型'){result.type=val;section='';return;}
        if(key==='提示词'){result.prompt=val;section='';return;}
        if(key==='参考图片'){section='images';if(val&&val!=='无'&&/^https?:\/\//i.test(val))result.imageRefs.push(val);return;}
        if(key==='参考视频'){section='videos';if(val&&val!=='无'&&/^https?:\/\//i.test(val))result.videoRefs.push(val);return;}
        if(key==='结果图片/视频/音频'){section='';return;}
        if(key==='其他参数'){section='fields';return;}
        if(section==='fields') result.fields[key]=val;
        return;
      }
      const v=line.trim();
      if(/^https?:\/\//i.test(v)){if(section==='images')result.imageRefs.push(v);else if(section==='videos')result.videoRefs.push(v);}
    });
    return result;
  },
  applyParamTemplate(md) {
    const parsed=this.parseParamTemplate(md);
    if(!parsed){Toast.error('参数模板格式不正确');return false;}
    if(parsed.model){const target=MODELS[this.currentTab]?.find(m=>m.name===parsed.model||m.id===parsed.model);if(target&&target.id!==this.currentModel?.id){$('#modelSelect').value=target.id;$('#modelSelect').dispatchEvent(new Event('change',{bubbles:true}));}}
    const model=this.currentModel;if(!model)return false;
    const pp=model.params.find(p=>p.key==='prompt'||p.key==='text');
    if(pp){const ta=$(`#paramForm .form-group[data-key="${CSS.escape(pp.key)}"] textarea`);if(ta){ta.value=parsed.prompt||'';ta.dispatchEvent(new Event('input',{bubbles:true}));}}
    const imageParam=model.params.find(p=>p.type==='ref-image');
    if(imageParam){this.refState[this.currentModelKey][imageParam.key]=[];parsed.imageRefs.forEach(u=>this.addUrlRef(u,imageParam.key));}
    const videoParam=model.params.find(p=>p.type==='ref-video');
    if(videoParam){this.refState[this.currentModelKey][videoParam.key]=[];parsed.videoRefs.forEach(u=>this.addUrlRef(u,videoParam.key));}
    let filled=parsed.prompt?1:0;
    Object.entries(parsed.fields).forEach(([label,val])=>{const p=model.params.find(x=>x.label===label||x.key===label);if(!p)return;const grp=$(`#paramForm .form-group[data-key="${CSS.escape(p.key)}"]`);if(!grp)return;const el=this.getParamElement(grp,p);if(!el)return;el.value=val;el.dispatchEvent(new Event('input',{bubbles:true}));filled++;});
    this.updateEstimate();Toast.success(`已载入 ${filled} 项`);return true;
  },
  _snapshotForm() {
    const snap = { prompt: '', refs: {}, fields: {}, modelKey: this.currentRefKey };
    const promptEl = $('#paramForm textarea[data-key="prompt"]') || $('#paramForm textarea[data-key="text"]');
    if (promptEl) snap.prompt = promptEl.value;
    if (this.refState[this.currentRefKey]) {
      Object.entries(this.refState[this.currentRefKey]).forEach(([k, refs]) => {
        if (refs && refs.length > 0) snap.refs[k] = refs.map(r => ({...r}));
      });
    }
    $$('#paramForm input[data-key], #paramForm select[data-key], #paramForm textarea[data-key]').forEach(el => {
      if (el.dataset.key === 'prompt' || el.dataset.key === 'text') return;
      snap.fields[el.dataset.key] = el.value;
    });
    return snap;
  },
  _restoreFormSnapshot(snap) {
    if (!snap) return;
    setTimeout(() => {
      const promptEl = $('#paramForm textarea[data-key="prompt"]') || $('#paramForm textarea[data-key="text"]');
      if (promptEl) promptEl.value = snap.prompt;
      if (this.refState[this.currentRefKey]) {
        Object.entries(snap.refs).forEach(([k, refs]) => {
          this.refState[this.currentRefKey][k] = refs.map(r => ({...r}));
          this.refreshRefGrid(k);
        });
      }
      Object.entries(snap.fields).forEach(([k, v]) => {
        const el = $(`#paramForm [data-key="${CSS.escape(k)}"]`);
        if (el) el.value = v;
      });
      this.updateEstimate();

  undoTemplateFill() {
    if (!this._formUndoStack || this._formUndoStack.length === 0) {
      Toast.warning('没有可撤销的回填'); return;
    }
    const last = this._formUndoStack.pop();
    if (Date.now() - last.ts > 5 * 60 * 1000) {
      Toast.warning('撤销已过期'); return;
    }
    this._restoreFormSnapshot(last.snapshot);

  _showUndoBtn() {

      btn.style.cssText = 'position:fixed;bottom:80px;right:16px;z-index:200;background:var(--warning);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);display:none;font-size:13px;border:none;cursor:pointer;';

  useAsRef(url,type) {

      if(refParam){ this.getRefs(refParam.key).push({id:'r_'+genId(),kind:'url',src:url,name:'结果图',uploaded:true,remote:url}); this.refreshRefGrid(refParam.key); Toast.success('已添加参考图'); } else Toast.warning('当前图片模型不支持参考图');
    } else if(type==='video'){
      if(this.tab!=='video') this.switchTab('video');

      const refVideoParam=this.model?.params.find(p=>p.type==='ref-video');
      if(refVideoParam){ this.getRefs(refVideoParam.key).push({id:'r_'+genId(),kind:'url-video',src:url,name:'结果视频',uploaded:true,remote:url,mediaType:'video',meta:{}}); this.refreshRefGrid(refVideoParam.key); Toast.success('已添加参考视频'); }
      else { const p=this.model?.params.find(x=>{ const k=x.key.toLowerCase(); return x.type==='url' && /(audio|video)_?url/.test(k); }) || this.model?.params.find(x=>x.type==='url') || this.model?.params.find(x=>x.type==='text'); if(p){ const g=$(`.form-group[data-key="${CSS.escape(p.key)}"]`); const inp=g?.querySelector('input,textarea'); if(inp){ inp.value=String(inp.value||'').trim()?String(inp.value).trim()+','+url:url; inp.dispatchEvent(new Event('input',{bubbles:true})); Toast.success('已填入引用链接'); } } else Toast.warning('当前模型没有可用的 URL 参数'); }
    } else {

  // ===== 预设 =====
  // 内置预设与我的预设共用一个选择器；内置只负责 prompt 前缀，用户输入始终保留。
  renderPresets() {
    const sel = $('#presetSelect'); if (!sel) return;
    const custom = Store.getPresets();
    sel.innerHTML = '<option value="">预设…</option>';
    const builtinMap = { image: PROMPT_PRESETS, video: VIDEO_PROMPT_PRESETS, audio: AUDIO_PROMPT_PRESETS };
    const builtins = builtinMap[this.tab] || [];
    if (builtins.length) {

      builtins.forEach(p => { const o=document.createElement('option'); o.value='builtin:'+p.id; o.textContent=p.name; og.appendChild(o); });

    }

      const og=document.createElement('optgroup'); og.label='我的预设';

  applyUnifiedPreset(value) {
    if (!value) return;
    if (value.startsWith('builtin:')) this.applyBuiltinPreset(value.slice(8));

  applyBuiltinPreset(id) {
    const builtinMap = { image: PROMPT_PRESETS, video: VIDEO_PROMPT_PRESETS, audio: AUDIO_PROMPT_PRESETS };
    const presetList = builtinMap[this.tab] || PROMPT_PRESETS;
    const preset = presetList.find(x=>x.id===id) || presetList[0];
    const promptKey = this.model?.params.find(p=>p.key==='prompt')?.key;
    const ta = promptKey ? $(`textarea[data-key="${CSS.escape(promptKey)}"]`) : null;
    if (!ta) { Toast.warning('当前模型无提示词'); return; }
    const key=this.tab+'/'+this.model.id;
    const prevBase=this.promptPresetBase[key]||'';
    let tail=this.readFieldValue(ta);
    if(prevBase && tail.startsWith(prevBase)) tail=tail.slice(prevBase.length).trimStart();
    ta.value = preset.prompt ? (tail ? preset.prompt+'\n'+tail : preset.prompt) : tail;
    this.promptPresetBase[key]=preset.prompt||'';
    this.promptPresetName[key]=preset.id==='none'?'':preset.name;
    ta.dispatchEvent(new Event('input',{bubbles:true}));
    this.updateEstimate();
    Toast.success(preset.id==='none'?'已取消预设':`已套用：${preset.name}`);

      else { const el=g.querySelector('input,textarea,select'); if(el){ el.value=Array.isArray(v)?v.join(','):v; el.dispatchEvent(new Event('input',{bubbles:true})); } }
    });
    const key=this.tab+'/'+this.model.id;
    this.promptPresetBase[key]='';
    this.promptPresetName[key]='';
    this.updateEstimate();
    $('#presetSelect').value = '';
    Toast.success('已载入');
  },

  showStats() {
    const all = Store.getHistory(); const now = Date.now();
    const ranges = [{ id:'today', label:'今天', start: new Date().setHours(0,0,0,0) }, { id:'week', label:'本周', start: now-7*86400000 }, { id:'all', label:'全部', start: 0 }];
    const stats = ranges.map(r => {
      const items = all.filter(h => h.createdAt >= r.start);
      let cost = 0, success = 0, fail = 0;
      const byModel = {};
      items.forEach(h => {
        const m = MODELS[h.tab]?.find(x => x.id === h.modelId);

      });
      const modelList = Object.entries(byModel).map(([n,d])=>({name:n,...d})).sort((a,b)=>b.cost-a.cost);

      </div>`;
    $('#modalFooter').innerHTML = `<button class="act" id="modalClose">关闭</button>`;
    $('#modalClose').onclick = () => $('#modal').classList.remove('show');
    $$('.srb').forEach(b => b.onclick = () => {
      $$('.srb').forEach(x => x.classList.remove('active')); b.classList.add('active');
      const s = stats.find(x => x.id === b.dataset.range);
      const maxM2 = s.modelList[0]?.cost || 0;
      $('#statsContent').innerHTML = `<div class="ssum"><div class="sc sc-main"><div class="sl">总消费</div><div class="sv">¥${fmt(s.cost)}</div></div><div class="sc"><div class="sl">任务</div><div class="svs">${s.total}</div></div><div class="sc"><div class="sl">成功</div><div class="svs" style="color:var(--success)">${s.success}</div></div><div class="sc"><div class="sl">失败</div><div class="svs" style="color:var(--danger)">${s.fail}</div></div></div><div class="ssec"><div class="sst">按模型</div>${s.modelList.slice(0,8).map(m => `<div class="sbr"><div class="sbl">${esc(m.name)} <span style="color:var(--text-dim);font-size:10px">${m.count}次</span></div><div class="sbb"><div class="sbf" style="width:${maxM2>0?m.cost/maxM2*100:0}%"></div></div><div class="sbc">¥${fmt(m.cost)}</div></div>`).join('') || '<div style="color:var(--text-dim);font-size:12px">暂无数据</div>'}</div>`;

  // ===== 编辑器 =====
  editor: {
    canvas:null, ctx:null, bg:null, bgCtx:null, img:null, imgClean:false, origSrc:null,
    tool:'rect', color:'255,0,0', opacity:.5, brushSize:30, expandSize:256, feather:8,
    isDrawing:false, startX:0, startY:0, undoStack:[], rectPreview:null, strokeSnapshot:null,
    maskOps:[], currentBrush:null, dirty:false
  },

  openEditor(url) {
    if(!url){ Toast.error('图片 URL 为空'); return; }
    $('#editor').classList.add('show');
    $('#canvasHint').textContent='加载图片…'; $('#canvasHint').classList.remove('hide');
    const promptEl=$('#editorPrompt'); if(promptEl) promptEl.value='';
    this.editor.isDrawing=false; this.editor.undoStack=[]; this.editor.maskOps=[]; this.editor.currentBrush=null; this.editor.rectPreview=null; this.editor.strokeSnapshot=null;
    $$('.dir-btn').forEach(b=>b.classList.remove('active')); $('#outpaintDirections .dir-btn[data-dir="top"]')?.classList.add('active');
    const loadImage=(src,crossOrigin=false)=>new Promise((resolve,reject)=>{
      const img=new Image(); if(crossOrigin) img.crossOrigin='anonymous';
      img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('IMAGE_LOAD_FAILED')); img.src=src;
    });
    (async()=>{
      try{
        const img=await loadImage(url,false);
        this.editor.img=img; this.editor.origSrc=url; this.editor.imgClean=false;
        this.initEditorCanvas(); $('#canvasHint').classList.add('hide');
      }catch{
        try{
          const proxyUrl='https://images.weserv.nl/?url='+encodeURIComponent(url.replace(/^https?:\/\//,''));
          const img=await loadImage(proxyUrl,true);
          this.editor.img=img; this.editor.origSrc=url; this.editor.imgClean=true;
          this.initEditorCanvas(); $('#canvasHint').classList.add('hide');
        }catch{
          $('#canvasHint').textContent='图片加载失败，请先使用公开可访问的图片地址';
          Toast.error('编辑器无法读取此图片');
        }
      }
    })();
  },

  initEditorCanvas() {
    const canvas=$('#maskCanvas'), ctx=canvas.getContext('2d');
    const bgCanvas=$('#bgCanvas'), bgCtx=bgCanvas.getContext('2d');
    const img=this.editor.img; if(!img) return;
    const MAX=1024; let w=img.naturalWidth, h=img.naturalHeight;
    if(w>MAX || h>MAX){ const r=Math.min(MAX/w,MAX/h); w=Math.round(w*r); h=Math.round(h*r); }
    canvas.width=w; canvas.height=h; bgCanvas.width=w; bgCanvas.height=h;
    bgCtx.clearRect(0,0,w,h); bgCtx.drawImage(img,0,0,w,h);
    ctx.clearRect(0,0,w,h); ctx.globalCompositeOperation='source-over';
    this.editor.canvas=canvas; this.editor.ctx=ctx; this.editor.bg=bgCanvas; this.editor.bgCtx=bgCtx;
    this.editor.undoStack=[]; this.editor.maskOps=[]; this.pushUndo(); this.bindEditorEvents();
    this.updateEditorToolUI();
  },

  updateEditorToolUI(){
    const bg=$('#brushSizeGroup'); if(bg){ const need=this.editor.tool==='brush'||this.editor.tool==='eraser'; bg.style.opacity=need?'1':'0.4'; bg.style.pointerEvents=need?'auto':'none'; }
    const op=$('#outpaintCtrl'); if(op) op.style.display=this.editor.tool==='outpaint'?'flex':'none';
    const c=$('#maskCanvas'); if(c) c.className=`tool-${this.editor.tool}`;
  },

  bindEditorEvents() {
    $('#editorCloseBtn').onclick=()=>this.closeEditor();
    $$('.tb[data-tool]').forEach(b=>b.onclick=()=>{
      $$('.tb[data-tool]').forEach(x=>x.classList.remove('active')); b.classList.add('active');
      this.editor.tool=b.dataset.tool; this.editor.isDrawing=false; this.editor.currentBrush=null; this.updateEditorToolUI();
    });
    $$('.sb[data-size]').forEach(b=>b.onclick=()=>{
      $$('.sb[data-size]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); this.editor.brushSize=+b.dataset.size;
    });
    $$('.cb').forEach(b=>b.onclick=()=>{
      $$('.cb').forEach(x=>x.classList.remove('active')); b.classList.add('active'); this.editor.color=b.dataset.color;
    });
    const op=$('#opacitySlider'); if(op) op.oninput=e=>{this.editor.opacity=+e.target.value/100; $('#opacityValue').textContent=e.target.value+'%';};
    const fs=$('#featherSlider'); if(fs) fs.oninput=e=>{this.editor.feather=+e.target.value; $('#featherValue').textContent=e.target.value+'px';};
    $$('.dir-btn[data-dir]').forEach(b=>b.onclick=()=>{ b.classList.toggle('active'); });
    $$('.sb[data-expand]').forEach(b=>b.onclick=()=>{$$('.sb[data-expand]').forEach(x=>x.classList.remove('active'));b.classList.add('active');this.editor.expandSize=+b.dataset.expand;});
    $('#applyOutpaintBtn').onclick=()=>this.applyOutpaint();
    $('#undoBtn').onclick=()=>this.undoEditor();
    $('#clearBtn').onclick=()=>this.clearEditor();
    $('#editorConfirmBtn').onclick=()=>this.confirmEditor();

  });

  // Decorate form rendering without touching the core API collection path.
  const oldRenderForm=UI.renderForm.bind(UI);
  UI.renderForm=function(mid){ const r=oldRenderForm(mid); setTimeout(addPromptTools,0); setTimeout(updateRefStatus,0); return r; };
  function updateRefStatus(){

    form.querySelectorAll('.ref-wrap').forEach(w=>{
      const key=w.dataset.key||''; const refs=UI.getRefs(key)||[]; const pending=refs.filter(r=>!r.uploaded).length;
      let bar=w.querySelector('.ref-status-bar'); if(!bar){bar=document.createElement('div');bar.className='ref-status-bar';w.appendChild(bar);}
      bar.innerHTML=`<span>素材 ${refs.length}</span><span class="${pending?'pending':'ready'}">${pending?pending+' 张待上传':'已就绪'}</span>`;
    });
  }
  const oldRefresh=UI.refreshRefGrid?.bind(UI);
  if(oldRefresh){UI.refreshRefGrid=function(){const r=oldRefresh(...arguments);setTimeout(updateRefStatus,0);return r;};}

  // Result history quick actions: reuse/copy parameters are intentionally compact.
  const oldShowHistory=UI.showHistory.bind(UI);
  UI.showHistory=function(){ const r=oldShowHistory(); setTimeout(()=>{
    $$('#modalBody [data-hid]').forEach(row=>{

    });
  },0); return r; };

  // Stats decoration: mobile keeps the compact no-QR payment UI.
  const oldShowStats=UI.showStats.bind(UI);
  UI.showStats=function(){ const r=oldShowStats(); setTimeout(()=>{
    const body=qi('#modalBody'); if(!body || body.querySelector('#mobileEnergyCard'))return;
    const el=document.createElement('div'); el.id='mobileEnergyCard'; el.className='energy-mobile-card'; el.innerHTML='<div class="ei">⚡</div><div class="ec"><div class="et">补充能量</div><div class="es">支持微信</div></div><button class="ep" id="mobileWechatPay">微信支付</button>';
    const sc=body.querySelector('#statsContent'); (sc||body).appendChild(el);
  },0); return r; };

  // Editor quick controls and mask preview overlay.
  const oldInitEditor=UI.initEditorCanvas.bind(UI);
  UI.initEditorCanvas=function(){ const r=oldInitEditor(); setTimeout(()=>{
    const tools=qi('#editorTools'); if(!tools)return;
    if(!qi('#editorQuickDirs')){const d=document.createElement('div');d.id='editorQuickDirs';d.className='editor-quickdirs';d.innerHTML='<span style="font-size:10px;color:var(--text-dim);margin-right:2px">扩图</span><button data-ed-dir="dirTop">↑</button><button data-ed-dir="dirLeft">←</button><button data-ed-dir="dirBottom">↓</button><button data-ed-dir="dirRight">→</button>';tools.insertAdjacentElement('afterend',d);}
    if(!qi('#maskPreviewRow')){const row=document.createElement('div');row.id='maskPreviewRow';row.className='mask-preview-row';row.innerHTML='<span>蒙版预览</span><label style="display:flex;align-items:center;gap:5px"><input id="mobileMaskPreview" type="checkbox" style="width:16px;height:16px;padding:0"> 显示</label>'; const body=qi('.editor-body'); if(body) body.insertBefore(row,body.querySelector('#editorPrompt')||null); const cb=qi('#mobileMaskPreview'); cb?.addEventListener('change',()=>{const c=qi('#maskCanvas'); if(c)c.style.opacity=cb.checked?'0.75':'0';});}
  },0); return r; };

  setInterval(()=>{updateTaskDock();},1000);
  window.addEventListener('focus',()=>{updateTaskDock();UI.renderResults();});
})();



/* ========== V10 精简稳定性收口：只修实际问题，不新增复杂产品层 ========== */
(function installLeanHardening(){
  if (window.__LEAN_HARDENING_V10__) return;
  window.__LEAN_HARDENING_V10__ = true;

  const jsonNormalize = (payload) => {
    if (!payload || typeof payload !== 'object') return payload;
    if (typeof payload.data === 'string') {
      const raw = payload.data.trim();
      if (raw && (raw.startsWith('{') || raw.startsWith('['))) {
        try { return { ...payload, data: JSON.parse(raw) }; } catch (_) {}
      }
    }
    return payload;
  };

  const readApiError = (payload, prefix='API') => {
    const p = jsonNormalize(payload);
    if (p?.code != null && Number(p.code) !== 200) {
      const e = new Error(`${prefix}_${p.code}:${p.msg || ''}`);
      e.apiCode = Number(p.code);
      e.apiMsg = p.msg || '';
      return e;
    }
    return null;
  };

  // 统一异步提交：HTTP、429、API code、data:string 一次处理。
  if (window.Api && typeof Api.submit === 'function') {
    Api.submit = async function(endpoint, body) {
      const key = (window.Store?.getApiKey ? Store.getApiKey() : '');
      if (!key) throw new Error('NO_API_KEY');
      let r;
      try {
        r = await this.fetchWithTimeout(CONFIG.API_BASE + endpoint, {
          method:'POST',
          headers:{ Authorization:key, 'Content-Type':'application/json' },
          body:JSON.stringify(body)
        });
      } catch (e) {
        if (e?.message === 'REQUEST_TIMEOUT') throw e;
        throw new Error('NETWORK_OR_CORS');
      }
      if (r.status === 429) {
        const e = new Error('RATE_LIMITED');
        e.retryAfter = parseInt(r.headers.get('Retry-After') || '0', 10) || 0;
        throw e;
      }
      if (!r.ok) throw new Error(`HTTP_${r.status}`);
      let payload;
      try { payload = jsonNormalize(await r.json()); }
      catch { throw new Error('INVALID_JSON'); }
      const apiErr = readApiError(payload, 'API');
      if (apiErr) throw apiErr;
      return payload;
    };
  }

  // 同步接口与异步接口使用完全一致的错误语义。
  if (window.Api && typeof Api.syncCall === 'function') {
    Api.syncCall = async function(endpoint, body) {
      const key = (window.Store?.getApiKey ? Store.getApiKey() : '');
      if (!key) throw new Error('NO_API_KEY');
      let r;
      try {
        r = await this.fetchWithTimeout(CONFIG.API_BASE + endpoint, {
          method:'POST',
          headers:{ Authorization:key, 'Content-Type':'application/json' },
          body:JSON.stringify(body)
        });
      } catch (e) {
        if (e?.message === 'REQUEST_TIMEOUT') throw e;
        throw new Error('NETWORK_OR_CORS');
      }
      if (r.status === 429) {
        const e = new Error('RATE_LIMITED');
        e.retryAfter = parseInt(r.headers.get('Retry-After') || '0', 10) || 0;
        throw e;
      }
      if (!r.ok) throw new Error(`HTTP_${r.status}`);
      let payload;
      try { payload = jsonNormalize(await r.json()); }
      catch { throw new Error('INVALID_JSON'); }
      const apiErr = readApiError(payload, 'API');
      if (apiErr) throw apiErr;
      return payload;
    };
  }

  // 查询接口统一兼容 data:string，并保留限流与 API 错误码。
  if (window.Api && typeof Api.queryDetail === 'function') {
    Api.queryDetail = async function(id) {
      const key = (window.Store?.getApiKey ? Store.getApiKey() : '');
      if (!key) throw new Error('NO_API_KEY');
      let r;
      try {
        r = await this.fetchWithTimeout(
          `${CONFIG.API_BASE}${CONFIG.DETAIL_PATH}?id=${encodeURIComponent(id)}`,
          { method:'GET', headers:{Authorization:key,'Content-Type':'application/json'}, cache:'no-store' }
        );
      } catch (e) {
        if (e?.message === 'REQUEST_TIMEOUT') throw e;
        throw new Error('NETWORK_OR_CORS');
      }
      if (r.status === 429) {
        const e = new Error('RATE_LIMITED');
        e.retryAfter = parseInt(r.headers.get('Retry-After') || '0', 10) || 0;
        throw e;
      }
      if (!r.ok) throw new Error(`QUERY_HTTP_${r.status}`);
      let payload;
      try { payload = jsonNormalize(await r.json()); }
      catch { throw new Error('INVALID_JSON'); }
      const apiErr = readApiError(payload, 'QUERY_API');
      if (apiErr) throw apiErr;
      return payload;
    };
  }

  // 移动端“刷新”按钮真正查询运行任务，而不是仅重绘页面。
  if (typeof poller !== 'undefined' && poller && typeof poller.refresh === 'function') {
    const btn = document.getElementById('mobileTaskRefresh');
    if (btn && !btn.dataset.queryBound) {
      btn.dataset.queryBound = '1';
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const running = Store.getTasks().filter(t => t.status === 'running' && t.apiId);
        if (!running.length) { Toast.info('当前没有运行中的任务'); return; }
        btn.disabled = true;
        const old = btn.textContent;
        btn.textContent = '查询中…';
        try { await Promise.allSettled(running.map(t => poller.refresh(t.id))); }
        finally { btn.disabled = false; btn.textContent = old; UI.renderResults(); }
      }, true);
    }
  }

  // 移动端历史“再用参数”：真正恢复当时的模型与字段，不依赖不存在的旧扩展方法。
  if (window.UI && !UI.reuseHistoryParams) {
    UI.reuseHistoryParams = function(h) {
      if (!h) return;
      const tab = h.tab || (h.type === 'image' ? 'image' : h.type === 'video' ? 'video' : 'audio');
      if (typeof this.switchTab === 'function') this.switchTab(tab);
      if (h.modelId && typeof this.renderForm === 'function') this.renderForm(h.modelId);
      const model = this.model || this.currentModel;
      const params = h.params || {};
      const form = document.getElementById('paramForm');
      if (!form || !model?.params) return;
      for (const p of model.params) {
        if (!(p.key in params)) continue;
        const g = form.querySelector(`.form-group[data-key="${CSS.escape(p.key)}"]`);
        if (!g) continue;
        const v = params[p.key];
        if (p.type === 'ref-image') {
          const refs = Array.isArray(v) ? v : String(v || '').split(',').map(s=>s.trim()).filter(Boolean);
          if (typeof this.setRefs === 'function') {
            this.setRefs(p.key, refs.map(u => typeof u === 'object' ? u : ({id:'r_'+Math.random().toString(36).slice(2),kind:'url',src:u,uploaded:true,remote:u,name:'历史参考'})));
            this.refreshRefGrid?.(p.key);
          }
        } else if (p.type === 'range') {
          const el = g.querySelector(`[data-key="${CSS.escape(p.key)}"]`);
          if (el) { el.value = v; el.dispatchEvent(new Event('input',{bubbles:true})); }
        } else {
          const el = g.querySelector(`[data-key="${CSS.escape(p.key)}"]`);
          if (el) { el.value = Array.isArray(v) ? v.join(',') : String(v ?? ''); el.dispatchEvent(new Event('input',{bubbles:true})); }
        }
      }
      this.updateEstimate?.();
    };
  }

  // 移动端 Prompt 工具同时支持 prompt / text（例如 TTS）。
  const mobilePromptHost = document.getElementById('mobilePromptTools');
  if (mobilePromptHost && typeof window.addPromptTools === 'function') {
    // 保持已有函数，不重复绑定事件；这里只标记可扩展入口。
    mobilePromptHost.dataset.hardened = '1';
  }

  // 所有上传参考素材至少在最终提交前再次检查公网 URL，避免 blob/file 直接进入 API。
  if (window.normalizeAndValidateApiBody && !window.__hardeningBodyCheck__) {
    window.__hardeningBodyCheck__ = true;
    const originalValidate = window.normalizeAndValidateApiBody;
    window.normalizeAndValidateApiBody = function(model, input) {
      const out = originalValidate(model, input);
      const body = out?.body || (input ? {...input} : {});
      const errors = Array.isArray(out?.errors) ? [...out.errors] : [];
      const urlKeys = ['urls','images','videos','audios','subjects','image_url','first_frame','last_frame','firstFrameUrl','lastFrameUrl','video_url','video','audio_url','audioUrl','videoUrl'];
      const values = key => Array.isArray(body[key]) ? body[key] : (typeof body[key] === 'string' && body[key].includes(',') ? body[key].split(',').map(s=>s.trim()).filter(Boolean) : [body[key]]);
      for (const key of urlKeys) {
        if (body[key] == null || body[key] === '') continue;
        for (const v of values(key)) {
          if (!v) continue;
          if (typeof v === 'string' && /^(blob:|data:|file:)/i.test(v)) {
            if (!errors.some(e=>String(e).includes(key))) errors.push(`${key} 必须是公网 URL`);
          }
        }
      }
      return { body, errors };
    };
  }
})();
