<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
<title>AI 多媒体工作台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{width:100%;height:100%;background:#070a13;color:#fff;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  .loading{display:flex;flex-direction:column;align-items:center;gap:16px;opacity:.8}
  .spinner{width:32px;height:32px;border:3px solid rgba(88,104,236,.2);border-top-color:#5868ec;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .text{font-size:13px;color:#9aa5c3}
  @media(prefers-color-scheme:light){html,body{background:#f5f6fb;color:#181c28}.text{color:#545c75}}
</style>
</head>
<body>
<div class="loading">
  <div class="spinner"></div>
  <div class="text">正在打开工作台…</div>
</div>
<script>location.replace("ai-workbench-dev.html");</script>
</body>
</html>
