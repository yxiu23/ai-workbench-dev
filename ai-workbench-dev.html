  /* ---------- BATCH GENERATION ---------- */
  _openBatchGenerate() {
    const promptTa = $('[data-key="prompt"], [data-key="text"]');
    const prompt = promptTa?.value?.trim() || '';
    if (!prompt) { Toast.warning('请先输入提示词'); promptTa?.focus(); return; }
    // Collect all models across tabs
    const allModels = [];
    ['image', 'video', 'audio'].forEach(tab => { MODELS[tab].forEach(m => allModels.push({ ...m, tab })); });
    const renderList = (filter = '') => {
      const f = filter.toLowerCase();
      const filtered = filter ? allModels.filter(m => m.name.toLowerCase().includes(f) || m.id.toLowerCase().includes(f) || m.desc?.toLowerCase().includes(f)) : allModels;
      return filtered.map(m => `<label class="batch-model-item" data-mid="${esc(m.id)}" data-tab="${esc(m.tab)}"><input type="checkbox" data-batch-mid="${esc(m.id)}" data-batch-tab="${esc(m.tab)}" style="width:auto;margin:0"><div class="bm-info"><div class="bm-name">${esc(m.name)} <span class="bm-type">${typeName(m.tab)}</span></div><div class="bm-desc">${esc(trunc(m.desc || '', 50))}</div><div class="bm-price">${esc(m.price)}</div></div></label>`).join('');
    };
    const html = `<div style="margin-bottom:10px;padding:10px;background:var(--brand-soft);border-radius:8px;font-size:12px;color:var(--text)"><strong>批量生成</strong>：使用当前提示词「${esc(trunc(prompt, 40))}」同时提交到多个模型。<br><span style="color:var(--text-dim)">勾选下方模型，点击「开始批量生成」。将使用各模型默认参数。</span></div><div class="history-search" style="padding:0 0 10px"><input type="text" id="batchSearchInput" placeholder="搜索模型..." style="font-size:13px"></div><div class="batch-model-list" style="max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">${renderList()}</div>`;
    this._showModal('批量生成', html, [
      { label: '全选', fn: () => { $$('#modalBody [data-batch-mid]').forEach(c => c.checked = true); } },
      { label: '清空', fn: () => { $$('#modalBody [data-batch-mid]').forEach(c => c.checked = false); } },
      { label: '开始生成', primary: true, fn: () => this._runBatchGenerate(prompt) },
      { label: '关闭', fn: () => this._closeModal() }
    ]);
    const searchInput = $('#batchSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', e => {
        const list = $('#modalBody .batch-model-list');
        if (list) list.innerHTML = renderList(e.target.value);
      });
    }
  },

  async _runBatchGenerate(prompt) {
    const checked = $$('#modalBody [data-batch-mid]:checked');
    if (!checked.length) { Toast.warning('请至少选择一个模型'); return; }
    const selected = Array.from(checked).map(c => ({ id: c.dataset.batchMid, tab: c.dataset.batchTab }));
    this._closeModal();
    Toast.info(`开始批量生成 ${selected.length} 个任务...`);
    let success = 0, fail = 0;
    for (const sel of selected) {
      const model = MODELS[sel.tab].find(m => m.id === sel.id);
      if (!model) continue;
      try {
        const body = {};
        for (const p of model.params) {
          if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') { body[p.key] = ''; }
          else if (p.key === 'prompt' || p.key === 'text') { body[p.key] = prompt; }
          else { body[p.key] = p.default ?? ''; }
        }
        const v = normalizeAndValidateApiBody(model, body);
        if (!v.ok) { fail++; Toast.error(`${model.name}: ${v.error}`); continue; }
        if (model.async) {
          const res = await Api.submit(model, v.body);
          const task = { id: genId(), model, body: v.body, prompt, status: 'processing', createdAt: Date.now(), apiId: res.id };
          const tasks = Store.getTasks(); tasks.unshift(task); Store.saveTasks(tasks);
          this._renderTask(task); this._renderActiveTasks();
          poller.start(task);
          success++;
        } else {
          const data = await Api.syncCall(model, v.body);
          const url = Api.extractUrl(data);
          const task = { id: genId(), model, body: v.body, prompt, status: 'succeeded', result: { url, data }, createdAt: Date.now(), completedAt: Date.now() };
          const cost = calcEstimate(model, v.body); task.cost = cost?.amount;
          Store.addHistory({ id: task.id, model: task.model, prompt, body: v.body, status: 'succeeded', result: task.result, createdAt: task.createdAt, completedAt: task.completedAt, cost: task.cost });
          this._renderTask(task); this._renderResultStrip();
          success++; this.playSuccessSound();
        }
      } catch (e) { fail++; Toast.error(`${model.name}: ${e.message}`); }
    }
    Toast[fail > 0 ? 'warning' : 'success'](`批量生成完成：成功 ${success}，失败 ${fail}`);
  },

  /* ---------- SETTINGS ---------- */
  _openSettings() {
    $('#apiKeyInput').value = Store.getApiKey();
    $('#r2WorkerUrlInput').value = Store.getR2WorkerUrl();
    $('#r2AuthTokenInput').value = Store.getR2AuthToken();
    $('#budgetInput').value = Store.getBudget() || '';
    $('#themeToggle').classList.toggle('on', Store.getTheme() === 'dark');
    $('#soundToggle').classList.toggle('on', Store.getSound());
    this._updateBudgetStatus();
    $('#settingsDrawer').classList.add('show');
    $('#settingsOverlay').classList.add('show');
  },

  _updateBudgetStatus() {
    const el = $('#budgetStatus');
    if (!el) return;
    const budget = Store.getBudget();
    const spent = Store.getTodaySpend();
    if (budget <= 0) { el.innerHTML = '当前未设置预算限制'; el.style.color = 'var(--text-dim)'; return; }
    const pct = (spent / budget * 100).toFixed(0);
    const remaining = budget - spent;
    const color = remaining < 0 ? 'var(--danger)' : remaining < budget * 0.2 ? 'var(--warning)' : 'var(--success)';
    const status = remaining < 0 ? `已超支 ¥${Math.abs(remaining).toFixed(2)}` : `剩余 ¥${remaining.toFixed(2)}`;
    el.innerHTML = `今日已消费 <strong style="color:${color}">¥${spent.toFixed(2)}</strong> / ¥${budget.toFixed(2)}（${pct}%）· ${status}`;
    el.style.color = 'var(--text-muted)';
  },

  _checkBudget() {
    const budget = Store.getBudget();
    if (budget <= 0) return true;
    const spent = Store.getTodaySpend();
    if (spent >= budget) {
      Toast.error(`已达每日预算上限（¥${budget.toFixed(2)}），已消费 ¥${spent.toFixed(2)}`);
      return false;
    }
    if (spent >= budget * 0.8) {
      Toast.warning(`今日消费已达预算 80%（¥${spent.toFixed(2)} / ¥${budget.toFixed(2)}）`);
    }
    return true;
  },

  _closeSettings() { $('#settingsDrawer').classList.remove('show'); $('#settingsOverlay').classList.remove('show'); },

  /* ---------- MODAL ---------- */
  _showModal(title, bodyHtml, footerButtons) {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = bodyHtml;
    const footer = $('#modalFooter');
    footer.innerHTML = '';
    if (footerButtons && footerButtons.length) {
      footer.style.display = 'flex';
      footerButtons.forEach(b => { const btn = document.createElement('button'); btn.textContent = b.label; btn.className = b.primary ? 'btn-primary' : 'btn-secondary'; btn.addEventListener('click', b.fn); footer.appendChild(btn); });
    } else footer.style.display = 'none';
    $('#modalOverlay').classList.add('show');
  },

  _closeModal() { $('#modalOverlay').classList.remove('show'); },

  /* ---------- FORM CACHE ---------- */
  _saveFormToCache() {
    if (!this.state.model) return;
    const cache = {};
    const ta = $('[data-key="prompt"], [data-key="text"]');
    if (ta) cache[ta.dataset.key] = ta.value;
    for (const p of this.state.model.params) {
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') { cache[p.key] = JSON.parse(JSON.stringify(this._getRefs(p.key))); }
      else { const el = $(`[data-key="${p.key}"]`); if (el) cache[p.key] = el.value; }
    }
    this.state.formCache[this.state.modelKey] = cache;
  },

  _restoreFormFromCache() {
    const cache = this.state.formCache[this.state.modelKey];
    if (!cache) return;
    for (const p of this.state.model.params) {
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') {
        if (cache[p.key]) { this.state.refState[this.state.modelKey] = this.state.refState[this.state.modelKey] || {}; this.state.refState[this.state.modelKey][p.key] = cache[p.key]; this._renderRefGrid(p.key); }
      } else { const el = $(`[data-key="${p.key}"]`); if (el && cache[p.key] != null) { el.value = cache[p.key]; this._onFieldChange(p.key, el); } }
    }
  },

  /* ---------- WORKFLOW UNDO ---------- */
  _snapshotForm() {
    this._saveFormToCache();
    return JSON.parse(JSON.stringify(this.state.formCache[this.state.modelKey] || {}));
  },

  _restoreFormSnapshot(snap) {
    this.state.formCache[this.state.modelKey] = snap;
    this._restoreFormFromCache();
  },

  _showUndoBtn(snap) {
    this.state.formUndoSnapshot = snap;
    const btn = $('#undoBtn');
    btn.classList.add('show');
    clearTimeout(this._undoTimer);
    this._undoTimer = setTimeout(() => btn.classList.remove('show'), 5 * 60 * 1000);
  },

  _undoFill() {
    if (this.state.formUndoSnapshot) { this._restoreFormSnapshot(this.state.formUndoSnapshot); this.state.formUndoSnapshot = null; $('#undoBtn').classList.remove('show'); Toast.success('已撤销'); }
  },

  _replaceRefs(refs) {
    if (!this.state.refState[this.state.modelKey]) this.state.refState[this.state.modelKey] = {};
    for (const p of this.state.model.params) {
      if (p.type === 'ref-image') {
        if (isFrameKey(p.key)) {
          const url = String(p.key).includes('first') ? refs.first : refs.last;
          this.state.refState[this.state.modelKey][p.key] = url ? [{ id: genId(), kind: 'url', src: url, name: 'frame', uploaded: true, remote: url }] : [];
        } else {
          this.state.refState[this.state.modelKey][p.key] = refs.image.map(u => ({ id: genId(), kind: 'url', src: u, name: u.split('/').pop(), uploaded: true, remote: u }));
        }
        this._renderRefGrid(p.key);
      } else if (p.type === 'ref-video') {
        this.state.refState[this.state.modelKey][p.key] = refs.video.map(u => ({ id: genId(), kind: 'url-video', src: u, name: u.split('/').pop(), uploaded: true, remote: u }));
        this._renderRefGrid(p.key);
      } else if (p.type === 'ref-audio') {
        this.state.refState[this.state.modelKey][p.key] = (refs.audio || []).map(u => ({ id: genId(), kind: 'url-audio', src: u, name: u.split('/').pop(), uploaded: true, remote: u }));
        this._renderRefGrid(p.key);
      }
    }
  },

  /* ---------- PASTE ROUTING ---------- */
  bindGlobalPaste() {
    document.addEventListener('paste', async e => {
      const text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
      if (text.trim()) {
        if (Workflow.parse(text)) { e.preventDefault(); Workflow.apply(text); return; }
      }
      const items = (e.clipboardData || window.clipboardData).items || [];
      const imageFiles = []; const videoFiles = [];
      for (const item of items) {
        if (item.kind === 'file') {
          if (item.type.startsWith('image/')) imageFiles.push(item.getAsFile());
          else if (item.type.startsWith('video/')) videoFiles.push(item.getAsFile());
        }
      }
      if (!imageFiles.length && !videoFiles.length && !text.trim()) return;
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA') && !text.trim()) return;

      const targetKey = this._resolvePasteTarget(imageFiles.length ? 'ref-image' : (videoFiles.length ? 'ref-video' : null));
      if (!targetKey && text.trim()) {
        if (/^https?:\/\/\S+$/i.test(text.trim())) {
          const urlKey = this._resolvePasteTarget('ref-image');
          if (urlKey) { e.preventDefault(); this._addUrlRef(urlKey, text.trim()); return; }
        }
        return;
      }
      if (!targetKey) return;
      e.preventDefault();
      for (const f of imageFiles) this._addLocalRef(targetKey, f);
      for (const f of videoFiles) this._addLocalVideoRef(targetKey, f);
      if (text.trim() && /^https?:\/\/\S+$/i.test(text.trim())) this._addUrlRef(targetKey, text.trim());
    });
  },

  _resolvePasteTarget(refType) {
    if (!refType) return null;
    if (this.state.activeRefKey) {
      const param = this.state.model.params.find(p => p.key === this.state.activeRefKey);
      if (param && param.type === refType) return this.state.activeRefKey;
    }
    const candidates = this.state.model.params.filter(p => p.type === refType);
    const visible = candidates.filter(p => { const grid = $(`[data-ref-grid="${p.key}"]`); return grid && grid.offsetParent !== null; });
    if (visible.length === 1) return visible[0].key;
    if (candidates.length === 1) return candidates[0].key;
    if (candidates.length > 1) { this._showPastePicker(candidates); return null; }
    return null;
  },

  _showPastePicker(candidates) {
    const opts = $('#pastePickerOptions');
    opts.innerHTML = candidates.map(p => `<button class="pp-option" data-pk="${esc(p.key)}">${esc(p.label)}</button>`).join('');
    opts.querySelectorAll('[data-pk]').forEach(btn => btn.addEventListener('click', () => { this.state.activeRefKey = btn.dataset.pk; this._hidePastePicker(); Toast.info('请再次粘贴'); }));
    $('#pastePicker').classList.add('show');
  },

  _hidePastePicker() { $('#pastePicker').classList.remove('show'); },

  /* ---------- DROP ROUTING ---------- */
  bindGlobalDrop() {
    const panel = $('#paramPanel');
    panel.addEventListener('dragover', e => {
      if (!e.dataTransfer || !e.dataTransfer.types.includes('Files')) {
        const url = e.dataTransfer?.getData('text/plain') || '';
        if (/^https?:\/\//.test(url)) { e.preventDefault(); const target = this._findDropTarget(e); if (target) target.classList.add('ref-drop-active'); }
        return;
      }
      e.preventDefault();
      const target = this._findDropTarget(e);
      if (target) target.classList.add('ref-drop-active');
    });
    panel.addEventListener('dragleave', e => { $$('.ref-drop-active').forEach(el => el.classList.remove('ref-drop-active')); });
    panel.addEventListener('drop', e => {
      e.preventDefault();
      $$('.ref-drop-active').forEach(el => el.classList.remove('ref-drop-active'));
      const target = this._findDropTarget(e);
      if (!target) return;
      const key = target.dataset.refGrid;
      const param = this.state.model.params.find(p => p.key === key);
      if (!param) return;
      const url = e.dataTransfer.getData('text/plain');
      if (url && /^https?:\/\//.test(url)) { this._addUrlRef(key, url); return; }
      for (const f of e.dataTransfer.files) {
        if (param.type === 'ref-video' && f.type.startsWith('video/')) this._addLocalVideoRef(key, f);
        else if (param.type === 'ref-image' && f.type.startsWith('image/')) this._addLocalRef(key, f);
      }
    });
  },

  _findDropTarget(e) {
    const x = e.clientX, y = e.clientY;
    const grids = $$('[data-ref-grid]');
    for (const g of grids) { const r = g.getBoundingClientRect(); if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return g; }
    return null;
  },

  /* ---------- IMAGE EDITOR ---------- */
  _bindEditorEvents() {
    $('#editorUndo').addEventListener('click', () => this._editorUndo());
    $('#editorClear').addEventListener('click', () => this._editorClear());
    $('#editorCancel').addEventListener('click', () => this._closeEditor());
    $('#editorConfirm').addEventListener('click', () => this._editorConfirm());
    $('#editorMaskToggle').addEventListener('change', e => { this.editor.maskVisible = e.target.checked; $('#editorCanvas').style.opacity = e.target.checked ? '1' : '0'; });
    // Keyboard shortcuts in editor
    document.addEventListener('keydown', this._editorKeyHandler = e => {
      if (!$('#editorOverlay').classList.contains('show')) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'b' || e.key === 'B') { this._selectEditorTool('brush'); e.preventDefault(); }
      else if (e.key === 'r' || e.key === 'R') { this._selectEditorTool('rect'); e.preventDefault(); }
      else if (e.key === 'e' || e.key === 'E') { this._selectEditorTool('eraser'); e.preventDefault(); }
      else if (e.key === 'o' || e.key === 'O') { this._selectEditorTool('outpaint'); e.preventDefault(); }
      else if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); this._editorUndo(); }
    });
  },

  _selectEditorTool(tool) {
    const tools = $('#editorTools');
    tools.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
    this.editor.tool = tool;
    tools.querySelector('[data-op="brush-settings"]').style.display = tool === 'outpaint' ? 'none' : '';
    tools.querySelector('[data-op="outpaint-settings"]').style.display = tool === 'outpaint' ? '' : 'none';
  },

  async _openEditor(url) {
    if (!url) return;
    const editor = this.editor;
    editor.maskVisible = true;
    $('#editorMaskToggle').checked = true;
    $('#editorPrompt').value = '';
    $('#editorOverlay').classList.add('show');
    this._renderEditorTools();
    try {
      const proxyUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, ''));
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = proxyUrl; });
      editor.img = img;
      editor.origUrl = url;
      const maxDim = 1024;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) { const r = maxDim / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
      const bg = $('#editorBgCanvas'); const cv = $('#editorCanvas');
      bg.width = cv.width = w; bg.height = cv.height = h;
      bg.style.width = cv.style.width = w + 'px';
      bg.style.height = cv.style.height = h + 'px';
      bg.style.left = cv.style.left = '50%';
      bg.style.top = cv.style.top = '50%';
      bg.style.transform = cv.style.transform = 'translate(-50%, -50%)';
      bg.style.position = cv.style.position = 'absolute';
      cv.style.zIndex = '2';
      cv.style.opacity = '1';
      editor.bgCtx = bg.getContext('2d');
      editor.ctx = cv.getContext('2d');
      editor.bgCtx.drawImage(img, 0, 0, w, h);
      editor.canvas = cv;
      this._bindCanvasEvents();
    } catch (e) { Toast.error('图片加载失败: ' + e.message); this._closeEditor(); }
  },

        <button class="tool-btn" data-tool="rect" title="矩形 (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>矩形</button>
        <button class="tool-btn" data-tool="eraser" title="橡皮 (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16c-1-1-1-3 0-4l9-9c1-1 3-1 4 0l5 5c1 1 1 3 0 4L13 20"/></svg>橡皮</button>
      </div>
      <div class="tool-group" data-op="brush-settings"><div class="tg-label">画笔大小 <span id="brushSizeVal" style="float:right;color:var(--brand);font-family:var(--font-mono)">30px</span></div>

        <div class="tg-label" style="margin-top:8px">透明度 <span id="brushOpacityVal" style="float:right;color:var(--brand);font-family:var(--font-mono)">50%</span></div>
        <div class="range-row"><input type="range" id="brushOpacity" min="0.1" max="1" step="0.1" value="0.5"></div>
        <div class="tg-label" style="margin-top:8px">标注颜色</div>
        <div style="display:flex;gap:6px">
          <button class="color-btn active" data-color="#ff4444" style="background:#ff4444"></button>
          <button class="color-btn" data-color="#44ff44" style="background:#44ff44"></button>
          <button class="color-btn" data-color="#4488ff" style="background:#4488ff"></button>
          <button class="color-btn" data-color="#ffff44" style="background:#ffff44"></button>
          <button class="color-btn" data-color="#ff44ff" style="background:#ff44ff"></button>
        </div>
      </div>
      <div class="tool-group"><div class="tg-label">提示</div>
        <div style="font-size:11px;color:var(--text-dim);line-height:1.5">
          在图片上标注需要修改的区域，配合底部描述框，模型将理解你的修改意图。<br><br>
          <strong>快捷键</strong>：B 画笔 / R 矩形 / E 橡皮 / Ctrl+Z 撤销
        </div>
      </div>
    `;
    tools.querySelectorAll('[data-tool]').forEach(btn => btn.addEventListener('click', () => this._selectEditorTool(btn.dataset.tool)));
    const bs = tools.querySelector('#brushSize');
    bs.addEventListener('input', e => { this.editor.brushSize = parseInt(e.target.value); tools.querySelector('#brushSizeVal').textContent = e.target.value + 'px'; });
    const bo = tools.querySelector('#brushOpacity');
    bo.addEventListener('input', e => { this.editor.opacity = parseFloat(e.target.value); tools.querySelector('#brushOpacityVal').textContent = Math.round(e.target.value * 100) + '%'; });
    tools.querySelectorAll('[data-color]').forEach(btn => btn.addEventListener('click', () => { tools.querySelectorAll('[data-color]').forEach(b => b.classList.remove('active')); btn.classList.add('active'); this.editor.color = btn.dataset.color; }));
  },

  _bindCanvasEvents() {
    const cv = this.editor.canvas;
    const cursor = $('#editorCursorPreview');
    cv.onmousedown = e => this._editorDown(e);
    cv.onmousemove = e => {
      this._editorMove(e);
      // Cursor preview
      if (this.editor.tool !== 'outpaint') {
        const rect = cv.getBoundingClientRect();
        const scale = rect.width / cv.width;
        const size = this.editor.brushSize * scale;
        cursor.style.display = 'block';
        cursor.style.left = e.clientX - cv.parentElement.getBoundingClientRect().left + 'px';
        cursor.style.top = e.clientY - cv.parentElement.getBoundingClientRect().top + 'px';
        cursor.style.width = size + 'px';
        cursor.style.height = size + 'px';
      } else { cursor.style.display = 'none'; }
    };
    cv.onmouseup = e => this._editorUp(e);
    cv.onmouseleave = e => { this._editorUp(e); cursor.style.display = 'none'; };
  },

  _getCanvasPos(e) {
    const rect = this.editor.canvas.getBoundingClientRect();
    const sx = this.editor.canvas.width / rect.width;
    const sy = this.editor.canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
  },

  _editorDown(e) {
    const ed = this.editor;
    ed.isDrawing = true;
    const pos = this._getCanvasPos(e);
    ed.startX = pos.x; ed.startY = pos.y;
    ed.currentBrush = [pos];
    if (ed.tool === 'rect') { ed.rectPreview = { x: pos.x, y: pos.y, w: 0, h: 0 }; }
  },

  _editorMove(e) {
    const ed = this.editor;
    if (!ed.isDrawing) return;
    const pos = this._getCanvasPos(e);
    if (ed.tool === 'brush' || ed.tool === 'eraser') {
      ed.currentBrush.push(pos);
      this._drawStroke();
    } else if (ed.tool === 'rect') {
      ed.rectPreview.w = pos.x - ed.startX; ed.rectPreview.h = pos.y - ed.startY;
      this._drawRectPreview();
    }
  },

  _editorUp(e) {
    const ed = this.editor;
    if (!ed.isDrawing) return;
    ed.isDrawing = false;
    if (ed.tool === 'brush' || ed.tool === 'eraser') {
      ed.maskOps.push({ type: ed.tool, points: ed.currentBrush.slice() });
      ed.currentBrush = [];
      this._pushUndo();
    } else if (ed.tool === 'rect') {
      if (ed.rectPreview) { ed.maskOps.push({ type: 'rect', ...ed.rectPreview }); ed.rectPreview = null; this._pushUndo(); }
    }
  },

  _drawStroke() {
    const ed = this.editor;
    const ctx = ed.ctx;
    ctx.save();
    ctx.globalAlpha = ed.opacity;
    ctx.strokeStyle = ed.tool === 'eraser' ? 'rgba(0,0,0,1)' : ed.color;
    ctx.lineWidth = ed.brushSize;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (ed.tool === 'eraser') ctx.globalCompositeOperation = 'destination-out';
    const pts = ed.currentBrush;
    if (pts.length > 1) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke(); }
    else if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, ed.brushSize / 2, 0, Math.PI * 2); ctx.fillStyle = ed.tool === 'eraser' ? 'rgba(0,0,0,1)' : ed.color; ctx.fill(); }
    ctx.restore();
  },

  _drawRectPreview() {
    const ed = this.editor;
    const ctx = ed.ctx;
    ctx.clearRect(0, 0, ed.canvas.width, ed.canvas.height);
    this._redrawStrokes();
    if (ed.rectPreview) {
      ctx.save();
      ctx.globalAlpha = ed.opacity;
      ctx.fillStyle = ed.color;
      const r = ed.rectPreview;
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.restore();
    }
  },

  _redrawStrokes() {
    const ed = this.editor;
    const ctx = ed.ctx;
    ctx.clearRect(0, 0, ed.canvas.width, ed.canvas.height);
    for (const op of ed.maskOps) {
      ctx.save();
      ctx.globalAlpha = ed.opacity;
      if (op.type === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.strokeStyle = 'rgba(0,0,0,1)'; }
      else ctx.strokeStyle = ed.color;
      ctx.lineWidth = ed.brushSize;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (op.type === 'brush' || op.type === 'eraser') {
        if (op.points.length > 1) { ctx.beginPath(); ctx.moveTo(op.points[0].x, op.points[0].y); for (let i = 1; i < op.points.length; i++) ctx.lineTo(op.points[i].x, op.points[i].y); ctx.stroke(); }
      } else if (op.type === 'rect') { ctx.fillStyle = ed.color; ctx.fillRect(op.x, op.y, op.w, op.h); }
      ctx.restore();
    }
  },

  _pushUndo() { this.editor.undoStack.push({ maskOps: JSON.parse(JSON.stringify(this.editor.maskOps)) }); if (this.editor.undoStack.length > 20) this.editor.undoStack.shift(); },

  _editorUndo() {
    const ed = this.editor;
    if (!ed.undoStack.length) { Toast.warning('没有可撤销的操作'); return; }
    ed.undoStack.pop();
    const prev = ed.undoStack[ed.undoStack.length - 1];
    if (prev) { ed.maskOps = JSON.parse(JSON.stringify(prev.maskOps)); this._redrawStrokes(); }
    else { ed.maskOps = []; ed.ctx.clearRect(0, 0, ed.canvas.width, ed.canvas.height); }
  },

  _editorClear() { this.editor.maskOps = []; this.editor.undoStack = []; this.editor.ctx.clearRect(0, 0, this.editor.canvas.width, this.editor.canvas.height); },

  async _editorConfirm() {
    const ed = this.editor;
    const prompt = $('#editorPrompt').value.trim();
    if (!prompt) { Toast.warning('请描述你要修改的内容'); $('#editorPrompt').focus(); return; }
    try {
      Toast.info('正在合成标注图...');
      // Merge bg + mask into one image
      const merged = document.createElement('canvas');
      merged.width = ed.canvas.width; merged.height = ed.canvas.height;
      const mctx = merged.getContext('2d');
      mctx.drawImage(ed.bgCanvas, 0, 0);
      if (ed.maskVisible) mctx.drawImage(ed.canvas, 0, 0);
      const dataUrl = merged.toDataURL('image/png');
      const url = await Api.uploadDataUrl(dataUrl);
      // Fill the merged image as reference
      const refParam = this.state.model.params.find(p => p.type === 'ref-image' && !isFrameKey(p.key));
      if (refParam) { this._addUrlRef(refParam.key, url); }
      // Fill the prompt
      const promptEl = $('[data-key="prompt"], [data-key="text"]');
      if (promptEl) { promptEl.value = prompt; this._onPromptInput(promptEl); }
      Store.addPrompt(prompt);
      this._closeEditor();
      Toast.success('已填入标注图和修改描述');
    } catch (e) { Toast.error('导出失败: ' + e.message); }
  },

  _closeEditor() {
    $('#editorOverlay').classList.remove('show');
    $('#editorCursorPreview').style.display = 'none';
    this.editor.maskOps = []; this.editor.undoStack = [];
    if (this._editorKeyHandler) { document.removeEventListener('keydown', this._editorKeyHandler); this._editorKeyHandler = null; }
  },

  /* ---------- CONNECTIVITY ---------- */
  _bindConnectivity() {
    window.addEventListener('offline', () => {
      Toast.warning('网络已断开，生成功能暂停');
      $('#generateBtn').disabled = true;
    });
    window.addEventListener('online', () => {
      Toast.success('网络已恢复');
      $('#generateBtn').disabled = false;
      poller.resumeAll();
    });
  },

  /* ---------- GUIDE ---------- */
  maybeShowGuide() {
    if (!Store.isGuideDismissed() && !Store.getApiKey()) {
      $('#guideBanner').classList.add('show');
    }
  }
};

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => UI.init());
</script>
</body>
</html>
