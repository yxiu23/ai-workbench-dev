    if (!Store.getSound()) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    } catch {}
  },
  notifyTaskComplete(task) {
    if (document.visibilityState === 'visible') return;
    try { new Notification('生成完成', { body: `${task.model.name} · ${task.status === 'succeeded' ? '成功' : '失败'}` }); } catch {}
  },

  /* ---------- TABS ---------- */
  switchTab(tab) {
    if (!MODELS[tab]) return;
    this._saveFormToCache();
    this.state.tab = tab;
    $$('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    const model = MODELS[tab][0];
    this.state.model = model;
    this.state.modelKey = `${tab}/${model.id}`;
    this._updateModelBar();
    this.renderParamForm(model.id);
    this._restoreFormFromCache();
  },

  _updateModelBar() {
    const m = this.state.model;
    const sel = $('#modelSelect');
    if (sel) {
      const models = MODELS[this.state.tab];
      sel.innerHTML = models.map(mm => `<option value="${esc(mm.id)}" ${mm.id === m.id ? 'selected' : ''}>${esc(mm.name)} · ${esc(mm.price)}</option>`).join('');
    }
    $('#modelMeta').innerHTML = `<span class="tag type-${m.type}">${typeName(m.type)}</span><span class="tag price">${m.price}</span>`;
    const descEl = $('#modelDesc');
    if (descEl) descEl.textContent = m.desc || '';
  },

  /* ---------- FORM RENDERING ---------- */
  renderParamForm(modelId) {
    const model = MODELS[this.state.tab].find(m => m.id === modelId) || this.state.model;
    this.state.model = model;
    this.state.modelKey = `${this.state.tab}/${model.id}`;
    this._updateModelBar();
    const container = $('#paramForm');
    container.innerHTML = '';
    const hasPrompt = model.params.find(p => p.type === 'textarea');

    if (hasPrompt) container.appendChild(this._buildPromptModule(model));

    // Determine which params are handled by refGroups (skip them in the normal loop)
    const refGroupParamKeys = new Set();
    if (model.refGroups) {
      model.refGroups.modes.forEach(m => m.params.forEach(k => refGroupParamKeys.add(k)));
    }

    for (const p of model.params) {
      if (p.type === 'textarea') continue;
      if (refGroupParamKeys.has(p.key)) continue; // handled by refGroups
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') {
        container.appendChild(this._buildRefSection(p));
      } else {
        container.appendChild(this._buildFieldRow(p));
      }
    }

    // Render refGroups mode section if present
    if (model.refGroups) {
      container.appendChild(this._buildRefModeSection(model));
    }

    this._renderAllRefGrids();
    this._updateEstimate();
    this.renderPresets();
  },

  _buildRefModeSection(model) {
    const wrap = document.createElement('div');
    wrap.className = 'ref-mode-section';
    const rg = model.refGroups;
    const modelKey = this.state.modelKey;
    // Initialize ref mode state
    if (!this.state.refMode) this.state.refMode = {};
    if (!this.state.refMode[modelKey]) this.state.refMode[modelKey] = rg.modes[0].value;

    const cols = rg.modes.length <= 4 ? `repeat(${rg.modes.length}, 1fr)` : 'repeat(4, 1fr)';
    let html = `<div class="ref-mode-header"><span class="ref-mode-title">${esc(rg.title)}</span><span class="ref-mode-hint">${esc(rg.hint)}</span></div>`;
    html += `<div class="ref-mode-row" style="grid-template-columns:${cols}">`;
    html += rg.modes.map(m => `<button class="ref-mode-btn ${m.value === this.state.refMode[modelKey] ? 'active' : ''}" data-ref-mode="${esc(m.value)}">${esc(m.label)}</button>`).join('');
    html += `</div>`;
    // Panels
    html += `<div class="ref-mode-panels">`;
    rg.modes.forEach(m => {
      html += `<div class="ref-mode-panel ${m.value === this.state.refMode[modelKey] ? 'active' : ''}" data-ref-panel="${esc(m.value)}">`;
      m.params.forEach(key => {
        const p = model.params.find(pp => pp.key === key);
        if (!p) return;
        if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') {
          const gridClass = p.type === 'ref-video' ? 'ref-grid-video' : p.type === 'ref-audio' ? 'ref-grid-audio' : '';
          const warnMsg = p.type === 'ref-video' ? '本地视频需上传至 R2 后才能用于生成' : p.type === 'ref-audio' ? '本地音频需上传至 R2 后才能用于生成' : '';
          html += `<div class="ref-section" data-ref-key="${esc(p.key)}" style="margin-bottom:6px;padding:8px"><div class="ref-label">${esc(p.label)}${p.hint ? `<span class="ref-hint">${esc(p.hint)}</span>` : ''}</div><div class="ref-grid ${gridClass}" data-ref-grid="${esc(p.key)}"></div>${warnMsg ? `<div class="ref-video-warn" data-ref-warn="${esc(p.key)}">${warnMsg}</div>` : ''}</div>`;
        } else {
          // text/url field
          const defVal = this.state.formCache[modelKey]?.[key] ?? p.default ?? '';
          if (p.type === 'url') {
            html += `<div class="param-group" style="margin-bottom:6px;padding:8px;background:var(--surface-2);border-radius:var(--radius-sm)"><div class="field-label">${esc(p.label)}</div><div class="url-input-row"><input type="text" data-key="${esc(p.key)}" value="${esc(defVal)}" placeholder="${esc(p.placeholder || 'https://...')}"></div></div>`;
          } else {
            html += `<div class="param-group" style="margin-bottom:6px;padding:8px;background:var(--surface-2);border-radius:var(--radius-sm)"><div class="field-label">${esc(p.label)}</div><input type="text" data-key="${esc(p.key)}" value="${esc(defVal)}" placeholder="${esc(p.placeholder || '')}"></div>`;
          }
        }
      });
      if (m.params.length === 0) html += `<div class="ref-empty" style="text-align:center;padding:12px;color:var(--text-dim);font-size:12px">无参考素材，仅使用提示词生成</div>`;
      html += `</div>`;
    });
    html += `</div>`;
    wrap.innerHTML = html;

    // Bind mode switching
    wrap.querySelectorAll('[data-ref-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.refMode;
        this.state.refMode[modelKey] = mode;
        wrap.querySelectorAll('[data-ref-mode]').forEach(b => b.classList.toggle('active', b.dataset.refMode === mode));
        wrap.querySelectorAll('[data-ref-panel]').forEach(p => p.classList.toggle('active', p.dataset.refPanel === mode));
        this._updateEstimate();
      });
    });

    // Bind ref grid clicks for file upload
    wrap.querySelectorAll('[data-ref-key]').forEach(refSection => {
      const key = refSection.dataset.refKey;
      const param = model.params.find(p => p.key === key);
      if (!param) return;
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = param.type === 'ref-video' ? 'video/*' : param.type === 'ref-audio' ? 'audio/*' : 'image/*';
      fileInput.multiple = param.output !== 'single';
      fileInput.style.display = 'none';
      fileInput.addEventListener('change', e => {
        for (const f of e.target.files) {
          if (param.type === 'ref-video') this._addLocalVideoRef(key, f);
          else if (param.type === 'ref-audio') this._addLocalAudioRef(key, f);
          else this._addLocalRef(key, f);
        }
        fileInput.value = '';
      });
      refSection.appendChild(fileInput);
      refSection.addEventListener('click', e => {
        if (e.target.closest('.ref-del') || e.target.closest('.ref-copy') || e.target.closest('.ref-item')) return;
        this.state.activeRefKey = key;
        fileInput.click();
      });
      refSection.addEventListener('pointerdown', () => { this.state.activeRefKey = key; }, true);
    });

    // Bind text/url inputs in panels
    wrap.querySelectorAll('[data-key]').forEach(el => {
      el.addEventListener('input', () => this._onFieldChange(el.dataset.key, el));
      el.addEventListener('change', () => this._onFieldChange(el.dataset.key, el));
    });

    return wrap;
  },

  _buildPromptModule(model) {
    const wrap = document.createElement('div');
    wrap.className = 'prompt-module';
    wrap.style.position = 'relative';
    const promptParam = model.params.find(p => p.type === 'textarea');
    const key = promptParam.key;
    const defVal = this.state.formCache[this.state.modelKey]?.[key] ?? promptParam.default ?? '';
    wrap.innerHTML = `
      <div class="prompt-head">
        <span class="prompt-title">提示词</span>
        <div class="prompt-actions">
          <button class="preset-trigger" id="presetTrigger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>预设</span>
          </button>
          <button class="prompt-save-btn" id="savePresetBtn" title="保存为预设">＋</button>
        </div>
      </div>
      <textarea data-key="${esc(key)}" placeholder="${esc(promptParam.placeholder || '描述你想要生成的内容...')}" maxlength="2000">${esc(defVal)}</textarea>
      <div class="prompt-tools">
        <button class="tool-btn" data-action="recent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>最近</button>
        <button class="tool-btn" data-action="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>清空</button>
        <span class="prompt-count" data-count>0/2000</span>
      </div>
      <div class="prompt-history-list" id="phList"></div>
    `;
    const ta = wrap.querySelector('textarea');
    ta.addEventListener('input', () => this._onPromptInput(ta));
    ta.addEventListener('focus', () => { this.state.activeRefKey = null; });
    wrap.querySelector('[data-action="recent"]').addEventListener('click', e => { e.stopPropagation(); this._togglePromptHistory(e.currentTarget); });
    wrap.querySelector('[data-action="clear"]').addEventListener('click', () => this._clearPrompt(ta));
    $('#savePresetBtn', wrap) ?? wrap.querySelector('#savePresetBtn');
    wrap.querySelector('#savePresetBtn').addEventListener('click', () => this._openPresetModal());
    wrap.querySelector('#presetTrigger').addEventListener('click', () => this._openPresetPicker());
    this._onPromptInput(ta);
    return wrap;
  },

  _onPromptInput(ta) {
    const count = ta.value.length;
    const countEl = ta.parentElement.querySelector('[data-count]');
    if (countEl) {
      countEl.textContent = `${count}/2000`;
      countEl.classList.toggle('warn', count >= 1500 && count < 1900);
      countEl.classList.toggle('danger', count >= 1900);
    }
    this._updateEstimate();
  },

  _togglePromptHistory(btn) {
    const list = btn.closest('.prompt-module').querySelector('.prompt-history-list');
    const items = Store.getPromptHistory();
    if (list.classList.contains('show')) { list.classList.remove('show'); return; }
    if (!items.length) { list.innerHTML = '<div class="ph-empty">暂无历史</div>'; }
    else { list.innerHTML = items.map(p => `<div class="ph-item">${esc(trunc(p, 80))}</div>`).join(''); $$('.ph-item', list).forEach((el, i) => el.addEventListener('click', () => { const ta = btn.closest('.prompt-module').querySelector('textarea'); ta.value = items[i]; this._onPromptInput(ta); list.classList.remove('show'); })); }
    const rect = btn.getBoundingClientRect();
    list.style.position = 'fixed';
    list.style.top = (rect.bottom + 4) + 'px';
    list.style.left = rect.left + 'px';
    list.classList.add('show');
  },

  _insertInspiration(ta) {
    const insp = PROMPT_INSPIRATIONS[Math.floor(Math.random() * PROMPT_INSPIRATIONS.length)];
    ta.value = ta.value.trim() ? `${ta.value.replace(/[，,]\s*$/, '')}，${insp}` : insp;
    this._onPromptInput(ta);
    Toast.success('已添加灵感提示词');
  },

  _copyPrompt(ta) {
    if (!ta.value.trim()) { Toast.warning('提示词为空'); return; }
    copy(ta.value).then(ok => ok ? Toast.success('已复制') : Toast.error('复制失败'));
  },

  _clearPrompt(ta) {
    if (!ta.value.trim()) return;
    ta.value = '';
    this._onPromptInput(ta);
    Toast.info('已清空');
  },

  _buildRefSection(p) {
    const wrap = document.createElement('div');
    wrap.className = 'ref-section';
    wrap.dataset.refKey = p.key;
    const gridClass = p.type === 'ref-video' ? 'ref-grid-video' : p.type === 'ref-audio' ? 'ref-grid-audio' : '';
    const warnMsg = p.type === 'ref-video' ? '本地视频需上传至 R2 后才能用于生成' : p.type === 'ref-audio' ? '本地音频需上传至 R2 后才能用于生成' : '';
    wrap.innerHTML = `
      <div class="ref-label">${esc(p.label)}${p.hint ? `<span class="ref-hint">${esc(p.hint)}</span>` : ''}</div>
      <div class="ref-grid ${gridClass}" data-ref-grid="${esc(p.key)}"></div>
      ${warnMsg ? '<div class="ref-video-warn" data-ref-warn="' + esc(p.key) + '">' + warnMsg + '</div>' : ''}
    `;
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = p.type === 'ref-video' ? 'video/*' : p.type === 'ref-audio' ? 'audio/*' : 'image/*';
    fileInput.multiple = p.output !== 'single';
    fileInput.style.display = 'none';
    fileInput.addEventListener('change', e => {
      for (const f of e.target.files) {
        if (p.type === 'ref-video') this._addLocalVideoRef(p.key, f);
        else if (p.type === 'ref-audio') this._addLocalAudioRef(p.key, f);
        else this._addLocalRef(p.key, f);
      }
      fileInput.value = '';
    });
    wrap.appendChild(fileInput);
    wrap.addEventListener('click', e => {
      if (e.target.closest('.ref-del') || e.target.closest('.ref-copy') || e.target.closest('.ref-item')) return;
      this.state.activeRefKey = p.key;
      fileInput.click();
    });
    wrap.addEventListener('pointerdown', () => { this.state.activeRefKey = p.key; }, true);
    return wrap;
  },

  _buildFieldRow(p) {
    const wrap = document.createElement('div');
    wrap.className = 'param-group';
    const defVal = this.state.formCache[this.state.modelKey]?.[p.key] ?? p.default ?? '';
    let inner = `<div class="field-row"><div class="field-label">${esc(p.label)}${p.hint ? `<span class="field-hint">${esc(p.hint)}</span>` : ''}<span class="field-val" data-val="${esc(p.key)}"></span></div>`;
    if (p.type === 'select') {
      inner += `<select data-key="${esc(p.key)}">${p.options.map(o => `<option value="${esc(o)}" ${o === defVal ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    } else if (p.type === 'range') {
      inner += `<div class="range-row"><input type="range" data-key="${esc(p.key)}" min="${p.min}" max="${p.max}" step="${p.step}" value="${defVal}"></div>`;
    } else if (p.type === 'number') {
      inner += `<input type="number" data-key="${esc(p.key)}" value="${esc(defVal)}" ${p.min != null ? `min="${p.min}"` : ''} ${p.max != null ? `max="${p.max}"` : ''}>`;
    } else if (p.type === 'datalist') {
      inner += `<select data-key="${esc(p.key)}">${p.options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>`;
    } else if (p.type === 'url') {
      inner += `<div class="url-input-row"><input type="text" data-key="${esc(p.key)}" value="${esc(defVal)}" placeholder="${esc(p.placeholder || 'https://...')}"><button data-add-url="${esc(p.key)}">添加</button></div>`;
    } else if (p.type === 'url-list') {
      inner += `<div class="url-input-row"><input type="text" data-url-input="${esc(p.key)}" placeholder="https://..."><button data-add-url-list="${esc(p.key)}">添加</button></div><div data-url-list="${esc(p.key)}" class="ref-grid" style="margin-top:6px"></div>`;
    } else {
      inner += `<input type="text" data-key="${esc(p.key)}" value="${esc(defVal)}" placeholder="${esc(p.placeholder || '')}">`;
    }
    inner += '</div>';
    wrap.innerHTML = inner;
    const el = wrap.querySelector(`[data-key="${p.key}"]`);
    if (el) {
      el.addEventListener('input', () => this._onFieldChange(p.key, el));
      el.addEventListener('change', () => this._onFieldChange(p.key, el));
    }
    const addUrlBtn = wrap.querySelector(`[data-add-url="${p.key}"]`);
    if (addUrlBtn) addUrlBtn.addEventListener('click', () => { const inp = wrap.querySelector(`[data-key="${p.key}"]`); if (inp.value.trim()) { this._updateEstimate(); } });
    this._onFieldChange(p.key, el);
    return wrap;
  },

  _onFieldChange(key, el) {
    const valEl = $(`[data-val="${key}"]`);
    if (valEl && el) {
      if (el.type === 'range') valEl.textContent = el.value + (el.step && parseFloat(el.step) < 1 ? '' : '');
      else valEl.textContent = el.value;
    }
    this._updateEstimate();
  },

  /* ---------- PRESETS ---------- */
  renderPresets() {
    // Preset list now rendered on demand in the picker modal — this is a no-op kept for compatibility
  },

  _openPresetPicker() {
    const tab = this.state.tab;
    const builtin = tab === 'image' ? PROMPT_PRESETS : tab === 'video' ? VIDEO_PROMPT_PRESETS : AUDIO_PROMPT_PRESETS;
    const templates = PROMPT_TEMPLATES[tab] || [];
    const custom = Store.getPresets().filter(p => p.tab === tab);
    let activeTab = 'builtin';
    let activeCategory = '';
    const renderList = (filter = '') => {
      const f = filter.toLowerCase();
      let html = '';
      if (activeTab === 'builtin') {
        const filteredBuiltin = filter ? builtin.filter(p => p.name.toLowerCase().includes(f) || p.id.toLowerCase().includes(f)) : builtin;
        const filteredCustom = filter ? custom.filter(p => p.name.toLowerCase().includes(f)) : custom;
        html += '<div style="font-size:11px;font-weight:600;color:var(--text-dim);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px">功能预设（' + filteredBuiltin.length + '）</div>';
        html += filteredBuiltin.map(p => `<div class="history-item" data-preset="builtin:${esc(p.id)}"><div class="h-info"><div class="h-model">${esc(p.name)}${p.id==='none'?' <span style="font-size:10px;color:var(--text-dim)">清除预设</span>':''}</div><div class="h-prompt">${esc(trunc(p.prompt || '无内容', 60))}</div></div></div>`).join('');
        if (!filteredBuiltin.length) html += '<div style="padding:12px;text-align:center;color:var(--text-dim);font-size:12px">无匹配预设</div>';
        if (filteredCustom.length) {
          html += '<div style="font-size:11px;font-weight:600;color:var(--text-dim);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px">我的预设（' + filteredCustom.length + '）</div>';
          html += filteredCustom.map(p => `<div class="history-item" data-preset="custom:${esc(p.id)}"><div class="h-info"><div class="h-model">${esc(p.name)} <button class="act" style="float:right;padding:2px 6px;font-size:10px" data-del-preset="${esc(p.id)}">删</button></div><div class="h-prompt">${esc(trunc(p.prompt, 60))}</div></div></div>`).join('');
        }
      } else if (activeTab === 'templates') {
        // Group by category
        const cats = {};
        templates.forEach(t => { if (!cats[t.category]) cats[t.category] = []; cats[t.category].push(t); });
        const catNames = Object.keys(cats);
        let filteredCats = catNames;
        if (activeCategory) filteredCats = [activeCategory];
        if (filter) {
          for (const c of filteredCats) {
            cats[c] = cats[c].filter(t => t.name.toLowerCase().includes(f) || t.prompt.toLowerCase().includes(f) || t.category.toLowerCase().includes(f));
          }
        }
        // Category filter chips
        html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">';
        html += `<button class="filter-tab ${!activeCategory ? 'active' : ''}" data-cat="" style="padding:3px 10px;font-size:11px">全部</button>`;
        catNames.forEach(c => { html += `<button class="filter-tab ${activeCategory === c ? 'active' : ''}" data-cat="${esc(c)}" style="padding:3px 10px;font-size:11px">${esc(c)}</button>`; });
        html += '</div>';
        filteredCats.forEach(cat => {
          const items = cats[cat];
          if (!items.length) return;
          html += `<div style="font-size:11px;font-weight:600;color:var(--text-dim);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px">${esc(cat)}（${items.length}）</div>`;
          html += items.map(t => `<div class="history-item" data-preset="template:${esc(t.id)}"><div class="h-info"><div class="h-model">${esc(t.name)}</div><div class="h-prompt">${esc(trunc(t.prompt, 60))}</div></div></div>`).join('');
        });
        if (!filteredCats.some(c => cats[c].length)) html += '<div style="padding:12px;text-align:center;color:var(--text-dim);font-size:12px">无匹配模板</div>';
      }
      const list = $('#modalBody .preset-list');
      if (list) list.innerHTML = html;
      $$('#modalBody [data-preset]').forEach(el => {
        el.addEventListener('click', e => {
          if (e.target.closest('[data-del-preset]')) return;
          this._applyPreset(el.dataset.preset);
          this._closeModal();
        });
      });
      $$('#modalBody [data-del-preset]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          Store.delPreset(btn.dataset.delPreset);
          renderList($('#presetSearchInput')?.value || '');
          Toast.success('预设已删除');
        });
      });
      $$('#modalBody [data-cat]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          activeCategory = btn.dataset.cat;
          renderList($('#presetSearchInput')?.value || '');
        });
      });
    };
    const tabBtns = `<div style="display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border-soft)"><button class="filter-tab ${activeTab === 'builtin' ? 'active' : ''}" data-ptab="builtin" style="flex:1">功能预设</button><button class="filter-tab ${activeTab === 'templates' ? 'active' : ''}" data-ptab="templates" style="flex:1">创意模板（${templates.length}）</button></div>`;
    const searchHtml = `${tabBtns}<div class="history-search" style="padding:8px 12px;border-bottom:1px solid var(--border-soft)"><input type="text" id="presetSearchInput" placeholder="搜索..." style="font-size:13px"></div><div class="preset-list" style="padding:4px 12px;max-height:50vh;overflow-y:auto"></div>`;
    this._showModal(`提示词预设`, searchHtml);
    renderList();
    const searchInput = $('#presetSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', e => renderList(e.target.value));
      setTimeout(() => searchInput.focus(), 100);
    }
    $$('#modalBody [data-ptab]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.ptab;
        activeCategory = '';
        $$('#modalBody [data-ptab]').forEach(b => b.classList.toggle('active', b.dataset.ptab === activeTab));
        renderList($('#presetSearchInput')?.value || '');
      });
    });
  },

  _applyPreset(val) {
    const ta = $('[data-key="prompt"], [data-key="text"]');
    if (!ta) return;
    if (val === 'builtin:none') {
      const base = this.state.promptPresetBase[this.state.modelKey];
      if (base != null) { ta.value = base; this.state.promptPresetBase[this.state.modelKey] = null; }
      this._onPromptInput(ta);
      return;
    }
    if (val.startsWith('builtin:')) {
      const id = val.slice(8);
      const tab = this.state.tab;
      const builtin = tab === 'image' ? PROMPT_PRESETS : tab === 'video' ? VIDEO_PROMPT_PRESETS : AUDIO_PROMPT_PRESETS;
      const preset = builtin.find(p => p.id === id);
      if (!preset) return;
      let base = this.state.promptPresetBase[this.state.modelKey];
      if (base == null) { base = ta.value; this.state.promptPresetBase[this.state.modelKey] = base; }
      ta.value = preset.prompt + (base.trim() ? `\n\n${base}` : '');
      this.state.promptPresetName[this.state.modelKey] = preset.name;
      this._onPromptInput(ta);
      Toast.info(`已应用预设: ${preset.name}`);
    } else if (val.startsWith('custom:')) {
      const id = val.slice(7);
      const preset = Store.getPresets().find(p => p.id === id);
      if (!preset) return;
      ta.value = preset.prompt;
      this.state.promptPresetBase[this.state.modelKey] = null;
      this._onPromptInput(ta);
      Toast.info(`已应用预设: ${preset.name}`);
    } else if (val.startsWith('template:')) {
      const id = val.slice(9);
      const tab = this.state.tab;
      const templates = PROMPT_TEMPLATES[tab] || [];
      const tpl = templates.find(t => t.id === id);
      if (!tpl) return;
      // Templates replace the prompt entirely (they're scene-specific)
      ta.value = tpl.prompt;
      this.state.promptPresetBase[this.state.modelKey] = null;
      this._onPromptInput(ta);
      Toast.info(`已应用模板: ${tpl.name}`);
    }
  },

  _openPresetModal() {
    const ta = $('[data-key="prompt"], [data-key="text"]');
    if (!ta || !ta.value.trim()) { Toast.warning('提示词为空，无法保存'); return; }
    $('#presetNameInput').value = '';
    $('#presetOverlay').classList.add('show');
    setTimeout(() => $('#presetNameInput').focus(), 100);
  },

  _confirmSavePreset() {
    const name = $('#presetNameInput').value.trim();
    if (!name) { Toast.warning('请输入预设名称'); return; }
    const ta = $('[data-key="prompt"], [data-key="text"]');
    const prompt = ta ? ta.value : '';
    Store.savePreset(name, this.state.tab, this.state.model.id, prompt);
    $('#presetOverlay').classList.remove('show');
    this.renderPresets();
    Toast.success('预设已保存');
  },

  /* ---------- REFS ---------- */
  _getRefs(key) {
    if (!this.state.refState[this.state.modelKey]) this.state.refState[this.state.modelKey] = {};
    if (!this.state.refState[this.state.modelKey][key]) this.state.refState[this.state.modelKey][key] = [];
    return this.state.refState[this.state.modelKey][key];
  },

  _addLocalRef(key, file) {
    if (file.size > 10 * 1024 * 1024) { Toast.error('图片不能超过 10MB'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const item = { id: genId(), kind: 'local', src: e.target.result, name: file.name, uploaded: false, remote: null };
      this._getRefs(key).push(item);
      this._renderRefGrid(key);
      this._uploadLocalImage(key, item);
    };
    reader.readAsDataURL(file);
  },

  _addLocalVideoRef(key, file) {
    if (file.size > 100 * 1024 * 1024) { Toast.error('视频不能超过 100MB'); return; }
    const url = URL.createObjectURL(file);
    const item = { id: genId(), kind: 'local-video', src: url, name: file.name, uploaded: false, remote: null, file };
    this._getRefs(key).push(item);
    this._renderRefGrid(key);
    this._updateRefVideoWarn(key);
    this._uploadLocalVideo(key, item);
  },

  _addLocalAudioRef(key, file) {
    if (file.size > 50 * 1024 * 1024) { Toast.error('音频不能超过 50MB'); return; }
    const url = URL.createObjectURL(file);
    const item = { id: genId(), kind: 'local-audio', src: url, name: file.name, uploaded: false, remote: null, file };
    this._getRefs(key).push(item);
    this._renderRefGrid(key);
    this._updateRefAudioWarn(key);
    this._uploadLocalAudio(key, item);
  },

  _addUrlRef(key, url) {
    if (!/^https?:\/\//.test(url)) { Toast.error('请输入有效的 URL'); return null; }
    const refs = this._getRefs(key);
    if (refs.some(r => r.remote === url || r.src === url)) { Toast.warning('该 URL 已存在'); return null; }
    const param = this.state.model.params.find(p => p.key === key);
    const isVideo = param && param.type === 'ref-video';
    const isAudio = param && param.type === 'ref-audio';
    const kind = isVideo ? 'url-video' : isAudio ? 'url-audio' : 'url';
    const item = { id: genId(), kind, src: url, name: url.split('/').pop() || 'url', uploaded: true, remote: url };
    refs.push(item);
    this._renderRefGrid(key);
    if (isVideo) this._updateRefVideoWarn(key);
    if (isAudio) this._updateRefAudioWarn(key);
    return item;
  },

  _removeRef(key, id) {
    const refs = this._getRefs(key);
    const idx = refs.findIndex(r => r.id === id);
    if (idx >= 0) { if (refs[idx].src.startsWith('blob:')) URL.revokeObjectURL(refs[idx].src); refs.splice(idx, 1); }
    this._renderRefGrid(key);
    this._updateRefVideoWarn(key);
    this._updateRefAudioWarn(key);
    this._updateEstimate();
  },

  async _uploadLocalImage(key, item) {
    try {
      const url = await Api.uploadToR2(Api.dataUrlToBlob(item.src).then ? await (async () => { const b = Api.dataUrlToBlob(item.src); const f = new File([b], item.name, { type: b.type }); return Api.uploadToR2(f); })() : Api.uploadToR2(new File([Api.dataUrlToBlob(item.src)], item.name)));
      item.remote = url; item.uploaded = true;
      this._renderRefGrid(key);
    } catch (e) { Toast.error(`上传失败: ${e.message}`); }
  },

  async _uploadLocalVideo(key, item) {
    try {
      const url = await Api.uploadToR2(item.file);
      item.remote = url; item.uploaded = true;
      this._renderRefGrid(key);
      this._updateRefVideoWarn(key);
    } catch (e) { Toast.error(`视频上传失败: ${e.message}`); }
  },

  async _uploadLocalAudio(key, item) {
    try {
      const url = await Api.uploadToR2(item.file);
      item.remote = url; item.uploaded = true;
      this._renderRefGrid(key);
      this._updateRefAudioWarn(key);
    } catch (e) { Toast.error(`音频上传失败: ${e.message}`); }
  },

  _renderAllRefGrids() {
    for (const p of this.state.model.params) {
      if (p.type === 'ref-image' || p.type === 'ref-video' || p.type === 'ref-audio') this._renderRefGrid(p.key);
    }
  },

  _renderRefGrid(key) {
    const grid = $(`[data-ref-grid="${key}"]`);
    if (!grid) return;
    const refs = this._getRefs(key);
    const param = this.state.model.params.find(p => p.key === key);
    const isVideo = param && param.type === 'ref-video';
    const isAudio = param && param.type === 'ref-audio';
    const max = param.output === 'single' ? 1 : (param.output === 'csv' ? 99 : (param.output === 'array' ? 14 : 99));
    let html = refs.map(r => {
      const badge = r.kind === 'local' || r.kind === 'local-video' || r.kind === 'local-audio' ? (r.uploaded ? '' : '<span class="ref-badge uploading">上传中</span>') : '';
      const localBadge = (r.kind === 'local' || r.kind === 'local-video' || r.kind === 'local-audio') && !r.uploaded ? '<span class="ref-badge local">本地</span>' : badge;
      let media;
      if (isVideo) media = `<video src="${esc(r.src)}" muted></video>`;
      else if (isAudio) media = `<div class="ref-audio-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="ref-audio-name">${esc(trunc(r.name, 12))}</span></div>`;
      else media = `<img src="${esc(r.src)}" loading="lazy">`;
      return `<div class="ref-item ${isVideo ? 'ref-item-video' : ''} ${isAudio ? 'ref-item-audio' : ''}" data-rid="${esc(r.id)}">${media}${localBadge}<button class="ref-del" data-del="${esc(r.id)}">×</button><button class="ref-copy" data-copy-url="${esc(r.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>`;
    }).join('');
    if (refs.length < max) {
      html += `<div class="ref-add ${isVideo ? 'ref-add-video' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加</div>`;
    }
    grid.innerHTML = html;
    grid.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); this._removeRef(key, btn.dataset.del); }));
    grid.querySelectorAll('[data-copy-url]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); const r = refs.find(x => x.id === btn.dataset.copyUrl); if (r && r.remote) { copy(r.remote).then(ok => ok ? Toast.success('URL 已复制') : Toast.error('复制失败')); } }));
    grid.querySelectorAll('.ref-item').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); const r = refs.find(x => x.id === el.dataset.rid); if (r && r.remote) { if (r.kind.includes('video')) this._openLightbox([r.remote], 0, true); else if (!r.kind.includes('audio')) this._openLightbox([r.remote], 0, false); } }));
    this._updateEstimate();
  },

  _updateRefVideoWarn(key) {
    const warn = $(`[data-ref-warn="${key}"]`);
    if (!warn) return;
    const refs = this._getRefs(key);
    const hasLocal = refs.some(r => r.kind === 'local-video' && !r.uploaded);
    warn.classList.toggle('show', hasLocal);
  },

  _updateRefAudioWarn(key) {
    const warn = $(`[data-ref-warn="${key}"]`);
    if (!warn) return;
    const refs = this._getRefs(key);
    const hasLocal = refs.some(r => r.kind === 'local-audio' && !r.uploaded);
    warn.classList.toggle('show', hasLocal);
  },

  _collectRefImage(key) {
    const refs = this._getRefs(key);
    const urls = refs.map(r => r.remote || r.src).filter(u => /^https?:\/\//.test(u));
    const param = this.state.model.params.find(p => p.key === key);
    if (!param) return null;
    if (param.output === 'single') return urls[0] || '';
    if (param.output === 'csv') return urls.join(',');
    if (param.output === 'array') return urls;
    return urls[0] || '';
  },

  _collectRefVideo(key) {
    const refs = this._getRefs(key);
    const urls = refs.map(r => r.remote).filter(Boolean);
    if (!urls.every(u => /^https?:\/\//.test(u))) throw new Error('本地视频需上传完成后才能使用');
    const param = this.state.model.params.find(p => p.key === key);
    if (!param) return null;
    if (param.output === 'single') return urls[0] || '';
    if (param.output === 'csv') return urls.join(',');
    return urls[0] || '';
  },

  _collectRefAudio(key) {
    const refs = this._getRefs(key);
    const urls = refs.map(r => r.remote).filter(Boolean);
    if (!urls.every(u => /^https?:\/\//.test(u))) throw new Error('本地音频需上传完成后才能使用');
    const param = this.state.model.params.find(p => p.key === key);
    if (!param) return null;
    if (param.output === 'single') return urls[0] || '';
    if (param.output === 'csv') return urls.join(',');
    return urls[0] || '';
  },

  _collectParamsSync() {
    const body = {};
    const model = this.state.model;
    const modelKey = this.state.modelKey;
    // Determine which params belong to inactive ref modes (skip them)
    const inactiveRefParams = new Set();
    if (model.refGroups) {
      const activeMode = this.state.refMode?.[modelKey] || model.refGroups.modes[0].value;
      model.refGroups.modes.forEach(m => {
        if (m.value !== activeMode) m.params.forEach(k => inactiveRefParams.add(k));
      });
    }
    for (const p of model.params) {
      if (inactiveRefParams.has(p.key)) continue; // skip inactive ref mode params
      if (p.type === 'ref-image') { body[p.key] = this._collectRefImage(p.key); }
      else if (p.type === 'ref-video') { body[p.key] = this._collectRefVideo(p.key); }
      else if (p.type === 'ref-audio') { body[p.key] = this._collectRefAudio(p.key); }
      else {
        const el = $(`[data-key="${p.key}"]`);
        // Only collect if element is visible (in active panel) or not in a ref mode panel
        if (el) body[p.key] = el.value;
        else if (!inactiveRefParams.has(p.key)) body[p.key] = p.default ?? '';
      }
    }
    return body;
  },

  async _collectParamsAsync() {
    return this._collectParamsSync();
  },

  /* ---------- ESTIMATE ---------- */
  _updateEstimate() {
    let body;
    try { body = this._collectParamsSync(); } catch { $('#estimateCost').textContent = '预计 —'; return; }
    const est = calcEstimate(this.state.model, body);
    if (!est) { $('#estimateCost').textContent = '预计 —'; return; }
    if (est.amount != null) $('#estimateCost').innerHTML = `预计 <span class="amount">¥${est.amount.toFixed(2)}</span> · ${esc(est.label)}`;
    else $('#estimateCost').innerHTML = `预计 <span class="amount">—</span> · ${esc(est.label)}`;
  },

  /* ---------- GENERATE ---------- */
  async handleGenerate() {
    const key = Store.getApiKey();
    if (!key) { Toast.error('请先在设置中填入 API Key'); this._openSettings(); return; }
    if (!this._checkBudget()) return;
    if (this._generating) { Toast.warning('正在生成中，请稍候'); return; }
    this._generating = true;
    const btn = $('#generateBtn');
    btn.disabled = true; $('#generateBtnText').textContent = '提交中...';
    try {
      const body = this._collectParamsSync();
      const v = normalizeAndValidateApiBody(this.state.model, body);
      if (!v.ok) { Toast.error(v.error); return; }
      const prompt = body.prompt || body.text || '';
      if (prompt) Store.addPrompt(prompt);
      const task = { id: genId(), model: this.state.model, body: v.body, prompt, status: 'processing', createdAt: Date.now(), apiId: null };
      if (this.state.model.async) {
        const res = await Api.submit(this.state.model, v.body);
        task.apiId = res.id;
        const tasks = Store.getTasks();
        tasks.unshift(task);
        Store.saveTasks(tasks);
        this._renderTask(task);
        this._renderActiveTasks();
        poller.start(task);
        Toast.success('任务已提交');
      } else {
        btn.textContent = '生成中...';
        const data = await Api.syncCall(this.state.model, v.body);
        const url = Api.extractUrl(data);
        task.status = 'succeeded';
        task.result = { url, data };
        task.completedAt = Date.now();
        const cost = calcEstimate(this.state.model, v.body);
        task.cost = cost?.amount;
        Store.addHistory({ id: task.id, model: task.model, prompt, body: v.body, status: 'succeeded', result: task.result, createdAt: task.createdAt, completedAt: task.completedAt, cost: task.cost });
        this._renderTask(task);
        this._renderResultStrip();
        Toast.success('生成完成');
        this.playSuccessSound();
      }
    } catch (e) {
      Toast.error(e.message);
      console.error(e);
    } finally {
      btn.disabled = false; $('#generateBtnText').textContent = '生成'; this._generating = false;
    }
  },

  _buildCurrentTask() {
    try {
      const body = this._collectParamsSync();
      const prompt = body.prompt || body.text || '';
      return { model: this.state.model, body, prompt };
    } catch { return null; }
  },

  /* ---------- TASK RESULTS ---------- */
  onTaskResult(taskId, result) {
    const tasks = Store.getTasks();
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    if (result.status === 'succeeded') {
      task.status = 'succeeded';
      task.result = { url: Api.extractUrl(result.data), data: result.data };
      task.completedAt = Date.now();
      const cost = calcEstimate(task.model, task.body);
      task.cost = cost?.amount;
      Store.addHistory({ id: task.id, model: task.model, prompt: task.prompt, body: task.body, status: 'succeeded', result: task.result, createdAt: task.createdAt, completedAt: task.completedAt, cost: task.cost });
      this.playSuccessSound();
      this.notifyTaskComplete(task);
      Toast.success(`${task.model.name} 生成完成`);
    } else if (result.status === 'failed') {
      task.status = 'failed';
      task.error = result.error;
      task.completedAt = Date.now();
      Store.addHistory({ id: task.id, model: task.model, prompt: task.prompt, body: task.body, status: 'failed', error: result.error, createdAt: task.createdAt, completedAt: task.completedAt });
      Toast.error(`${task.model.name} 生成失败`);
    } else if (result.status === 'timeout') {
      task.status = 'timeout';
      task.completedAt = Date.now();
      Store.addHistory({ id: task.id, model: task.model, prompt: task.prompt, body: task.body, status: 'timeout', createdAt: task.createdAt, completedAt: task.completedAt });
      Toast.warning(`${task.model.name} 生成超时`);
    }
    const remaining = tasks.filter(t => t.id !== taskId);
    Store.saveTasks(remaining);
    this._updateTaskCard(task);
    this._renderActiveTasks();
    this._updateBudgetStatus();
    this._renderResultStrip();
    this.renderHistoryBadge();
    this._updateTitle();
  },

  updateTaskCardPhase(taskId, phase) {
    const card = $(`[data-tid="${taskId}"]`);
    if (card) { const phaseEl = card.querySelector('.atp-phase'); if (phaseEl) phaseEl.textContent = phase; }
  },

  _renderTask(task) {
    $('#emptyState')?.remove();
    const list = $('#resultList');
    const card = this._buildTaskCard(task);
    list.prepend(card);
  },

  _renderTaskList() {
    const list = $('#resultList');
    list.innerHTML = '';
    list.classList.toggle('gallery-view', this.state.galleryView);
    let tasks = Store.getTasks();
    const history = Store.getHistory();
    const all = [...tasks, ...history.filter(h => !tasks.find(t => t.id === h.id))];
    let filtered = this.state.filter === 'all' ? all : all.filter(t => t.model?.type === this.state.filter);
    // Apply date filter
    if (this.state.dateFilter !== 'all') {
      const now = new Date();
      let cut;
      if (this.state.dateFilter === 'today') { cut = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(); }
      else if (this.state.dateFilter === 'week') { cut = now.getTime() - 7 * 86400000; }
      else if (this.state.dateFilter === 'month') { cut = new Date(now.getFullYear(), now.getMonth(), 1).getTime(); }
      filtered = filtered.filter(t => (t.createdAt || 0) >= cut);
    }
    // Apply text search
    if (this.state.resultSearch) {
      const q = this.state.resultSearch.toLowerCase();
      filtered = filtered.filter(t => (t.prompt || '').toLowerCase().includes(q) || (t.model?.name || '').toLowerCase().includes(q) || (t.error || '').toLowerCase().includes(q));
    }
    // Apply sorting
    const s = this.state.sortOrder;
    if (s === 'newest') filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    else if (s === 'oldest') filtered.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    else if (s === 'cost-desc') filtered.sort((a, b) => (b.cost || 0) - (a.cost || 0));
    else if (s === 'cost-asc') filtered.sort((a, b) => (a.cost || 0) - (b.cost || 0));
    else if (s === 'model') filtered.sort((a, b) => (a.model?.name || '').localeCompare(b.model?.name || '') || (b.createdAt || 0) - (a.createdAt || 0));
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg><div class="empty-title">没有符合条件的结果</div><div class="empty-sub">尝试调整筛选条件或生成新内容</div></div>`;
      return;
    }
    if (this.state.galleryView) {
      filtered.slice(0, 100).forEach(t => list.appendChild(this._buildGalleryCard(t)));
    } else {
      filtered.slice(0, 100).forEach(t => list.appendChild(this._buildTaskCard(t)));
    }
  },

  _bulkDeleteByFilter() {
    const tasks = Store.getTasks();
    const history = Store.getHistory();
    const all = [...tasks, ...history.filter(h => !tasks.find(t => t.id === h.id))];
    let filtered = this.state.filter === 'all' ? all : all.filter(t => t.model?.type === this.state.filter);
    if (this.state.dateFilter !== 'all') {
      const now = new Date();
      let cut;
      if (this.state.dateFilter === 'today') { cut = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(); }
      else if (this.state.dateFilter === 'week') { cut = now.getTime() - 7 * 86400000; }
      else if (this.state.dateFilter === 'month') { cut = new Date(now.getFullYear(), now.getMonth(), 1).getTime(); }
      filtered = filtered.filter(t => (t.createdAt || 0) >= cut);
    }
    if (this.state.resultSearch) {
      const q = this.state.resultSearch.toLowerCase();
      filtered = filtered.filter(t => (t.prompt || '').toLowerCase().includes(q) || (t.model?.name || '').toLowerCase().includes(q));
    }
    if (!filtered.length) { Toast.warning('当前筛选条件下没有可删除的结果'); return; }
    const filterDesc = [
      this.state.filter !== 'all' ? typeName(this.state.filter) : '全部',
      this.state.dateFilter !== 'all' ? { today: '今天', week: '本周', month: '本月' }[this.state.dateFilter] : '不限日期',
      this.state.resultSearch ? `"${this.state.resultSearch}"` : ''
    ].filter(Boolean).join(' · ');
    this._showModal('批量删除确认', `<div style="padding:16px"><div style="font-size:14px;margin-bottom:8px">将删除 <strong style="color:var(--danger)">${filtered.length}</strong> 个结果</div><div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">筛选条件: ${esc(filterDesc)}</div><div style="padding:10px;background:var(--danger-soft);border-radius:8px;font-size:12px;color:var(--danger)">此操作不可撤销，删除后将同时移除任务和历史记录。</div></div>`, [
      { label: '取消', fn: () => this._closeModal() },
      { label: '确认删除', primary: true, fn: () => { this._executeBulkDelete(filtered); } }
    ]);
  },

  _executeBulkDelete(items) {
    const ids = new Set(items.map(i => i.id));
    // Remove from tasks
    let tasks = Store.getTasks().filter(t => !ids.has(t.id));
    Store.saveTasks(tasks);
    // Remove from history
    let history = Store.getHistory().filter(h => !ids.has(h.id));
    storageSet(CONFIG.STORAGE_KEYS.HISTORY, JSON.stringify(history));
    this._closeModal();
    this._renderTaskList();
    this._renderActiveTasks();
    this._renderResultStrip();
    this.renderHistoryBadge();
    Toast.success(`已删除 ${items.length} 个结果`);
  },

  _toggleGalleryView() {
    this.state.galleryView = !this.state.galleryView;
    $('#galleryViewBtn').classList.toggle('active', this.state.galleryView);
    this._renderTaskList();
    Toast.info(this.state.galleryView ? '已切换到画廊视图' : '已切换到列表视图');
  },

  _buildGalleryCard(task) {
    const card = document.createElement('div');
    card.className = 'gallery-card';
    card.dataset.tid = task.id;
    const statusText = task.status === 'processing' ? '生成中' : task.status === 'succeeded' ? '成功' : task.status === 'failed' ? '失败' : '超时';
    const statusClass = task.status === 'failed' ? 'failed' : task.status === 'processing' ? 'processing' : '';
    let mediaHtml = '';
    if (task.status === 'succeeded' && task.result?.url) {
      const url = task.result.url;
      if (task.model?.type === 'image') mediaHtml = `<img src="${esc(url)}" loading="lazy" data-lightbox="${esc(url)}">`;
      else if (task.model?.type === 'video') mediaHtml = `<video src="${esc(url)}" muted></video>`;
      else if (task.model?.type === 'audio') mediaHtml = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:32px">🎵</div>`;
    } else if (task.status === 'processing') {
      mediaHtml = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--brand);font-size:28px;animation:spin 2s linear infinite">⏳</div>`;
    } else {
      mediaHtml = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--danger);font-size:28px">⚠</div>`;
    }
    const actionsHtml = task.status === 'succeeded' && task.result?.url ? `
      <button data-act="copy-url" title="复制URL">📋</button>
      <button data-act="download" title="下载">⬇</button>
      ${task.model?.type === 'image' ? '<button data-act="edit" title="编辑">✏</button>' : ''}
      <button data-act="copy-workflow" title="工作流">📋</button>
    ` : '';
    card.innerHTML = `
      <div class="gc-media">${mediaHtml}<span class="gc-badge ${statusClass}">${statusText}</span></div>
      <div class="gc-info">
        <div class="gc-model">${esc(task.model?.name || '')}</div>
        <div class="gc-prompt">${esc(trunc(task.prompt || '', 30))}</div>
      </div>
      ${actionsHtml ? `<div class="gc-actions">${actionsHtml}</div>` : ''}
    `;
    // Bind events
    const media = card.querySelector('[data-lightbox]');
    if (media) media.addEventListener('click', e => { e.stopPropagation(); const imgs = $$('[data-lightbox]').map(el => el.dataset.lightbox); this._openLightbox(imgs, imgs.indexOf(media.dataset.lightbox), false); });
    card.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'copy-url') copy(task.result?.url).then(ok => ok ? Toast.success('已复制') : Toast.error('复制失败'));
        else if (act === 'download') this._downloadFile(task.result?.url, `${task.model?.id}_${task.id}`);
        else if (act === 'edit') this._openEditor(task.result?.url);
        else if (act === 'copy-workflow') Workflow.copy(task);
      });
    });
    card.addEventListener('contextmenu', e => { e.preventDefault(); this._showContextMenu(e.clientX, e.clientY, task); });
    return card;
  },

  _buildTaskCard(task) {
    const card = document.createElement('div');
    card.className = 'task-card status-' + (task.status || 'processing');
    card.dataset.tid = task.id;
    card.dataset.type = task.model?.type || '';
    const statusText = task.status === 'processing' ? '生成中' : task.status === 'succeeded' ? '成功' : task.status === 'failed' ? '失败' : '超时';
    const costStr = task.cost != null ? `¥${task.cost.toFixed(2)}` : task.model?.price || '';
    let mediaHtml = '';
    if (task.status === 'succeeded' && task.result?.url) {
      const url = task.result.url;
      if (task.model.type === 'image') mediaHtml = `<div class="result-media"><img src="${esc(url)}" data-lightbox="${esc(url)}" loading="lazy"></div>`;
      else if (task.model.type === 'video') mediaHtml = `<div class="result-media"><video src="${esc(url)}" controls preload="metadata"></video></div>`;
      else if (task.model.type === 'audio') mediaHtml = `<div class="result-media"><audio src="${esc(url)}" controls></audio></div>`;
      mediaHtml += `<div class="result-url"><span>${esc(trunc(url, 80))}</span><button class="copy-url-btn" data-copy="${esc(url)}">复制</button></div>`;
    }
    let actionsHtml = '';
    if (task.status === 'succeeded' && task.result?.url) {
      actionsHtml = `
        <button class="action-btn" data-act="copy-url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制URL</button>
        <button class="action-btn" data-act="download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</button>
        <button class="action-btn" data-act="use-ref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>用作参考</button>
        ${task.model.type === 'image' ? '<button class="action-btn" data-act="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>编辑</button>' : ''}
        ${task.model.type === 'image' ? '<button class="action-btn" data-act="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>对比</button>' : ''}
        <button class="action-btn" data-act="regen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>重新生成</button>
        <button class="action-btn" data-act="copy-workflow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>复制工作流</button>
        <button class="action-btn danger" data-act="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除</button>
      `;
    } else if (task.status === 'processing') {
      const elapsed = task.createdAt ? fmtDur(Date.now() - task.createdAt) : '0:00';
      actionsHtml = `
        <div class="progress-bar"><div class="bar-fill" style="width:50%"></div></div>
        <div class="timer">已用 ${elapsed}</div>
        <button class="action-btn" data-act="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>刷新</button>
        <button class="action-btn danger" data-act="stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>停止</button>
        <button class="action-btn danger" data-act="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除</button>
      `;
    } else if (task.status === 'failed' || task.status === 'timeout') {
      const err = classifyErr(task.error || '未知错误');
      actionsHtml = `
        <div class="error-banner">
          <div class="err-category">${err.category}错误</div>
          <div class="err-hint">${esc(err.hint)}</div>
          <div class="err-actions"><button data-act="retry">重试</button><button data-act="copy-workflow">复制工作流</button></div>
        </div>
        <button class="action-btn danger" data-act="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除</button>
      `;
    }
    card.innerHTML = `
      <div class="card-top">
        <span class="status-pill ${task.status}">${statusText}</span>
        <span class="card-model">${esc(task.model?.name || '')}</span>
        <span class="card-cost">${esc(costStr)}</span>
      </div>
      <div class="card-body">
        ${task.prompt ? `<div class="card-prompt">${esc(trunc(task.prompt, 200))}</div>` : ''}
        <div class="card-meta">${task.model?.type ? `<span class="meta-tag">${typeName(task.model.type)}</span>` : ''}<span class="meta-tag">${fmtTime(task.createdAt)}</span></div>
        <div class="task-id">${esc(task.id)}</div>
        ${mediaHtml}
        <div class="result-actions">${actionsHtml}</div>
      </div>
    `;
    this._bindCardEvents(card, task);
    return card;
  },

  _bindCardEvents(card, task) {
    card.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'copy-url') copy(task.result?.url).then(ok => ok ? Toast.success('已复制') : Toast.error('复制失败'));
      else if (act === 'download') this._downloadFile(task.result?.url, `${task.model?.id}_${task.id}`);
      else if (act === 'use-ref') this._useAsReference(task.result?.url, task.model?.type);
      else if (act === 'edit') this._openEditor(task.result?.url);
      else if (act === 'compare') this._toggleCompare(task);
      else if (act === 'regen') this._regen(task);
      else if (act === 'copy-workflow') Workflow.copy(task);
      else if (act === 'delete') this._deleteTask(task.id);
      else if (act === 'refresh') poller.manualRefresh(task.id);
      else if (act === 'stop') poller.manualStop(task.id);
      else if (act === 'retry') this._retryTask(task);
    });
    card.addEventListener('contextmenu', e => {
      e.preventDefault();
      this._showContextMenu(e.clientX, e.clientY, task);
    });
    const img = card.querySelector('[data-lightbox]');
    if (img) img.addEventListener('click', e => { e.stopPropagation(); const imgs = $$('[data-lightbox]').map(el => el.dataset.lightbox); this._openLightbox(imgs, imgs.indexOf(img.dataset.lightbox), false); });
    const copyUrlBtn = card.querySelector('[data-copy]');
    if (copyUrlBtn) copyUrlBtn.addEventListener('click', e => { e.stopPropagation(); copy(copyUrlBtn.dataset.copy).then(ok => ok ? Toast.success('已复制') : Toast.error('复制失败')); });
  },

  _showContextMenu(x, y, task) {
    const menu = $('#contextMenu');
    const items = [];
    if (task.status === 'succeeded' && task.result?.url) {
      items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>', label: '复制结果 URL', act: () => copy(task.result.url).then(ok => ok ? Toast.success('已复制') : Toast.error('复制失败')) });
      items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>', label: '下载结果', act: () => this._downloadFile(task.result.url, `${task.model?.id}_${task.id}`) });
      items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>', label: '用作参考素材', act: () => this._useAsReference(task.result.url, task.model?.type) });
      if (task.model?.type === 'image') {
        items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>', label: '编辑图片', act: () => this._openEditor(task.result.url) });
        items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>', label: '加入对比', act: () => this._toggleCompare(task) });
      }
      items.push({ divider: true });
    }
    if (task.status === 'failed' || task.status === 'timeout') {
      items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>', label: '重试', act: () => this._retryTask(task) });
      items.push({ divider: true });
    }
    if (task.status === 'processing') {
      items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>', label: '手动刷新', act: () => poller.manualRefresh(task.id) });
      items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>', label: '停止任务', act: () => poller.manualStop(task.id) });
      items.push({ divider: true });
    }
    items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>', label: '重新生成', act: () => this._regen(task) });
    items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>', label: '复制工作流', act: () => Workflow.copy(task) });
    items.push({ divider: true });
    items.push({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>', label: '删除', danger: true, act: () => this._deleteTask(task.id) });
    const itemsHtml = items.map(it => it.divider ? '<div class="ctx-divider"></div>' : `<div class="ctx-item${it.danger ? ' danger' : ''}" data-ctx>${it.icon}<span>${esc(it.label)}</span></div>`).join('');
    $('#contextMenuItems').innerHTML = itemsHtml;
    menu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - items.length * 36 - 20) + 'px';
    menu.classList.add('show');
    $$('#contextMenu [data-ctx]').forEach((el, i) => {
      el.addEventListener('click', () => {
        const item = items[i];
        menu.classList.remove('show');
        if (item && item.act) item.act();
      });
    });
  },

  _updateTaskCard(task) {
    const card = $(`[data-tid="${task.id}"]`);
    if (!card) { this._renderTask(task); return; }
    const newCard = this._buildTaskCard(task);
    card.replaceWith(newCard);
  },

  _renderActiveTasks() {
    const panel = $('#activeTasksPanel');
    const tasks = Store.getTasks().filter(t => t.status === 'processing');
    if (!tasks.length) { panel.classList.add('empty'); panel.innerHTML = ''; return; }
    panel.classList.remove('empty');
    panel.innerHTML = `<div class="atp-header"><span class="ping-dot"></span> ${tasks.length} 个任务生成中</div><div class="atp-list">${tasks.map(t => `<div class="atp-card" data-tid="${t.id}"><span class="atp-model">${esc(t.model?.name || '')}</span><span class="atp-phase">${esc(poller.getPhaseName(Date.now() - t.createdAt))}</span><span class="atp-timer">${fmtDur(Date.now() - t.createdAt)}</span><button class="atp-cancel" data-cancel="${t.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`).join('')}</div>`;
    panel.querySelectorAll('[data-cancel]').forEach(btn => btn.addEventListener('click', () => poller.manualStop(btn.dataset.cancel)));
  },

  _renderResultStrip() {
    const strip = $('#resultStrip');
    const history = Store.getHistory().filter(h => h.status === 'succeeded' && h.result?.url).slice(0, 10);
    if (!history.length) { strip.classList.add('empty'); strip.innerHTML = ''; return; }
    strip.classList.remove('empty');
    strip.innerHTML = history.map(h => {
      const url = h.result.url;
      const isVideo = h.model?.type === 'video';
      const media = isVideo ? `<video src="${esc(url)}" muted></video>` : `<img src="${esc(url)}" loading="lazy">`;
      return `<div class="strip-thumb" data-url="${esc(url)}" data-video="${isVideo}">${media}</div>`;
    }).join('');
    strip.querySelectorAll('.strip-thumb').forEach(el => el.addEventListener('click', () => { const urls = history.map(h => h.result.url); const idx = urls.indexOf(el.dataset.url); this._openLightbox(urls, idx, el.dataset.video === 'true'); }));
  },

  _deleteTask(taskId) {
    let tasks = Store.getTasks().filter(t => t.id !== taskId);
    Store.saveTasks(tasks);
    const card = $(`[data-tid="${taskId}"]`);
    if (card) card.remove();
    this._renderActiveTasks();
    this._renderResultStrip();
    if (!$$('#resultList .task-card').length) this._renderTaskList();
  },

  _clearScreen() {
    $('#resultList').innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg><div class="empty-title">还没有生成结果</div><div class="empty-sub">填写提示词后点击「生成」开始创作</div></div>`;
    $('#activeTasksPanel').classList.add('empty');
  },

  _downloadFile(url, name) {
    if (!url) return;
    const a = document.createElement('a'); a.href = url; a.download = name || 'download'; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove();
  },

  _useAsReference(url, type) {
    if (!url) return;
    const refType = type === 'video' ? 'ref-video' : 'ref-image';
    const param = this.state.model.params.find(p => p.type === refType);
    if (!param) { Toast.warning('当前模型不支持参考' + (type === 'video' ? '视频' : '图片')); return; }
    this._addUrlRef(param.key, url);
    Toast.success('已添加为参考素材');
  },

  _regen(task) {
    if (task.model?.id) {
      this.switchTab(task.model.type);
      setTimeout(() => {
        this.renderParamForm(task.model.id);
        for (const p of task.model.params) {
          if (p.type === 'textarea') { const el = $('[data-key="' + p.key + '"]'); if (el) el.value = task.prompt || ''; }
          else if (p.type !== 'ref-image' && p.type !== 'ref-video' && p.type !== 'ref-audio') { const el = $('[data-key="' + p.key + '"]'); if (el && task.body?.[p.key] != null) el.value = task.body[p.key]; }
        }
        this._updateEstimate();
        Toast.info('参数已恢复');
      }, 50);
    }
  },

  _retryTask(task) {
    const newTask = { ...task, id: genId(), status: 'processing', createdAt: Date.now(), apiId: null, error: null };
    delete newTask.completedAt;
    Api.submit(task.model, task.body).then(res => {
      newTask.apiId = res.id;
      const tasks = Store.getTasks();
      tasks.unshift(newTask);
      Store.saveTasks(tasks);
      this._renderTask(newTask);
      this._renderActiveTasks();
      poller.start(newTask);
      Toast.success('已重新提交');
    }).catch(e => Toast.error(e.message));
  },

  /* ---------- COMPARE ---------- */
  _toggleCompare(task) {
    const idx = this.state.compareList.findIndex(t => t.id === task.id);
    if (idx >= 0) this.state.compareList.splice(idx, 1);
    else { if (this.state.compareList.length >= 3) { Toast.warning('最多对比 3 个'); return; } this.state.compareList.push(task); }
    this._renderCompareBar();
  },

  /* ---------- HISTORY ---------- */
  renderHistoryBadge() {
    const count = Store.getTasks().filter(t => t.status === 'processing').length;
    const badge = $('#historyBadge');
    if (count) { badge.textContent = count; badge.classList.add('show'); }
    else badge.classList.remove('show');
  },

  _openHistory() {
    this.renderHistory();
    $('#historySidebar').classList.add('show');
    $('#historyOverlay').classList.add('show');
  },

  _closeHistory() { $('#historySidebar').classList.remove('show'); $('#historyOverlay').classList.remove('show'); },

  renderHistory() {
    const list = $('#historyList');
    let items = Store.getHistory();
    // Sort: favorites first, then by createdAt desc
    items.sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || (b.createdAt - a.createdAt));
    if (this.state.historyFilter !== 'all') items = items.filter(h => h.model?.type === this.state.historyFilter);
    if (this.state.historySearch) { const q = this.state.historySearch.toLowerCase(); items = items.filter(h => (h.prompt || '').toLowerCase().includes(q) || (h.model?.name || '').toLowerCase().includes(q)); }
    if (!items.length) { list.innerHTML = '<div class="empty-state" style="padding:40px 20px"><div class="empty-sub">暂无历史记录</div></div>'; return; }
    const now = Date.now();
    const groups = { 收藏: [], 今天: [], 昨天: [], 本周: [], 更早: [] };
    items.forEach(h => {
      if (h.favorite) { groups['收藏'].push(h); return; }
      const age = now - h.createdAt;
      if (age < 86400000) groups['今天'].push(h);
      else if (age < 2 * 86400000) groups['昨天'].push(h);
      else if (age < 7 * 86400000) groups['本周'].push(h);
      else groups['更早'].push(h);
    });
    let html = '';
    for (const [label, arr] of Object.entries(groups)) {
      if (!arr.length) continue;
      const icon = label === '收藏' ? '★' : '';
      html += `<div class="history-day-group"><div class="history-day-label" ${label==='收藏'?'style="color:var(--warning)"':''}>${icon} ${label}（${arr.length}）</div>`;
      html += arr.map(h => {
        const thumb = h.result?.url ? (h.model?.type === 'video' ? `<video src="${esc(h.result.url)}" muted></video>` : `<img src="${esc(h.result.url)}" loading="lazy">`) : '';
        const statusClass = h.status === 'succeeded' ? '' : 'style="opacity:.5"';
        const starColor = h.favorite ? 'var(--warning)' : 'var(--text-dim)';
        return `<div class="history-item" data-hid="${esc(h.id)}" ${statusClass}><div class="h-thumb">${thumb}</div><div class="h-info"><div class="h-model">${esc(h.model?.name || '')}</div><div class="h-prompt">${esc(trunc(h.prompt, 40))}</div><div class="h-time">${fmtTime(h.createdAt)} <button class="fav-btn" data-fav="${esc(h.id)}" style="color:${starColor};background:none;border:none;cursor:pointer;padding:2px 4px;font-size:14px">${h.favorite ? '★' : '☆'}</button></div></div></div>`;
      }).join('');
      html += '</div>';
    }
    list.innerHTML = html;
    list.querySelectorAll('[data-hid]').forEach(el => el.addEventListener('click', e => { if (e.target.closest('[data-fav]')) return; const h = Store.getHistory().find(x => x.id === el.dataset.hid); if (h) this._showHistoryDetail(h); }));
    list.querySelectorAll('[data-fav]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); Store.toggleFavorite(btn.dataset.fav); this.renderHistory(); }));
  },

  _showHistoryDetail(h) {
    const statusText = h.status === 'succeeded' ? '成功' : h.status === 'failed' ? '失败' : '超时';
    let html = `<div class="kv-row"><div class="k">模型</div><div class="v">${esc(h.model?.name || '')}</div></div>`;
    html += `<div class="kv-row"><div class="k">状态</div><div class="v">${statusText}</div></div>`;
    html += `<div class="kv-row"><div class="k">时间</div><div class="v">${fmtTime(h.createdAt)}</div></div>`;
    html += `<div class="kv-row"><div class="k">收藏</div><div class="v"><button id="detailFavBtn" style="background:none;border:none;cursor:pointer;font-size:16px;color:${h.favorite ? 'var(--warning)' : 'var(--text-dim)'}">${h.favorite ? '★ 已收藏' : '☆ 点击收藏'}</button></div></div>`;
    if (h.prompt) html += `<div class="kv-row"><div class="k">提示词</div><div class="v">${esc(h.prompt)}</div></div>`;
    if (h.result?.url) html += `<div class="kv-row"><div class="k">结果</div><div class="v"><a href="${esc(h.result.url)}" target="_blank">${esc(trunc(h.result.url, 60))}</a></div></div>`;
    if (h.error) html += `<div class="kv-row"><div class="k">错误</div><div class="v" style="color:var(--danger)">${esc(h.error)}</div></div>`;
    if (h.body) {
      html += '<div style="margin-top:12px;font-size:12px;font-weight:600;color:var(--text-dim)">生成参数</div>';
      for (const [k, v] of Object.entries(h.body)) { if (k === 'prompt' || k === 'text') continue; html += `<div class="kv-row"><div class="k">${esc(k)}</div><div class="v">${esc(Array.isArray(v) ? v.join(', ') : v)}</div></div>`; }
    }
    this._showModal(`${h.model?.name || '详情'} · ${statusText}`, html, [
      { label: '复制工作流', primary: true, fn: () => Workflow.copy(h) },
      { label: '再用参数', fn: () => this._regen(h) },
      { label: '关闭', fn: () => this._closeModal() }
    ]);
    setTimeout(() => {
      const favBtn = $('#detailFavBtn');
      if (favBtn) favBtn.addEventListener('click', () => { Store.toggleFavorite(h.id); this.renderHistory(); this._showHistoryDetail(Store.getHistory().find(x => x.id === h.id) || h); });
    }, 50);
  },

  _exportHistory() {
    const data = JSON.stringify(Store.getHistory(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `workbench_history_${Date.now()}.json`; a.click();
    Toast.success('已导出');
  },

  _importHistory(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const imported = JSON.parse(e.target.result);
        const arr = Store.getHistory();
        const ids = new Set(arr.map(h => h.id));
        imported.forEach(h => { if (!ids.has(h.id)) arr.push(h); });
        while (arr.length > 500) arr.pop();
        arr.sort((a, b) => b.createdAt - a.createdAt);
        storageSet(CONFIG.STORAGE_KEYS.HISTORY, JSON.stringify(arr));
        this.renderHistory();
        Toast.success(`已导入 ${imported.length} 条`);
      } catch { Toast.error('导入失败：文件格式错误'); }
    };
    reader.readAsText(file);
  },

  _showStats() {

  _renderStatsContent(range) {
    const history = Store.getHistory();
    const now = Date.now();
    const ranges = { today: 86400000, week: 7 * 86400000, month: 30 * 86400000, all: Infinity };
    const cut = now - ranges[range];
    const filtered = history.filter(h => h.createdAt >= cut);
    const total = filtered.filter(h => h.status === 'succeeded').reduce((s, h) => s + (h.cost || 0), 0);
    const byType = { image: 0, video: 0, audio: 0 };
    const byModel = {};
    filtered.filter(h => h.status === 'succeeded').forEach(h => { byType[h.model?.type] = (byType[h.model?.type] || 0) + (h.cost || 0); byModel[h.model?.name] = (byModel[h.model?.name] || 0) + (h.cost || 0); });
    const maxModel = Math.max(1, ...Object.values(byModel));
    let html = `<div class="stats-summary"><div class="stats-card"><div class="sc-label">总消费</div><div class="sc-value">¥${total.toFixed(2)}</div></div><div class="stats-card"><div class="sc-label">总任务</div><div class="sc-value">${filtered.length}</div></div><div class="stats-card"><div class="sc-label">成功</div><div class="sc-value">${filtered.filter(h => h.status === 'succeeded').length}</div></div></div>`;
    html += '<div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:8px">按类型</div>';
    for (const [t, c] of Object.entries(byType)) html += `<div class="stats-bar-row"><div class="sbr-label"><span>${typeName(t)}</span><span>¥${c.toFixed(2)}</span></div><div class="sbr-bar"><div class="sbr-fill" style="width:${total ? (c / total * 100) : 0}%"></div></div></div>`;
    html += '<div style="font-size:12px;font-weight:600;color:var(--text-dim);margin:12px 0 8px">按模型</div>';
    for (const [m, c] of Object.entries(byModel).sort((a, b) => b[1] - a[1])) html += `<div class="stats-bar-row"><div class="sbr-label"><span>${esc(m)}</span><span>¥${c.toFixed(2)}</span></div><div class="sbr-bar"><div class="sbr-fill" style="width:${c / maxModel * 100}%"></div></div></div>`;
    html += `<div class="energy-card"><div class="ec-title">补充能量</div><div class="ec-sub">支持开发者持续优化</div><button class="ec-btn" id="energyPayBtn">微信支付</button><div class="energy-qr" id="energyQr" style="display:none"></div></div>`;
    $('#statsContent').innerHTML = html;
    $('#energyPayBtn').addEventListener('click', () => this._openEnergyPayment());
  },
